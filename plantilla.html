<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITULO__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F8F9; --panel:#FFFFFF; --band:#EEF3F5; --ink:#16262B; --muted:#4A6572; --line:#C9D1D6;
  /* Una sola paleta para todas las regiones (la verde de hombro): no depende de CONFIG.DARK */
  --accent:#1F5F4E; --on-accent:#FFFFFF; --focus:#0B5CAD;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1517; --panel:#162124; --band:#1D2B2F; --ink:#E7EEF0; --muted:#9DB4BD; --line:#2F4147;
    --accent:#5CC0A3; --on-accent:#06231B; --focus:#7DB8F0;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1517; --panel:#162124; --band:#1D2B2F; --ink:#E7EEF0; --muted:#9DB4BD; --line:#2F4147;
  --accent:#5CC0A3; --on-accent:#06231B; --focus:#7DB8F0;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:17px/1.5 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:4px;min-height:56px;padding:4px 14px 4px 6px}
#back{appearance:none;flex:none;width:48px;height:48px;border:0;background:none;font-size:30px;line-height:1;cursor:pointer;color:var(--ink)}
#back[hidden]{display:none}
#titulo{font-weight:700;font-size:19px;line-height:1.2;min-width:0;overflow-wrap:anywhere}
header.home{padding-left:14px}

main{max-width:640px;margin:0 auto;padding:14px 14px 40px}
.sub{color:var(--muted);font-size:15px;margin:0 0 14px}
.nota{color:var(--muted);font-size:15px;font-style:italic;margin:12px 0}
.pre{white-space:pre-line}
.band{background:var(--band);border-radius:6px;padding:10px 12px;margin:0 0 12px;font-size:15px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;margin:0 0 10px}
.card h3{font-size:15px;font-weight:700;color:var(--accent);margin:0 0 4px}
.card p{margin:0}
.card p + p{margin-top:8px}
.card .lab{display:block;font-size:14px;color:var(--muted);margin-bottom:1px}
.card.key{border:2px solid var(--accent)}
.card .nombre{font-size:18px;font-weight:700;color:var(--ink);margin:0 0 6px}
/* URGENCIA: borde grueso negro, no rojo (decisión de la tarjeta en papel; ver CLAUDE.md) */
.card.urgencia{border:3px solid var(--ink)}
.card.urgencia .nombre{font-size:17px}

.nav,.big{appearance:none;display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:12px 14px;margin:0 0 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer;min-height:64px}
.nav .tx,.big .tx{flex:1;min-width:0}
.nav b,.big b{display:block;font-size:18px;line-height:1.25}
.nav span,.big span{display:block;font-size:15px;color:var(--muted);margin-top:2px}
.nav i,.big i{flex:none;font-style:normal;font-size:24px;color:var(--muted)}
.nodo{display:flex;gap:10px}
.nodo .n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-weight:700;
  display:grid;place-items:center;font-size:15px}
.nodo p{flex:1;min-width:0}
.acciones{margin:10px 0 0;display:flex;flex-direction:column;gap:6px}
.acciones .big{margin:0;min-height:52px;padding:8px 12px}
.acciones .big b{font-size:16px}

details{background:var(--panel);border:1px solid var(--line);border-radius:6px;margin:0 0 8px;padding:0 12px}
summary{min-height:52px;display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;font-size:24px;font-weight:400;color:var(--muted)}
details[open] > summary::after{content:"–"}
details[open] > summary{border-bottom:1px solid var(--line);margin-bottom:10px}
details .in{padding-bottom:12px}
details .in p{margin:0 0 10px}
details .in p:last-child{margin-bottom:0}
details .in .lab{display:block;font-size:14px;color:var(--muted)}
summary .st{flex:1;min-width:0;padding:8px 0}
summary .st b{display:block;line-height:1.25}
summary .st span{display:block;font-size:15px;font-weight:400;color:var(--muted)}
.grupo{font-size:16px;color:var(--accent);margin:20px 0 8px}
.grupo-sub{color:var(--muted);font-size:15px;margin:-4px 0 10px}
.card[id^="nodo-"]{scroll-margin-top:68px}
.marca{display:flex;gap:6px;margin-top:12px}
.marca button{appearance:none;flex:1 1 0;min-height:48px;padding:6px 4px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;font-size:15px}
.marca button[aria-pressed="true"][data-v="hecho"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.marca button[aria-pressed="true"][data-v="dudoso"]{border:3px solid var(--ink);background:var(--band);font-weight:700}
.marca button[aria-pressed="true"][data-v="na"]{border-style:dashed;background:var(--band);color:var(--muted);font-weight:700}
.pasos{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.paso{appearance:none;min-width:56px;min-height:44px;padding:4px 10px;border:1px solid var(--line);border-radius:22px;background:var(--panel);cursor:pointer;font-weight:700}
.paso[data-e="hecho"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.paso[data-e="dudoso"]{border:3px solid var(--ink);background:var(--band)}
.paso[data-e="na"]{border-style:dashed;background:var(--band);color:var(--muted)}
.cabrec{display:flex;flex:1;min-width:0;gap:6px;overflow-x:auto;padding:4px 0}
.cabrec[hidden]{display:none}
.cabrec .paso{flex:none;min-width:48px;min-height:40px;padding:2px 10px}
.rec .lin{font-size:15px;margin:0 0 4px}
.rec .ghost{appearance:none;margin-top:8px;min-height:44px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer}
.cond + .cond{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.cond .nombre{font-weight:700;font-size:17px;margin:0 0 2px}
.cond .dice{color:var(--muted);font-size:15px;margin:0 0 6px}

</style>
</head>
<body>
<header id="cab"><button id="back" type="button" aria-label="Volver" hidden>‹</button><div id="titulo"></div><div class="cabrec" id="cabRec" hidden aria-label="Recorrido del árbol"></div></header>
<main id="main"></main>

<script>
const DATA = __DATA__;

// ════════════════════════════════════════════════════════════════
//  Datos de la región: la tarjeta (tarjeta_<región>.js) más los campos
//  propios de la SPA (spa_<región>.js), fundidos por datos.js.
//    REGION NOMBRE · TITULOS BANDERAS BISAGRA ARBOL SINDROMES
//    ORIENTATIVA? PRONOSTICO · ENLACES? PRONOSTICO_DE? FICHAS?
//    ORIENTATIVA_GRUPOS? CORTE_NOTA?
//  Aquí no hay texto de ninguna región: los rótulos o salen de la tarjeta
//  o son de la SPA y valen igual para todas.
// ════════════════════════════════════════════════════════════════
const REGION = DATA.NOMBRE;

// ════════════════════════════════════════════════════════════════
//  Utilidades
// ════════════════════════════════════════════════════════════════
const sp = t => (t || '').replace(/[ \t]{2,}/g, ' ').trim();
const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
const min1 = s => s.charAt(0).toLowerCase() + s.slice(1);
const bloque = (n, txt) => 'Bloque ' + n + (txt ? ' · ' + txt : '');
// Los títulos de la tarjeta vienen como «Título — qué es» o «Título · qué es»:
// la primera parte titula la pantalla y la segunda la describe.
const partir = (t, sep) => { const i = (t || '').indexOf(sep); return i < 0 ? [sp(t), ''] : [sp(t.slice(0, i)), sp(t.slice(i + sep.length))]; };
const frase1 = t => partir(t, '. ')[0];

function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, val] of Object.entries(props || {})) {
    if (k === 'class') e.className = val;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), val);
    else if (val === true) e.setAttribute(k, '');
    else if (val !== false && val != null) e.setAttribute(k, val);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(c));
  }
  return e;
}

// ════════════════════════════════════════════════════════════════
//  Lectura de los datos
// ════════════════════════════════════════════════════════════════
const ARBOL = Object.fromEntries(DATA.ARBOL.filas.map(([n, t]) => [n, t]));
const ENLACES = DATA.ENLACES || {};
const FICHAS = DATA.FICHAS || {};
const GRUPOS = DATA.ORIENTATIVA_GRUPOS || null;
const sind = n => DATA.SINDROMES.filas.find(f => f[0] === n);
const pron = n => DATA.PRONOSTICO.filas.find(f => f[0] === ((DATA.PRONOSTICO_DE || {})[n] || n));

// Rótulos que salen de la propia tarjeta
const [TIT_BANDERAS, SUB_BANDERAS] = partir(DATA.BANDERAS.titulo, ' — ');
const [TIT_ORIENT, SUB_ORIENT] = partir(DATA.ORIENTATIVA ? DATA.ORIENTATIVA.titulo : '', ' · ');
const TIT_AVISO = frase1(DATA.SINDROMES.aviso);

// Nodo que reparte la pregunta en botones (ENLACES[n].patrones): su primera línea
// son pares «condición → ETIQUETA» y el resto de líneas cierra el árbol como nota.
const NODO_PATRONES = Object.keys(ENLACES).find(n => ENLACES[n].patrones) || null;
function patrones(n) {
  const mapa = ENLACES[n].patrones, l = ARBOL[n].split('\n')[0], i = l.indexOf('? ');
  return (i < 0 ? l : l.slice(i + 2)).split(' · ').map(s => {
    const [cond, et] = s.split(' → ');
    return { cond: sp(cond), clave: mapa[sp(et).replace(/\.$/, '')] };
  }).filter(p => p.clave);
}
const PATRONES = NODO_PATRONES ? patrones(NODO_PATRONES) : [];
const CLAVE_PATRON = Object.fromEntries(PATRONES.map(p => [p.clave, p.cond]));
const CIERRE = NODO_PATRONES ? ARBOL[NODO_PATRONES].split('\n').slice(1).join('\n') : '';
// La nota del pronóstico se parte en dos párrafos por CORTE_NOTA; el texto no se toca
const NOTAS_PRON = (() => {
  const t = DATA.PRONOSTICO.nota, i = DATA.CORTE_NOTA ? t.indexOf(DATA.CORTE_NOTA) : -1;
  return i < 0 ? [t] : [t.slice(0, i).trim(), t.slice(i).trim()];
})();

// ════════════════════════════════════════════════════════════════
//  Navegación (pila propia + botón Atrás de Android)
// ════════════════════════════════════════════════════════════════
let pila = [{ p: 'home' }];
let hist = false;
// Recorrido del árbol: solo en memoria (se borra al recargar); no se guarda nada en el navegador
let marcas = {};   // nodo -> 'hecho' | 'dudoso' | 'na'
let vistas = [];   // fichas de síndrome abiertas desde el árbol, en orden
const ESTADOS = [['hecho', '✓ Hecho'], ['dudoso', '? Dudoso'], ['na', '– No aplica']];
const SIMBOLO = { hecho: '✓', dudoso: '?', na: '–' };
function ir(p, arg) {
  if (p === 'sindrome' && !vistas.includes(arg)) vistas.push(arg);
  pila.push({ p, arg });
  try { history.pushState({ n: pila.length }, ''); hist = true; } catch (e) {}
  render(true);
}
function volver() {
  if (pila.length <= 1) return;
  if (hist) { try { history.back(); return; } catch (e) {} }
  pila.pop(); render(true);
}
// Si la ficha ya es la pantalla anterior, vuelve en vez de apilar otra igual
function irAFicha(clave) {
  const prev = pila[pila.length - 2];
  if (prev && prev.p === 'sindrome' && prev.arg === clave) volver(); else ir('sindrome', clave);
}
window.addEventListener('popstate', () => { if (pila.length > 1) { pila.pop(); render(true); } });

// ════════════════════════════════════════════════════════════════
//  Componentes
// ════════════════════════════════════════════════════════════════
const nav = (titulo, sub, fn) => h('button', { type: 'button', class: 'nav', onclick: fn },
  h('div', { class: 'tx' }, h('b', {}, titulo), sub ? h('span', {}, sub) : null), h('i', { 'aria-hidden': 'true' }, '›'));
const big = (titulo, sub, fn) => h('button', { type: 'button', class: 'big', onclick: fn },
  h('div', { class: 'tx' }, h('b', {}, titulo), sub ? h('span', {}, sub) : null), h('i', { 'aria-hidden': 'true' }, '›'));
const nota = t => h('p', { class: 'nota pre' }, sp(t));
const pie = t => h('p', { class: 'nota' }, sp(t));
const seccion = (titulo, texto) => h('section', { class: 'card' }, h('h3', {}, titulo), h('p', { class: 'pre' }, sp(texto)));
const plegable = (titulo, contenido, abierto) => h('details', { open: !!abierto }, h('summary', {}, titulo), h('div', { class: 'in' }, contenido));
// Celdas de una fila con la etiqueta de su columna
const columnas = (fila, cabecera) => fila.slice(1).map((c, i) => h('p', {}, h('span', { class: 'lab' }, cabecera[i + 1]), sp(c)));
// URGENCIA (opcional): mismo criterio visual que en el papel (borde grueso, sin rojo), líneas literales
const urgencia = U => U && h('section', { class: 'card urgencia' }, h('p', { class: 'nombre' }, U.titulo), U.lineas.map(l => h('p', { class: 'pre' }, sp(l))));
// Botón a un destino fijo de ENLACES: { pantalla, fila?, sub? }
function botonDestino(d) {
  if (d.pantalla === 'banderas') return big(TIT_BANDERAS, d.sub, () => ir('banderas'));
  if (d.pantalla === 'orientativa') return DATA.ORIENTATIVA ? big(TIT_ORIENT, d.sub, () => ir('orientativa')) : null;
  if (d.pantalla === 'sindrome') return sind(d.fila) ? big(d.fila, d.sub, () => irAFicha(d.fila)) : null;
  return null;
}

// ════════════════════════════════════════════════════════════════
//  Pantallas
// ════════════════════════════════════════════════════════════════
function pHome() {
  const n = [
    urgencia(DATA.URGENCIA),
    h('p', { class: 'sub' }, 'Tarjeta de consulta · guía clínica de ' + DATA.REGION),
    nav(TIT_BANDERAS, bloque(3, DATA.BANDERAS.filas.length + ' sospechas'), () => ir('banderas')),
    nav('Bisagra y árbol', bloque(4, 'pasivo y ' + DATA.ARBOL.filas.length + ' pasos · fichas de síndrome'), () => ir('arbol'))
  ];
  return { titulo: REGION, home: true, nodes: n };
}

function pBanderas() {
  const B = DATA.BANDERAS;
  return { titulo: TIT_BANDERAS, nodes: [
    h('p', { class: 'sub' }, bloque(3, SUB_BANDERAS ? SUB_BANDERAS + '.' : '')),
    B.filas.map(f => h('section', { class: 'card' },
      h('p', { class: 'nombre' }, f[0]),
      f.slice(1).map((c, i) => h('p', {}, h('span', { class: 'lab' }, B.cabecera[i + 1]), c)))),
    nota(B.nota), pie(DATA.TITULOS.pieA2)
  ] };
}

const preguntaNodo = t => { const l = t.split('\n')[0]; const k = l.indexOf('?'); return sp(k < 0 ? l : l.slice(0, k + 1)); };
function marcar(n, e) { if (marcas[n] === e) delete marcas[n]; else marcas[n] = e; render(); }
function irANodo(n) { const el = document.getElementById('nodo-' + n); if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
const controlMarca = n => h('div', { class: 'marca', role: 'group', 'aria-label': 'Marcar nodo ' + n },
  ESTADOS.map(([e, t]) => h('button', { type: 'button', 'data-v': e, 'aria-pressed': String(marcas[n] === e), onclick: () => marcar(n, e) }, t)));

function chipsRecorrido() {
  return DATA.ARBOL.filas.map(f => f[0]).map(n => h('button', { type: 'button', class: 'paso', 'data-e': marcas[n] || '',
    'aria-label': 'Nodo ' + n + (marcas[n] ? ': ' + marcas[n] : ': sin marcar'), onclick: () => irANodo(n) },
    n + ' ' + (marcas[n] ? SIMBOLO[marcas[n]] : '·')));
}
// Cuando las cápsulas del panel salen de la pantalla por arriba, la cabecera muestra el recorrido en lugar del título
function actualizarCab() {
  const cur = pila[pila.length - 1], pasos = document.getElementById('recPasos');
  let modo = false;
  if (cur.p === 'arbol' && pasos) modo = pasos.getBoundingClientRect().bottom <= $('#cab').getBoundingClientRect().bottom;
  $('#titulo').hidden = modo; $('#cabRec').hidden = !modo;
}
window.addEventListener('scroll', actualizarCab, { passive: true });

function panelRecorrido() {
  const filas = DATA.ARBOL.filas, nodos = filas.map(f => f[0]);
  const cuenta = e => nodos.filter(n => marcas[n] === e).length;
  const dud = nodos.filter(n => marcas[n] === 'dudoso'), sin = nodos.filter(n => !marcas[n]);
  const alguna = nodos.some(n => marcas[n]);
  const texto = n => preguntaNodo(filas.find(f => f[0] === n)[1]);
  return h('section', { class: 'card rec', id: 'recorrido' },
    h('h3', {}, 'Recorrido'),
    h('div', { class: 'pasos', id: 'recPasos' }, chipsRecorrido()),
    !alguna ? h('p', { class: 'lin' }, 'Marca cada nodo al repasarlo: hecho, dudoso o no aplica.') : [
      h('p', { class: 'lin' }, 'Hechos ' + cuenta('hecho') + ' · Dudosos ' + dud.length + ' · No aplica ' + cuenta('na') + ' · Sin marcar ' + sin.length),
      dud.length ? [h('p', { class: 'lin' }, h('b', {}, 'Revisar')), dud.map(n => h('p', { class: 'lin' }, n + ' · ' + texto(n)))] : null,
      sin.length ? h('p', { class: 'lin' }, h('b', {}, 'Sin marcar: '), sin.join(', ')) : null],
    vistas.length ? h('p', { class: 'lin', style: 'color:var(--muted)' }, 'Fichas abiertas: ' + vistas.join(', ')) : null,
    alguna || vistas.length ? h('button', { type: 'button', class: 'ghost', onclick: () => { marcas = {}; vistas = []; render(); } }, 'Limpiar recorrido') : null);
}

// Botones de un nodo: los destinos fijos y, si reparte patrones, uno por patrón
function botonesNodo(n) {
  const e = ENLACES[n];
  if (!e) return null;
  const bs = (e.botones || []).map(botonDestino).filter(Boolean);
  if (n === NODO_PATRONES) for (const p of PATRONES) bs.push(big(p.clave, cap1(p.cond), () => irAFicha(p.clave)));
  return bs.length ? bs : null;
}

function pArbol() {
  const B = DATA.BISAGRA;
  const nodos = DATA.ARBOL.filas.map(([n, t]) => {
    const bs = botonesNodo(n);
    // el nodo que reparte patrones enseña solo la pregunta: los patrones son los botones
    const texto = n === NODO_PATRONES ? sp(t.split('\n')[0].split('? ')[0]) + '?' : sp(t);
    return h('section', { class: 'card', id: 'nodo-' + n },
      h('div', { class: 'nodo' }, h('span', { class: 'n' }, n), h('p', { class: 'pre' }, texto)),
      bs ? h('div', { class: 'acciones' }, bs) : null,
      controlMarca(n));
  });
  return { titulo: 'Bisagra y árbol', nodes: [
    h('p', { class: 'sub' }, bloque(4, 'revisa el recorrido de arriba abajo.')),
    h('div', { class: 'band pre' }, sp(DATA.SINDROMES.aviso)),
    panelRecorrido(),
    h('section', { class: 'card key' },
      h('p', { class: 'nombre' }, B.pregunta),
      h('p', { class: 'pre' }, sp(B.ramas).replace(/\s*\|\s*/, '\n')),
      h('p', { class: 'nota' }, sp(B.apoyo))),
    nodos, CIERRE ? nota(CIERRE) : null, pie(DATA.TITULOS.pieA2)
  ] };
}

function pSindrome(clave) {
  const S = DATA.SINDROMES, P = DATA.PRONOSTICO;
  const f = sind(clave), pr = pron(clave), cfg = FICHAS[clave] || {};
  // la pista dice por qué se ha llegado aquí: la del propio síndrome o su condición del árbol
  const pista = cfg.pista || cap1(CLAVE_PATRON[clave] || '');
  return { titulo: f[0], nodes: [
    pista ? h('p', { class: 'sub' }, pista) : null,
    f.slice(1).map((c, i) => seccion(S.cabecera[i + 1], c)),
    pr ? plegable(bloque(6, 'horizonte y criterio'), columnas(pr, P.cabecera)) : null,
    plegable(TIT_AVISO, h('p', { class: 'pre' }, sp(S.aviso))),
    cfg.orientativa && DATA.ORIENTATIVA ? big('Diferencial: ' + min1(TIT_ORIENT), cap1(SUB_ORIENT), () => ir('orientativa')) : null,
    cfg.nota && S.nota ? nota(S.nota) : null,
    NOTAS_PRON.map(nota), pie(P.pie)
  ] };
}

// Tabla orientativa: cada fila con sus columnas etiquetadas. La agrupación,
// si la hay, es propia de la SPA y viene de ORIENTATIVA_GRUPOS.
function pOrientativa() {
  const O = DATA.ORIENTATIVA, P = DATA.PRONOSTICO;
  const dice = f => { const d = GRUPOS && GRUPOS.dice && GRUPOS.dice[f[0]]; return d && String(f[1]).includes(d) ? cap1(d) : null; };
  const plegables = [];   // solo uno abierto a la vez
  const fila = f => {
    const d = h('details', {},
      h('summary', {}, h('div', { class: 'st' }, h('b', {}, f[0]), dice(f) ? h('span', {}, dice(f)) : null)),
      h('div', { class: 'in' }, columnas(f, O.cabecera)));
    plegables.push(d);
    return d;
  };
  const grupos = GRUPOS ? GRUPOS.grupos : [{ resto: true }];
  const nombradas = grupos.reduce((a, g) => a.concat(g.filas || []), []);
  const filasDe = g => O.filas.filter(f => (g.filas || []).includes(f[0]) || (g.resto && !nombradas.includes(f[0])));
  const cuerpo = [];
  for (const g of grupos) {
    if (g.enlace) { const b = botonDestino(g.enlace); if (b) cuerpo.push(b); continue; }
    const fs = filasDe(g);
    if (!fs.length) continue;
    if (g.plegado) {
      const d = h('details', {},
        h('summary', {}, h('div', { class: 'st' }, h('b', {}, g.titulo), h('span', {}, fs.map(f => f[0]).join(' · ')))),
        h('div', { class: 'in' }, fs.map(f => h('div', { class: 'cond' },
          h('p', { class: 'nombre' }, f[0]),
          dice(f) ? h('p', { class: 'dice' }, dice(f)) : null,
          columnas(f, O.cabecera)))));
      plegables.push(d);
      cuerpo.push(d);
    } else {
      if (g.titulo) cuerpo.push(h('h3', { class: 'grupo' }, g.titulo));
      fs.forEach(f => cuerpo.push(fila(f)));
    }
  }
  plegables.forEach(d => d.addEventListener('toggle', () => { if (d.open) plegables.forEach(o => { if (o !== d) o.open = false; }); }));
  const sub = SUB_ORIENT ? SUB_ORIENT + '.' : '';
  return { titulo: TIT_ORIENT, nodes: [
    sub ? h('p', { class: 'sub' }, O.bloque ? bloque(O.bloque, sub) : sub) : null,
    cuerpo,
    nota(O.nota),
    GRUPOS && GRUPOS.aviso ? nota(GRUPOS.aviso) : null,
    pie(P.pie)
  ] };
}

// ════════════════════════════════════════════════════════════════
//  Render
// ════════════════════════════════════════════════════════════════
const PANTALLAS = { home: pHome, banderas: pBanderas, arbol: pArbol, sindrome: pSindrome, orientativa: pOrientativa };
const $ = s => document.querySelector(s);
$('#back').addEventListener('click', volver);

function render(arriba) {
  const y = window.scrollY, cur = pila[pila.length - 1];
  const s = PANTALLAS[cur.p](cur.arg);
  document.title = s.home ? 'Consulta ' + DATA.REGION : s.titulo + ' · ' + DATA.REGION;
  $('#titulo').textContent = s.titulo;
  $('#back').hidden = !!s.home;
  $('#cab').classList.toggle('home', !!s.home);
  $('#main').replaceChildren(...[s.nodes].flat(Infinity).filter(Boolean));
  if (cur.p === 'arbol') $('#cabRec').replaceChildren(...chipsRecorrido());
  window.scrollTo(0, arriba ? 0 : y);
  actualizarCab();
}
render(true);
</script>
