<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guía de consulta</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- theme-color: mismo acento que --accent en el CSS de abajo (decisión 8); si cambia, cambiar
     en los dos sitios. Un único meta (no dos con media): con el toggle claro/oscuro el
     color de la barra del navegador puede no coincidir con el del sistema, así que lo
     mantiene al día aplicarTema() en el JS de abajo -->
<meta name="theme-color" content="#1F5F4E" id="temaColor">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F8F9; --panel:#FFFFFF; --band:#EEF3F5; --ink:#16262B; --muted:#4A6572; --line:#C9D1D6;
  /* Una sola paleta para todas las regiones (la verde de hombro): no depende de CONFIG.DARK */
  --accent:#1F5F4E; --on-accent:#FFFFFF; --focus:#0B5CAD;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1517; --panel:#162124; --band:#1D2B2F; --ink:#E7EEF0; --muted:#9DB4BD; --line:#2F4147;
    --accent:#5CC0A3; --on-accent:#06231B; --focus:#7DB8F0;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1517; --panel:#162124; --band:#1D2B2F; --ink:#E7EEF0; --muted:#9DB4BD; --line:#2F4147;
  --accent:#5CC0A3; --on-accent:#06231B; --focus:#7DB8F0;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:17px/1.5 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:4px;min-height:56px;padding:4px 14px 4px 6px}
#back{appearance:none;flex:none;width:48px;height:48px;border:0;background:none;font-size:30px;line-height:1;cursor:pointer;color:var(--ink)}
#back[hidden]{display:none}
#titulo{font-weight:700;font-size:19px;line-height:1.2;min-width:0;overflow-wrap:anywhere}
/* Título de ficha con detalle final entre paréntesis (partirTitulo() en el JS): el paréntesis
   baja a una segunda línea más pequeña y atenuada, mismo lenguaje visual que el "span" de
   .nav/.big/.doc en el resto de la app. Sin el paréntesis, #titulo sigue siendo solo texto */
#titulo b{display:block;font-weight:700}
#titulo span{display:block;font-weight:400;font-size:14px;line-height:1.25;color:var(--muted);margin-top:1px}
header.home{padding-left:14px}
/* Con una sola paleta ya no hay color por región: el nombre se ve siempre en la cabecera
   (menos en el propio selector y en el inicio de la región, donde ya es el título) */
#regionCab{flex:none;font-size:12px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;
  color:var(--muted);padding-right:8px;margin-right:2px;border-right:1px solid var(--line)}
#regionCab[hidden]{display:none}
/* Documentos (acceso permanente a formularios/ficha/guía rápida, tarea 10), Tema claro/oscuro
   (toggle manual sobre el automático del sistema) y Wake Lock (tarea 6, oculto por defecto,
   visible solo si la API existe, ver JS): mismo botón redondo. El margin-left:auto que los
   alinea a la derecha vive en el contenedor .iconos, no en un botón: #documentos se oculta
   a sí mismo en su propia pantalla (como #pantalla sin Wake Lock), y si el margen viviera
   ahí, al ocultarse se perdía y el resto de iconos se quedaban pegados al título */
.iconos{margin-left:auto;flex:none;display:flex;gap:4px}
#documentos,#tema,#pantalla{appearance:none;flex:none;width:44px;height:44px;border:1px solid var(--line);
  border-radius:50%;background:var(--panel);color:var(--muted);cursor:pointer;
  display:grid;place-items:center}
#documentos[hidden],#pantalla[hidden]{display:none}
#tema[aria-pressed="true"],#pantalla[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
/* Hover solo con ratón de verdad (no en táctil, donde un tap dejaría el estado "pegado"):
   pista visual en desktop de que el icono es interactivo, más el title con lo que hace/representa */
@media (hover:hover) and (pointer:fine){
  #documentos:hover,#tema:hover,#pantalla:hover{border-color:var(--muted)}
  #tema[aria-pressed="true"]:hover,#pantalla[aria-pressed="true"]:hover{border-color:var(--on-accent)}
}
/* Cápsulas del recorrido en la cabecera (actualizarCab(), al hacer scroll): en móvil competían
   por sitio en la misma fila con el nombre de la región y los tres botones redondos y quedaban
   muy apretadas. La clase .modo-recorrido (la pone el JS a la vez que oculta #titulo) oculta el
   grupo de iconos mientras se ven las cápsulas -- vuelven en cuanto se sube el scroll y
   reaparece el título -- para darles todo ese ancho sin tocar la altura de la cabecera (un
   primer intento las bajaba a una segunda fila, pero el cambio de altura de la cabecera sticky
   desplazaba el contenido justo al cruzar el umbral, un salto visible que así se evita) */
@media (max-width:639px){
  header.modo-recorrido .iconos{display:none}
}

main{max-width:640px;margin:0 auto;padding:14px 14px 40px}
.sub{color:var(--muted);font-size:15px;margin:0 0 14px}
.nota{color:var(--muted);font-size:15px;font-style:italic;margin:12px 0}
.pre{white-space:pre-line}
.band{background:var(--band);border-radius:6px;padding:10px 12px;margin:0 0 12px;font-size:15px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;margin:0 0 10px}
.card h3{font-size:15px;font-weight:700;color:var(--accent);margin:0 0 4px}
.card p{margin:0}
.card p + p{margin-top:8px}
.card .lab{display:block;font-size:14px;color:var(--muted);margin-bottom:1px}
.card.key{border:2px solid var(--accent)}
.card .nombre{font-size:18px;font-weight:700;color:var(--ink);margin:0 0 6px}
/* URGENCIA: borde grueso negro, no rojo (decisión de la tarjeta en papel; ver CLAUDE.md) */
.card.urgencia{border:3px solid var(--ink)}
.card.urgencia .nombre{font-size:17px}

.nav,.big,.doc{appearance:none;display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:12px 14px;margin:0 0 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer;min-height:64px;box-sizing:border-box}
.nav .tx,.big .tx,.doc .tx{flex:1;min-width:0}
.nav b,.big b,.doc b{display:block;font-size:18px;line-height:1.25}
.nav span,.big span,.doc span{display:block;font-size:15px;color:var(--muted);margin-top:2px}
.nav i,.big i,.doc i{flex:none;font-style:normal;font-size:24px;color:var(--muted)}
.nav.pendiente{cursor:default;opacity:.55;border-style:dashed}
.nav.pendiente span{font-style:italic}
.doc{color:inherit;text-decoration:none}
/* Selector de región (tarea 10): en tablet/desktop (main ya alcanza su ancho máximo, 640px)
   dos columnas aprovechan mejor el espacio; en móvil sigue en una sola columna, sin cambios */
@media (min-width:640px){
  .grid-regiones{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
  .grid-regiones .nav{margin-bottom:0}
}
.nodo{display:flex;gap:10px}
.nodo .n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-weight:700;
  display:grid;place-items:center;font-size:15px}
.nodo p{flex:1;min-width:0}
.acciones{margin:10px 0 0;display:flex;flex-direction:column;gap:6px}
.acciones .big{margin:0;min-height:52px;padding:8px 12px}
.acciones .big b{font-size:16px}

details{background:var(--panel);border:1px solid var(--line);border-radius:6px;margin:0 0 8px;padding:0 12px}
summary{min-height:52px;display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;font-size:24px;font-weight:400;color:var(--muted)}
details[open] > summary::after{content:"–"}
details[open] > summary{border-bottom:1px solid var(--line);margin-bottom:10px}
details .in{padding-bottom:12px}
details .in p{margin:0 0 10px}
details .in p:last-child{margin-bottom:0}
details .in .lab{display:block;font-size:14px;color:var(--muted)}
summary .st{flex:1;min-width:0;padding:8px 0}
summary .st b{display:block;line-height:1.25}
summary .st span{display:block;font-size:15px;font-weight:400;color:var(--muted)}
.grupo{font-size:16px;color:var(--accent);margin:20px 0 8px}
.grupo-sub{color:var(--muted);font-size:15px;margin:-4px 0 10px}
.card[id^="nodo-"]{scroll-margin-top:68px}
.marca{display:flex;gap:6px;margin-top:12px}
.marca button{appearance:none;flex:1 1 0;min-height:48px;padding:6px 4px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;font-size:15px}
.marca button[aria-pressed="true"][data-v="hecho"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.marca button[aria-pressed="true"][data-v="dudoso"]{border:3px solid var(--ink);background:var(--band);font-weight:700}
.marca button[aria-pressed="true"][data-v="na"]{border-style:dashed;background:var(--band);color:var(--muted);font-weight:700}
.pasos{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.paso{appearance:none;min-width:56px;min-height:44px;padding:4px 10px;border:1px solid var(--line);border-radius:22px;background:var(--panel);cursor:pointer;font-weight:700}
.paso[data-e="hecho"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.paso[data-e="dudoso"]{border:3px solid var(--ink);background:var(--band)}
.paso[data-e="na"]{border-style:dashed;background:var(--band);color:var(--muted)}
.cabrec{display:flex;flex:1;min-width:0;gap:6px;overflow-x:auto;padding:4px 0}
.cabrec[hidden]{display:none}
.cabrec .paso{flex:none;min-width:48px;min-height:40px;padding:2px 10px}
.rec .lin{font-size:15px;margin:0 0 4px}
.rec .ghost{appearance:none;margin-top:8px;min-height:44px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer}
.cond + .cond{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.cond .nombre{font-weight:700;font-size:17px;margin:0 0 2px}
.cond .dice{color:var(--muted);font-size:15px;margin:0 0 6px}

</style>
</head>
<body>
<header id="cab"><button id="back" type="button" aria-label="Volver" hidden>‹</button><div id="regionCab" hidden></div><div id="titulo"></div><div class="cabrec" id="cabRec" hidden aria-label="Recorrido del árbol"></div><div class="iconos"><button id="documentos" type="button" aria-label="Documentos: formularios, ficha y guía rápida" title="Documentos: formularios, ficha y guía rápida"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" d="M6,3 H14 L18,7 V21 H6 Z"/><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" d="M14,3 V7 H18"/></svg></button><button id="tema" type="button" aria-pressed="false"></button><button id="pantalla" type="button" aria-label="Mantener la pantalla encendida" aria-pressed="false" hidden></button></div></header>
<main id="main"></main>

<script>
const DATA = {"APP": "Guía de consulta", "REGIONES": [{"region": "cervical", "nombre": "Cervical", "disponible": true, "caras": ["A", "B"]}, {"region": "lumbar", "nombre": "Lumbar", "disponible": true, "caras": ["A", "B"]}, {"region": "hombro", "nombre": "Hombro", "disponible": true, "caras": ["A", "B"]}, {"region": "cadera", "nombre": "Cadera", "disponible": true, "caras": ["A", "B", "C"]}, {"region": "rodilla", "nombre": "Rodilla", "disponible": true, "caras": ["A", "A2", "B", "C"]}, {"region": "tobillo_pie", "nombre": "Tobillo y pie", "disponible": true, "caras": ["A", "A2", "B", "C"]}], "DATOS": {"cervical": {"REGION": "cervical", "NOMBRE": "Cervical", "CARAS": ["A", "B"], "TITULOS": {"caraA": "CERVICAL · cara A   bloque 0 (con el paciente fuera) y bloques 3–4", "caraB": "CERVICAL · cara B   bloques 4, 5 y 6, ya dentro de una rama del árbol", "pieA2": "Guía clínica cervical, ap. 1 y 4 — Ficha de primera visita, bloques 0, 3 y 4"}, "BANDERAS": {"titulo": "Banderas rojas de la región — sobre el cribado general de la ficha", "cabecera": ["Sospecha → derivación médica", "Pistas en entrevista y exploración", "Ayuda en consulta"], "filas": [["Mielopatía cervical", "Espondilosis avanzada que estrecha el canal y comprime la médula; más probable de mediana edad en adelante. También con tumores avanzados o malformación congénita (Klippel-Feil).", "Falla la conducción de la médula, no la de la raíz: exploración neurológica que incluya pruebas centrales (Babinski, dedo-nariz). La RM muestra la compresión. El capítulo no detalla signos específicos."], ["Inestabilidad cervical alta no traumática", "Erosión del ligamento transverso en AR; ausencia congénita de ligamentos; síndrome de Down; Klippel-Feil (cuello corto, asimetría facial, cefalea crónica).", "La queja principal puede ser una cefalea con rasgos de cervicogénica. El capítulo no describe los test de estabilidad."], ["Tumor vertebral (benigno, maligno o metástasis)", "Dolor cervical incesante que no cambia con postura, movimiento ni reposo; dolor nocturno frecuente; rigidez y pérdida de movilidad posibles; debilidad o entumecimiento si comprime médula o raíces.", "Malestar general: febrícula, sudor nocturno, cansancio, inapetencia."], ["Infección (discitis, osteomielitis, absceso epidural)", "Dolor incesante y nocturno que no alivia con reposo, postura ni movimiento; cuello rígido con pérdida de movilidad; signos neurológicos si está avanzada.", "Mismo malestar general. Analítica si se sospecha (decisión médica)."], ["Artritis inflamatoria (AR, EA)", "Dolor y rigidez prolongada, sobre todo por la mañana.", "AR: visible en articulaciones periféricas. EA: empieza en lo lumbopélvico."], ["Cardiaco", "Dolor cervical, habitualmente anterior.", "No se relaciona con movimientos ni posturas del cuello."], ["Distonía cervical", "Contracciones involuntarias con postura y movimientos anómalos de la cabeza; puede doler.", "Observación de la postura y del movimiento."], ["Fijación rotatoria atloaxoidea", "Más frecuente en niños. Tortícolis con rotación muy limitada. Puede aparecer tras amigdalitis o adenoamigdalectomía (síndrome de Grisel).", "Requiere derivación médica."], ["Otras cefaleas secundarias", "Pseudotumor cerebri; arteritis temporal; sospecha de tumor, aneurisma, hemorragia, ictus o meningitis.", "Pseudotumor: examen ocular, TC o RM, punción lumbar. Arteria temporal: palpación, analítica, biopsia. Resto: RM y analítica."]], "nota": "El patrón mecánico es el primer filtro: el dolor cambia con posturas, movimientos y cargas, alivia al cambiarlos y el paciente está bien en lo demás. Si no sigue ese patrón, sospecha y deriva. Se revisan en todas las visitas."}, "BISAGRA": {"pregunta": "¿Cómo empezó, y hay síntomas en el brazo, cefalea o mareo?", "ramas": "Traumático → LATIGAZO   ·   brazo con rasgos neuropáticos o déficit → RADICULAR o RADICULOPATÍA   ·   cefalea o mareo → su ficha   ·   nada de lo anterior → IDIOPÁTICO", "apoyo": "Los test valen en grupo, no solos: un hallazgo aislado engaña (FRT positivo en el 100 % de una muestra con migraña crónica; desviaciones posturales en asintomáticos). Cuenta si al cambiar postura o carga cambian los síntomas.", "nota": "La guía cervical no nombra una bisagra como la RE pasiva del hombro, y aquí el reparto no es binario: son las tres categorías del capítulo (idiopático, latigazo, radicular) más el eje cefalea-mareo. Pueden coexistir."}, "ARBOL": {"filas": [["1", "¿Signos de disfunción arterial, traumatismo con sospecha de fractura o inestabilidad, o cefalea con signos de alarma? → URGENCIAS HOY.   ·   No → 2"], ["2", "¿Otras banderas rojas, o un relato que no sigue el patrón mecánico (no cambia con postura, movimiento ni reposo; malestar general)? → derivación médica.   ·   No → 3"], ["3", "¿Síntomas en el brazo con rasgos neuropáticos, o pérdida de sensibilidad o fuerza?   Sí → 3b   ·   No → 4"], ["3b", "Quemazón o descargas + ULNT1 positivo con diferenciación estructural → DOLOR RADICULAR · déficit de sensibilidad, fuerza o reflejos → RADICULOPATÍA (pueden coexistir; si falla la médula → derivar).\nSíntomas que preceden a la cefalea y duran hasta 60 min → AURA MIGRAÑOSA, no radicular. Si el inicio fue traumático, añadir la ficha de latigazo."], ["4", "¿Inicio con traumatismo (tráfico, deporte, ocio)? → LATIGAZO CERVICAL, con la fractura ya descartada en el paso 1.   ·   No → 5"], ["5", "¿Cefalea o mareo como queja principal o acompañante?   Sí → 5b   ·   No → 6"], ["5b", "Cefalea unilateral sin cambio de lado que empieza en el cuello + FRT ≤30° + cluster cervical → CEFALEA CERVICOGÉNICA · criterios de migraña o tensional → CEFALEA PRIMARIA (el cuello puede contribuir).\nAturdimiento o inestabilidad ligados al cuello + error de reposición >4–5° → MAREO CERVICOGÉNICO · vértigo rotatorio → VESTIBULAR; tras golpe en cabeza o cuello, pensar también en conmoción."], ["6", "IDIOPÁTICO, ¿dónde está la disfunción? Dolor en los primeros grados de rotación, restricción precoz, FRT <30° o 10° de asimetría → CRANEOCERVICAL (C1–2) · extensión-rotación positiva + disfunción segmentaria palpable y dolorosa → FACETA CERVICAL · giro libre al inicio pero excursión final limitada → CERVICAL BAJA Y CERVICOTORÁCICA.\nEn todos: tarea provocadora, postura, control motor y región torácica."]]}, "SINDROMES": {"aviso": "Antes de explorar: severidad e irritabilidad. Alta → solo bisagra y 1–2 tests, sin final de rango ni repeticiones provocadoras; el resto, en la próxima visita. Máximo 2 tests; la palpación va la última.", "cabecera": ["Síndrome", "Explorar · 10′", "① Gesto testigo", "② Medida objetiva"], "filas": [["Idiopático", "Tarea provocadora: que muestre la actividad que le duele; modificar la postura y ver el efecto inmediato. Movilidad activa en los tres planos y las tres regiones. Extensión: la cabeza debe pasar por detrás del plano de los hombros. Rotación: giro libre en los primeros 30° = craneocervical sin gran alteración; restricción precoz → problema craneocervical. Examen manual segmentario.", "Tarea o postura provocadora que el paciente demuestra (rotación al lado del dolor, mirar al techo, postura de ordenador un tiempo fijo) → EVA", "Rotación cervical activa hacia el lado limitado, sentado con la espalda apoyada (inclinómetro). Si es craneocervical: grados del FRT en supino"], ["Latigazo (WAD)", "Fractura e inestabilidad ya descartadas. Son frecuentes el dolor intenso y la poca tolerancia al movimiento: dosificar. Movilidad activa en los tres planos respetando la irritabilidad. Hielo sobre la nuca: dolor >5/10 → hiperalgesia al frío (LR+ 8,44). Mareo o inestabilidad → reposición articular. Síntomas en brazo → ULNT1 y neurológico.", "Movimiento activo más doloroso o limitado (p. ej. rotación hacia el peor lado) → EVA", "Rotación cervical activa sentado, misma silla y apoyo (grados). Si hay mareo: error medio de reposición con láser"], ["Dolor radicular", "ULNT1 (sesgo mediano): positivo si reproduce los síntomas y estos cambian con la diferenciación estructural. Es el más estudiado (el capítulo no da cifras). Movilidad cervical: qué movimiento dispara el dolor de brazo y cuánto se tolera. Si hay adormecimiento o debilidad, pasar a la ficha de radiculopatía.", "Movimiento cervical que dispara el dolor de brazo (p. ej. extensión), o ULNT1 hasta una posición fija → EVA del brazo", "Grados de extensión de codo en el ULNT1 en que aparecen los síntomas, con hombro, muñeca y cuello en posición fija"], ["Radiculopatía", "Exploración neurológica: sensibilidad, fuerza y reflejos del miembro superior, siempre que se sospeche conducción comprometida. Sensibilidad a vibración y temperatura: buscar hipoestesia. Comparar con el lado sano.", "Si hay dolor, el gesto testigo del cuadro que lo acompaña (radicular o referido)", "Fuerza del grupo muscular débil con dinamómetro de mano, en la misma posición y frente al lado sano"], ["Cefalea cervicogénica", "FRT: positivo ≤30°; el test con mayor fiabilidad y precisión diagnóstica según revisión sistemática, y su limitación se correlaciona con el índice de cefalea. Examen manual cervical alto: buscar reproducción y resolución de la cefalea.", "Postura o movimiento cervical que desencadena la cefalea, o presión manual mantenida en el segmento alto que la reproduce → EVA de la cefalea", "Grados del FRT hacia el lado limitado, en supino con flexión cervical completa"], ["Mareo cervicogénico", "Primero descartar lo vascular (5 D y 3 N, disección). Sentido de posición articular: ojos cerrados, rotación a cada lado y extensión, y volver a la posición natural. Error >4–5° = déficit. Con láser en cinta de cabeza y diana, al menos 3 intentos por movimiento y hacer la media.", "Movimiento o postura cervical que desencadena el mareo → EVA del mareo", "Error medio de reposición en grados por movimiento (rotación derecha, izquierda, extensión), sentado a la misma distancia de la diana"]], "nota": "Que el dolor llegue al hombro o al brazo no lo convierte en radicular: C4–5 se refiere a cuello y hombro, y C5–6 a C7–T1 a cuello, hombro y brazo. Separan los rasgos neuropáticos y la diferenciación estructural del ULNT1."}, "PRONOSTICO": {"titulo": "para «a las X sesiones espero Y; si no lo veo → Z»", "cabecera": ["Síndrome", "Horizonte e imagen", "Criterio de derivación o cuidado"], "filas": [["Idiopático", "Recurrente: tras un episodio, el 50–85 % vuelve a tener dolor en meses o pocos años. Radiografía solo con indicación concreta de la exploración: hay dolor sin cambios y cambios sin dolor.", "Dolor constante y sordo → componente inflamatorio. Dolor que no cambia con postura, movimiento ni reposo → banderas rojas. Espondilosis avanzada: posible radiculopatía o mielopatía."], ["Latigazo", "Peor recuperación con síntomas de estrés postraumático, sobre todo de hiperactivación. Baja expectativa de recuperación: factor pronóstico independiente de más discapacidad (OR 4,2). El mecanismo del accidente no predice el daño estructural.", "No prejuzgar: un factor de riesgo no condena a un paciente concreto; el miedo suele ceder al bajar el dolor. Mareo tras golpe en cabeza o cuello: pensar también en vestibular, conmoción y disección."], ["Dolor radicular", "RM para compromiso de raíz, solo si la exploración lo indica: los cambios son frecuentes en asintomáticos.", "Con más dolor y discapacidad aparece sensibilización central: exploración mínima. La espondilosis que avanza puede comprimir la médula."], ["Radiculopatía", "RM: compresión de raíz o médula. EMG y conducción nerviosa localizan el daño y apoyan el diagnóstico clínico.", "Ante cualquier duda de afectación medular → derivar. El aura migrañosa puede presentarse como pérdida de fuerza en el brazo antes de la cefalea, hasta 60 min."], ["Cefalea cervicogénica", "La remisión de la cefalea tras tratar el cuello es un buen apoyo diagnóstico. La imagen no confirma ni descarta: solo sirve para descartar patología grave.", "Si no cambia al tratar el cuello → revisar ATM y otras formas de cefalea. El 30 % con cervicogénica cumple también criterios de migraña."], ["Mareo cervicogénico", "Identificar la fuente del mareo es clave para que el manejo funcione.", "Vértigo rotatorio → vestibular. Golpe en cabeza o cuello → conmoción. Visión doble verdadera en mayores → IVB; súbito en jóvenes → disección. Los dos últimos, urgencias."]], "nota": "③ en formato PSFS; si no sabe: cuidado personal, levantar peso, leer, conducir, dormir, ordenador o móvil, mirar arriba, llevar el brazo atrás. Dosis y progresión no están en la guía: son tuyas.", "pie": "Guía clínica cervical, ap. 5 y 6 · las filas ① y ② son propuestas de la guía, no proceden del capítulo"}, "URGENCIA": {"titulo": "URGENCIAS HOY · disfunción arterial · lesión tras traumatismo · cefalea con signos de alarma", "lineas": ["Disección arterial (<55 a): cefalea o dolor cervical súbito, DESCONOCIDO PARA EL PACIENTE, moderado o grave y a menudo progresivo. Alteración del equilibrio o la marcha, Horner, déficit de pares craneales. Puede imitar una cefalea cervicogénica.", "Insuficiencia vertebrobasilar (suele ser >65 a, posible en jóvenes) · 5 D y 3 N: mareo o inestabilidad, diplopía o pérdida de campo visual, disartria o disfasia, disfagia o ronquera, caídas súbitas sin pérdida de conciencia; nistagmo espontáneo, náuseas o vómitos, entumecimiento peribucal.", "Fractura, subluxación o luxación: traumatismo importante en persona mayor o mecanismo peligroso (flexión con compresión en deporte de colisión). Se sujeta la cabeza, espasmo defensivo, movilidad muy limitada, posibles signos neurológicos. Incluye la inestabilidad cervical alta traumática.", "Cefalea con signos de alarma: cambio súbito de calidad, intensidad o frecuencia; síntomas neurológicos nuevos; inicio súbito y grave; fiebre u otros síntomas sistémicos."]}, "ORIENTATIVA": {"titulo": "Cefalea · ¿viene del cuello? — tabla orientativa", "bloque": "4", "cabecera": ["Rasgo", "Migraña", "Tensional", "Cervicogénica"], "filas": [["Duración y frecuencia", "Al menos 5 crisis de 4 a 72 h", "30 min a 7 días", "Al menos 1 por semana de media; duración variable"], ["Rasgos del dolor", "2 de 4: moderada o grave, unilateral, pulsátil, empeora con la actividad habitual", "2 de 4: bilateral, opresiva no pulsátil, leve o moderada, no empeora con la actividad", "Unilateral sin cambio de lado, no pulsátil, empieza en el cuello, la desencadenan movimientos o posturas cervicales"], ["Síntomas asociados", "Foto y fonofobia, o náuseas o vómitos", "Como mucho uno entre fotofobia, fonofobia o náusea leve", "Dolor o rigidez cervical"], ["Antes de la cefalea", "Pródromos: humor, antojos, cansancio, bostezos, dolor de cuello. Aura (subgrupo): 5–60 min, visual en >90 %", "—", "—"], ["Cuello en la exploración", "70 % con dolor cervical antes, durante o tras la cefalea; 93 % con ≥3 disfunciones; examen cervical alto positivo en ~2/3 y reproduce la cefalea en ~1/3", "Cabeza adelantada y menos movilidad (sobre todo crónica) y PGM, de relevancia discutida", "Cluster con S 100 % y E 94 %; FRT ≤30°"], ["A tener en cuenta", "Descartar abuso de medicación: analgésicos no más de 10–15 días al mes", "Estrés, ánimo y sueño como factores", "Si no cambia al tratar el cuello, revisar ATM y otras formas"]], "nota": "No sobreestimes el cuello: en cefalea cervicogénica persistente, el 44,1 % tenía signos claros de ATM y tras tratamiento manual de la ATM el 85 % redujo signos craneocervicales y cefalea. El dolor de cuello acompañante no confirma nada: lo refiere hasta el 70 % de quienes tienen cefalea frecuente."}, "ENLACES": {"2": {"botones": [{"pantalla": "banderas", "sub": "Otras banderas rojas, o un relato que no sigue el patrón mecánico"}]}, "4": {"botones": [{"pantalla": "sindrome", "fila": "Latigazo (WAD)", "sub": "Inicio con traumatismo (tráfico, deporte, ocio)"}]}, "6": {"botones": [{"pantalla": "sindrome", "fila": "Idiopático", "sub": "Craneocervical, faceta cervical o cervical baja y cervicotorácica"}]}, "3b": {"botones": [{"pantalla": "sindrome", "fila": "Dolor radicular", "sub": "Quemazón o descargas + ULNT1 positivo con diferenciación estructural"}, {"pantalla": "sindrome", "fila": "Radiculopatía", "sub": "Déficit de sensibilidad, fuerza o reflejos"}]}, "5b": {"botones": [{"pantalla": "sindrome", "fila": "Cefalea cervicogénica", "sub": "Cefalea unilateral sin cambio de lado que empieza en el cuello"}, {"pantalla": "orientativa", "sub": "Criterios de migraña o tensional → cefalea primaria"}, {"pantalla": "sindrome", "fila": "Mareo cervicogénico", "sub": "Aturdimiento o inestabilidad ligados al cuello"}]}}, "PRONOSTICO_DE": {"Latigazo (WAD)": "Latigazo"}, "FICHAS": {"Idiopático": {"pista": "Craneocervical, faceta cervical o cervical baja y cervicotorácica (nodo 6)"}, "Latigazo (WAD)": {"pista": "Inicio con traumatismo: tráfico, deporte u ocio (nodo 4)"}, "Dolor radicular": {"pista": "Quemazón o descargas + ULNT1 positivo (nodo 3b)", "nota": true}, "Radiculopatía": {"pista": "Déficit de sensibilidad, fuerza o reflejos (nodo 3b)", "nota": true}, "Cefalea cervicogénica": {"pista": "Cefalea unilateral sin cambio de lado que empieza en el cuello (nodo 5b)", "orientativa": true}, "Mareo cervicogénico": {"pista": "Aturdimiento o inestabilidad ligados al cuello (nodo 5b)"}}, "CORTE_NOTA": "Dosis y progresión"}, "lumbar": {"REGION": "lumbar", "NOMBRE": "Lumbar", "CARAS": ["A", "B"], "TITULOS": {"caraA": "LUMBAR · cara A   bloque 0 (con el paciente fuera) y bloques 3–4", "caraB": "LUMBAR · cara B   bloques 4, 5 y 6, ya dentro de una rama del árbol", "pieA2": "Guía clínica lumbar, ap. 1 y 4 · Fondevila Suárez, cap. 5 — Ficha de primera visita, bloques 0, 3 y 4"}, "BANDERAS": {"titulo": "Banderas rojas de la región — sobre el cribado general de la ficha", "cabecera": ["Sospecha", "Pistas en entrevista y exploración"], "filas": [["Cáncer vertebral", "Antecedente de cáncer (mama, próstata, pulmón) + fuerte sospecha clínica: lo más preciso. <22 o >55 a; primer episodio >50; pérdida de peso inexplicada (pregunta obligada); dolor nocturno; empeora con el tiempo; malestar general; no cambia con tratamientos previos. >50 + antecedente + pérdida de peso + >1 mes → probabilidad alta. Movimiento lumbar indoloro en todas direcciones: LR− 0,0. Signo de la nalga si hay cáncer pélvico."], ["Infección", "Fiebre, infección bacteriana o cirugía lumbar recientes, inmunodepresión o VIH, dolor nocturno, empeora con el tiempo, sin respuesta al conservador."], ["Fractura osteoporótica o patológica", "Mayor de 70, corticoides prolongados, traumatismo grave, contusión o abrasión; mujer mayor con osteoporosis; microtraumatismo súbito o dolor sin causa aparente. Edad + corticoides + traumatismo grave + contusión juntos → fractura por compresión probable en el 90,2 %."], ["Fractura sacra por estrés", "Mujer deportista con actividad vigorosa y repetitiva, dolor en nalga que reproduce la carrera, dieta pobre, alteraciones menstruales, fracturas de estrés previas, sin respuesta a tratamientos. Signo de la nalga. Puede no verse en RM porque no suele formar callo."], ["Espondilolistesis aguda", "Joven con lesiones repetidas en hiperextensión, ciática bilateral súbita durante el deporte, dolor en extensión (prono con extensión pasiva bilateral de caderas), sin incontinencia. Palpación de apófisis espinosas: E 87–100 %, S 60–88 %. Para espondilólisis ningún test sirve."], ["Espondiloartropatía", "Menor de 40, rigidez matutina de más de 1 h que cede con el movimiento, dolor que va y viene sin relación con el esfuerzo, no alivia en supino, dolor alterno en SI, pérdida progresiva de movilidad, sin parestesias. Dactilitis, uveítis, entesitis, psoriasis. Tardío: inclinación lateral limitada a ambos lados."], ["Vascular", "Aneurisma: dolor en reposo o nocturno, masa abdominal pulsátil, antecedentes familiares cardiovasculares. Claudicación vascular: mayor con factores de riesgo (HTA, diabetes, colesterol, tabaco), dolor al caminar que CEDE AL PARARSE, pie más frío, pulsos distales disminuidos, disfunción eréctil. Leriche (aortoilíaca) imita lumbalgia: nalgas, caderas y muslos."], ["Visceral", "Litiasis renal: dolor agudo intermitente hacia testículos o labios; con fiebre, infección renal. Digestivo: tras comer, en L1–L2. Genital: lumbosacro y nocturno. También úlcera duodenal, pancreatitis, endometriosis, riñón poliquístico. Denominador común: la exploración mecánica no reproduce los síntomas."]], "nota": "No se descartan por ausencia: el 64 % de los pacientes con cáncer vertebral no tenía ninguna asociada. Se revisan en todas las visitas, no solo en la primera."}, "BISAGRA": {"pregunta": "¿Hay dolor en la pierna con rasgos neuropáticos, claudicación o déficit neurológico?", "ramas": "SÍ → familia radicular · radiculopatía · estenosis      |      NO → inespecífico: disco · faceta · SI · miofascial", "apoyo": "Rasgos neuropáticos: quemazón o descargas, «distinto a todo», por debajo de la rodilla, empeora con tos o Valsalva, no encuentra postura, dolor nocturno.", "nota": "La guía lumbar no nombra una «bisagra» como la RE pasiva del hombro. Ésta es el paso 3 de su árbol, usado como tal."}, "ARBOL": {"filas": [["1", "¿Signos de cauda equina? → URGENCIAS HOY.   ·   No → 2"], ["2", "¿Otras banderas rojas, o síntomas que la exploración mecánica no reproduce? → derivación médica.   ·   No → 3"], ["3", "¿Dolor en pierna con rasgos neuropáticos, claudicación o déficit neurológico?   Sí → 3b   ·   No → 4"], ["3b", "¿Síntomas al caminar o de pie que mejoran al sentarse o con flexión?   Sí → ESTENOSIS DE CANAL (si mejora solo con pararse → vascular → derivar).\nNo: rasgos neuropáticos → DOLOR RADICULAR · déficit de fuerza, sensibilidad o reflejos → RADICULOPATÍA. Pueden coexistir."], ["4", "Inespecífico, ¿qué patrón encaja mejor? Línea media + preferencia direccional o centralización → DISCOGÉNICO · paramedial unilateral + dolor en extensión sin pasar la rodilla → FACETARIO · Fortin sin Tuber + no centraliza + Laslett positivo → SACROILÍACA · banda tensa + punto hipersensible + dolor reconocido → MIOFASCIAL.\nRevisar siempre cadera y factores contribuyentes."]]}, "SINDROMES": {"aviso": "Antes de explorar: severidad e irritabilidad. Alta → solo bisagra y 1–2 tests, sin final de rango ni repeticiones provocadoras; el resto, en la próxima visita. Máximo 2 tests; la palpación va la última.", "cabecera": ["Síndrome", "Explorar · 10′", "① Gesto testigo", "② Medida objetiva"], "filas": [["Dolor radicular", "SLR supino (más sensible que sentado): un negativo ayuda a descartar afectación radicular; un positivo por dolor no aporta precisión por sí solo. SLR cruzado (LR aceptables en la mayoría de estudios). Slump: más sensible que el SLR si se sospecha hernia discal.", "Dolor de pierna en slump o SLR en una posición fija → EVA", "Ángulo de SLR en supino en que aparece el dolor de pierna (goniómetro o inclinómetro)"], ["Radiculopatía", "Fuerza por miotomas L1–S2: la debilidad es el signo más importante. Reflejos rotuliano (L3–L4) y aquíleo (L5–S1). Sensibilidad: algodón, diapasón sobre prominencia ósea, pinchazo. Comparar siempre con el lado sano.", "Si hay dolor, el gesto testigo del cuadro que lo acompañe", "Repeticiones hasta el fallo (máx. 10) con tempo fijo del miotoma afectado, frente al lado sano, siempre con la misma prueba (p. ej. elevaciones de talón a una pierna para S1, u otra equivalente)"], ["Estenosis de canal", "Criterios clínicos: >60 a · test de extensión 30 s positivo · dolor en ambas piernas · alivio al sentarse · alivio al inclinarse o flexionar · SLR negativo. Flexión conservada, extensión limitada. Neurológico habitualmente normal. SLR y slump suelen ser negativos.", "Test de extensión de 30 s → EVA del dolor de piernas", "Tiempo o distancia de marcha hasta los síntomas, con el mismo recorrido y ritmo"], ["Discogénico", "Preferencia direccional: movimientos repetidos al final del rango o posturas mantenidas que alivian de forma duradera o aumentan la movilidad. Centralización: desaparecen los síntomas distales. Observación: espalda plana, shift lateral.", "Movimiento o postura provocadora → EVA y localización más distal del dolor, antes y después de los repetidos", "Tiempo sentado tolerado hasta la aparición de síntomas, en la misma silla"], ["Facetario", "Dolor en extensión, inclinación lateral o rotación hacia el lado del dolor. PA sobre la faceta o la transversa; PA unilateral con menos movilidad o más rigidez; espasmo ipsilateral. Ausencia de signos radiculares. Espalda en flexión, sin shift. Los repetidos no suelen aliviar.", "Extensión + rotación hacia el lado del dolor → EVA", "Tiempo de bipedestación o marcha tolerado hasta el dolor, en la misma superficie y al mismo ritmo"], ["Sacroilíaca", "Descartar antes origen lumbar buscando preferencia direccional. Cluster de Laslett (buena S y E): no centralización + dolor dominante en SI sin dolor en Tuber + 3 de 5 positivos (distracción, compresión, thrust sacro, thrust de muslo, Gaenslen).", "El test del cluster más provocador (p. ej. thrust de muslo) → EVA", "Sit-to-stand 30 s, con silla, brazos y apoyo fijos. En PRPPP: dificultad autoinformada en el ASLR, 0–10 (como la EVA)"], ["Miofascial", "Criterios mínimos (la guía no tiene fila «Explorar · 10′» para este síndrome): banda tensa palpable + punto hipersensible dentro de la banda + el paciente reconoce el dolor provocado. Con o sin dolor referido.", {"span": "La guía no propone ① ni ②. Hallazgo acompañante hasta descartar lo anterior."}]], "nota": "No usar: tests de disfunción de movimiento SI — baja fiabilidad y validez. La SI se mueve ~0,2° en carga."}, "PRONOSTICO": {"titulo": "para «a las X sesiones espero Y; si no lo veo → Z»", "cabecera": ["Síndrome", "Horizonte e imagen", "Criterio de derivación"], "filas": [["Radicular", "Agudo hasta 3 semanas, subagudo hasta 3 meses. Mejora a los 6 meses en el 88 %, recuperación completa en el 65 %. Hernia reabsorbida en al menos dos tercios. Recurrencia 20 %.", "RM si sospecha de patología grave, dolor radicular persistente, déficit grave o progresivo, o más de 1 mes sin remisión con conservador."], ["Radiculopatía", "RM de elección. EMG muy específica, poco sensible; útil si clínica e imagen no casan.", "Cirugía: déficit significativo en abductores de cadera, flexores plantares o dorsales del pie, o déficit que progresa pese al conservador."], ["Estenosis", "Historia natural poco conocida. 15 % mejora solo; hasta 20 % controla los síntomas evitando la extensión. Conservador antes que cirugía.", "Progresión neurológica rápida o deterioro de la calidad de vida. La cirugía no garantiza recuperar los déficits."], ["Discogénico", "A 4 años: 13 % mejoró, 7,6 % alivio leve, 12,2 % empeoró, 67,2 % sin cambios. La preferencia direccional predice buen pronóstico.", "Componente neuropático o disfuncional → más cronicidad. Con dolor en pierna, diferenciar de dolor radicular."], ["Facetario", "No se puede establecer pronóstico: la degeneración aumenta con la edad sin relación causal demostrada con el dolor. La radiología no es criterio diagnóstico; un bloqueo simple alivia definitivamente a menos del 10 %.", "—"], ["Sacroilíaca · PRPPP", "PRPPP: >54 % en el último trimestre, 25 % posparto; la mayoría se recupera, 7–20 % persiste. Recaída del 85 % en el siguiente embarazo.", "Predicen persistencia: edad, carga de trabajo alta, lumbalgia previa, mala función muscular. Cribar depresión posparto (×3)."], ["Curso general", "Mejora sustancial a las 6 semanas, pero el 65–67 % sigue con dolor a los 3 y 12 meses. Mejor predictor: un episodio previo.", "Sin banderas rojas, no hay imagen."]], "nota": "③ lo elige el paciente; si no sabe: sentarse, levantarse, caminar, estar de pie, dormir. Dosis y progresión no están en la guía: son tuyas.", "pie": "Guía clínica lumbar, ap. 5 y 6 · las filas ① y ② son propuestas de la guía, no proceden del capítulo"}, "URGENCIA": {"titulo": "URGENCIAS HOY · CAUDA EQUINA", "lineas": ["Urgencia quirúrgica: el tiempo hasta la cirugia pesa mas que la duración de los sintomas.", "Dolor o debilidad bilateral grave en MMII · parestesia en silla de montar · retención o incontinencia urinaria · incontinencia fecal · menor tono anal.", "PREGUNTAR SIEMPRE. Signos más específicos que sensibles; RM de elección. En mayores con estenosis el inicio lento se solapa y pasa desapercibido."]}, "ORIENTATIVA": {"titulo": "Inespecífico · disco / faceta / SI — tabla orientativa", "bloque": "4", "cabecera": ["", "Discogénico 39–43 %", "Facetario 15–30 %", "Sacroilíaco 15 %"], "filas": [["Localización", "Medial (origen discal 73 %; sin dolor medial, 96 % de que no lo sea)", "Paramedial, unilateral", "Fortin, uni o bilateral; sin dolor en Tuber"], ["Dolor distal", "Puede llegar al pie", "Normalmente hasta la rodilla", "Puede llegar al pie"], ["Cambia de lado", "Sí", "No", "No"], ["Alivio con repetidos", "Sí (ayuda al diagnóstico)", "Preliminar: no", "No"], ["Agravantes", "Flexión, levantarse de la silla", "Extensión, extensión + rotación", "Levantarse de la silla, cluster de Laslett"], ["Observación", "Espalda plana; shift sí", "Espalda en flexión, unilateral; shift no", "Shift no"], ["Perfil", "Varón, 44 ± 10 a; sin relación con IMC", "Mujer, ~60 a; IMC alto", "Mujer, ~61 a; IMC bajo"]], "nota": "El autor insiste en que esta tabla solo tiene valor indicativo. Valsalva es inespecífico en los tres."}, "ENLACES": {"2": {"botones": [{"pantalla": "banderas", "sub": "Otras banderas rojas, o síntomas que la exploración mecánica no reproduce"}]}, "4": {"botones": [{"pantalla": "orientativa", "sub": "Comparativa disco / faceta / SI"}], "patrones": {"DISCOGÉNICO": "Discogénico", "FACETARIO": "Facetario", "SACROILÍACA": "Sacroilíaca", "MIOFASCIAL": "Miofascial"}}, "3b": {"botones": [{"pantalla": "sindrome", "fila": "Estenosis de canal", "sub": "Síntomas al caminar o de pie que mejoran al sentarse o con flexión"}, {"pantalla": "sindrome", "fila": "Dolor radicular", "sub": "Rasgos neuropáticos"}, {"pantalla": "sindrome", "fila": "Radiculopatía", "sub": "Déficit de fuerza, sensibilidad o reflejos"}]}}, "PRONOSTICO_DE": {"Dolor radicular": "Radicular", "Estenosis de canal": "Estenosis", "Sacroilíaca": "Sacroilíaca · PRPPP", "Miofascial": null}, "FICHAS": {"Estenosis de canal": {"pista": "Síntomas al caminar o de pie que mejoran al sentarse o con flexión (nodo 3b)"}, "Dolor radicular": {"pista": "Rasgos neuropáticos (nodo 3b)"}, "Radiculopatía": {"pista": "Déficit de fuerza, sensibilidad o reflejos (nodo 3b)"}, "Sacroilíaca": {"nota": true}}, "CORTE_NOTA": "Dosis y progresión"}, "hombro": {"REGION": "hombro", "NOMBRE": "Hombro", "CARAS": ["A", "B"], "TITULOS": {"caraA": "HOMBRO · cara A   bloque 0 (con el paciente fuera) y bloques 3–4", "caraB": "HOMBRO · cara B   bloques 4, 5 y 6, ya dentro de una rama del árbol", "pieA2": "Guía clínica de hombro, ap. 1 y 4 · Struyf · Powell y Lewis, cap. 3 — Ficha de primera visita, bloques 0, 3 y 4"}, "BANDERAS": {"titulo": "Banderas rojas — derivación médica inmediata, sobre el cribado general de la ficha", "cabecera": ["Sospecha", "Pistas en entrevista y exploración", "Ayuda en consulta"], "filas": [["Tumor", "Antecedente de cáncer, pérdida de peso inexplicada, dolor sin relación con el movimiento o implacable, dolor nocturno o en reposo con síntomas sistémicos, masa o deformidad inexplicada.", "Raros en clavícula distal y acromion; pensar en ellos si hay dolor nocturno + síntomas sistémicos."], ["Infección o sistémico", "Fiebre, sensación de estar enfermo, cambios en la piel (aspecto, erupciones, sudoración), hematomas inexplicados, dolor en otras partes del cuerpo.", "Preguntar siempre por el estado general reciente."], ["Fractura o luxación no reducida", "Traumatismo previo (caída sobre el hombro o el codo), pérdida aguda de movilidad, deformidad, osteoporosis.", "Test de aprensión ósea; signo de percusión olécranon-manubrio (buen valor para luxación anterior y fracturas de clavícula y húmero)."], ["Lesión neurológica", "Déficit motor o sensitivo significativo, atrofia.", "Exploración neurológica breve: sensibilidad, fuerza y reflejos."], ["Origen visceral", "Dolor con esfuerzo cardiorrespiratorio o con síntomas digestivos; referido cardiaco, pulmonar o gastrointestinal a la zona AC.", "Preguntar si el dolor aparece al caminar rápido, al subir escaleras o tras comer."]], "nota": "Descartar antes de clasificar (no son banderas rojas, pero cambian la hipótesis): capsulitis, dolor de origen cervical y dolor secundario a traumatismo. Las banderas rojas se revisan en todas las visitas, no solo en la primera."}, "BISAGRA": {"pregunta": "¿La movilidad pasiva GH, sobre todo la RE, está limitada igual que la activa?", "ramas": "SÍ → capsulitis · artrosis GH · luxación bloqueada      |      NO → el resto de síndromes", "apoyo": "Clasifica síndromes, no estructuras: los test de hombro tienen poca precisión, combinarlos apenas la mejora y un hombro irritable da test positivos por casi cualquier causa."}, "ARBOL": {"filas": [["1", "¿Hay banderas rojas? → derivación médica.   ·   No → 2"], ["2", "¿La movilidad pasiva GH (sobre todo la RE) está limitada igual que la activa?   Sí → 2b   ·   No → 3"], ["2b", "¿Traumatismo previo?   Sí → LUXACIÓN BLOQUEADA o FRACTURA → Rx.\nNo: mayor edad + crepitación → ARTROSIS GH (Rx) · resto → HOMBRO CONGELADO."], ["3", "¿Los test cervicales reproducen el dolor de hombro?   Sí → CERVICOGÉNICO → explorar columna (pueden coexistir)   ·   No → 4"], ["4", "Movilidad pasiva conservada, ¿qué patrón encaja mejor? Dolor focal AC + palpación + aducción horizontal → ACROMIOCLAVICULAR · episodio concreto o aprensión → INESTABILIDAD · debilidad en RE + cluster positivo → ROTURA DEL MANGUITO · síntomas mecánicos (enganche, bloqueo, chasquido) → SLAP · dolor o debilidad al elevar, reproducido de forma consistente con resistidos → SAPS.\nLos cuadros se solapan: busca la hipótesis que explica los síntomas, no un hallazgo."]]}, "SINDROMES": {"aviso": "Antes de explorar: severidad e irritabilidad. Alta → solo bisagra y 1–2 tests, sin final de rango ni repeticiones provocadoras; el resto, en la próxima visita. Máximo 2–3 tests; la palpación va la última.", "cabecera": ["Síndrome", "Explorar · 10′", "① Gesto testigo", "② Medida objetiva"], "filas": [["Dolor subacromial (SAPS)", "Descartar primero capsulitis (RE pasiva), origen cervical y dolor postraumático. Dolor o debilidad al elevar el brazo; el dolor debe reproducirse de forma consistente con los test resistidos. Regla clínica: SAPS probable si no hay pérdida de RE pasiva y hay dolor anterior, lesión por sobreesfuerzo y ausencia de síntomas en RE final en abducción.", "Elevación en el plano de la escápula o RE resistida que reproduce el dolor → EVA", "Fuerza isométrica en RE con dinamómetro si se dispone (brazo junto al cuerpo, codo a 90°) o grados de elevación activa hasta el dolor"], ["Inestabilidad GH", "Anterior: aprensión, recolocación y sorpresa (S y E >72 %). Interpretar la aprensión, no el dolor. Posterior: no usar un test aislado; agrupar Jerk, Kim y signo de pinzamiento posterior junto con la historia.", "Aprensión de 0 a 10 en abducción + RE; en posterior, la posición provocadora", "Fuerza isométrica de RE y RI con dinamómetro si se dispone, siempre en la misma posición"], ["Acromioclavicular", "Palpación AC (S 96 %, E 10 %): si no duele, hace poco probable el cuadro; si duele, no lo confirma. Aducción horizontal con el brazo a 90° de flexión (S >67 %, E 79 %). Movilidad pasiva sin restricción; posible escalón.", "Aducción horizontal → EVA", "Grados de aducción horizontal hasta la aparición del dolor, en la misma posición"], ["Lesión SLAP", "Ningún hallazgo físico es específico. Compresión-rotación activa (S 72 %, E 52 %): sirve para sostener la hipótesis, no para confirmarla.", "Gesto por encima de la cabeza que reproduce el síntoma mecánico → EVA", "Fuerza isométrica de RE y RI con dinamómetro si se dispone, siempre en la misma posición"], ["Rotura del manguito", "Inspección: brazo en cabestrillo, escápula en rotación inferior o inclinación anterior, cabeza humeral anteriorizada. Cluster A: arco doloroso + drop arm + debilidad en RE → LR+ 15,6 con los tres positivos. Cluster B: edad >65 + debilidad en RE + dolor nocturno → LR+ 9,8 con los tres positivos.", "Elevación activa o arco doloroso → EVA", "Fuerza isométrica en RE con dinamómetro si se dispone (brazo junto al cuerpo, codo a 90°) o grados de elevación activa"], ["Hombro congelado", "Restricción equivalente de movilidad activa y pasiva: es el dato que más discrimina. La RE se considera la más afectada, pero la RI suele estar muy limitada con el brazo cerca de 90° de abducción. Criterio de Bunker: restricción igual de RE activa y pasiva + Rx esencialmente normal.", "Final del rango de RE pasiva → EVA (más útil cuando dolor > rigidez)", "RE pasiva en grados a 0° de abducción y RI a 90° de abducción (más útil cuando rigidez > dolor)"]], "nota": "No usar en hombro congelado: test específicos de MR, labrum o AC — casi siempre salen positivos al tensar una cápsula sensibilizada. Los test AC por separado son débiles: Paxinos + O’Brien combinados dan S y E >90 % (Ampliar)."}, "PRONOSTICO": {"titulo": "para «a las X sesiones espero Y; si no lo veo → Z»", "cabecera": ["Síndrome", "Horizonte e imagen", "Criterio de derivación o cuidado"], "filas": [["SAPS", "Una rotura completa del supraespinoso en ecografía aumenta la probabilidad, pero la imagen no mejora la capacidad de descartarlo.", "Dolor en reposo: puede indicar bursitis o proceso inflamatorio que tolere mal el movimiento vigoroso → dosificar. La idea de «espacio subacromial estrecho» es controvertida."], ["Inestabilidad", "Diagnóstico sobre todo clínico; la Rx simple puede identificar Bankart y Hill-Sachs. A las 3–4 semanas del episodio agudo hay poco dolor y recuperan movilidad y fuerza.", "La MDI se confunde con inestabilidad unidireccional, SAPS, patología discal cervical, plexitis braquial y desfiladero torácico. Tener presente Ehlers-Danlos o Marfan."], ["Acromioclavicular", "Rx y RM muestran patología AC, pero muchos cambios aparecen en personas sin síntomas.", "La infiltración ecoguiada tiene efecto diagnóstico y terapéutico: decisión médica."], ["SLAP", "La artro-RM es más precisa que la RM sin contraste.", "El SLAP aislado es raro y es frecuente en asintomáticos: tratarlo solo tiene sentido si explica los síntomas. Suele acompañar a rotura del MR, inestabilidad, rotura del bíceps o bursitis."], ["Rotura del manguito", "RM como referencia: rotura completa S 90 %, E 100 %; parcial S 100 %, E 87 %. No se observa curación espontánea y el tamaño puede aumentar en unos 2 años, también en asintomáticas.", "Alrededor del 40 % de la población tiene roturas asintomáticas: la rotura no explica por sí sola el dolor. La degeneración crece desde los 50–55 años mientras el dolor no traumático baja a partir de los 60–65."], ["Hombro congelado", "Se suele decir que se resuelve en 2–3 años, pero un 41 % sigue con síntomas a los 4 años y la mitad a los 7. No hay evidencia de que avance por estadios hasta curarse sin tratamiento. Rx normal salvo osteopenia o calcificación; RM no necesaria.", "Ejercicio en grupo supervisado: mejores resultados que el individual y que el ejercicio en casa. Derivar a psicología si los factores psicosociales superan tu competencia. Baja autoeficacia predice peor evolución. Contralateral en el 6–34 %."]], "nota": "③ lo elige el paciente; si no sabe: cartera del bolsillo trasero, sujetador o axila contraria (AC); peinarse, vestirse, alcanzar detrás de la espalda (congelado); lanzar (SLAP). Dosis y progresión no están en la guía: son tuyas.", "pie": "Guía clínica de hombro, ap. 5 y 6 · las filas ① y ② son propuestas de la guía, no proceden del capítulo · cuestionarios validados citados en el ap. 6: SPADI, DASH, ASES, SST, Constant"}, "ORIENTATIVA": {"titulo": "Rigidez activa = pasiva · qué lo distingue del hombro congelado", "bloque": "4", "cabecera": ["Condición", "Qué la distingue del hombro congelado", "Imagen"], "filas": [["Dolor del manguito", "Dolor mecánico provocado por los test de carga del MR; RE y abducción más afectadas; movilidad pasiva no muy limitada.", "Eco y RM (cambios también en asintomáticos)"], ["Acromioclavicular", "Dolor localizado y a la palpación sobre la AC, posible escalón, provocación con O’Brien o aducción horizontal; sin restricción pasiva.", "Rx y RM (cambios también en asintomáticos)"], ["Artrosis GH", "Mayor edad, dolor progresivo más largo y a menudo menos intenso, crepitación, posible atrofia.", "Rx simple la muestra"], ["Cervicogénico", "Dolor reproducible con los test cervicales; sin restricción pasiva GH.", "Rx y RM cervical (cambios también en asintomáticos)"], ["Neoplasia", "Se presenta parecido; antecedente de cáncer, pérdida de peso, fiebre, dolor implacable.", "Rx, gammagrafía, RM"], ["Luxación bloqueada", "Traumatismo previo, cualquier edad, rigidez activa y pasiva similar al congelado.", "Rx simple"], ["Fractura", "Traumatismo previo, osteoporosis.", "Rx; RM si fractura no desplazada del troquíter"]], "nota": "Los estadios del congelado se solapan: en la práctica es más útil clasificar como dolor > rigidez o rigidez > dolor y ajustar el tratamiento a eso."}, "ENLACES": {"1": {"botones": [{"pantalla": "banderas"}]}, "4": {"patrones": {"ACROMIOCLAVICULAR": "Acromioclavicular", "INESTABILIDAD": "Inestabilidad GH", "ROTURA DEL MANGUITO": "Rotura del manguito", "SLAP": "Lesión SLAP", "SAPS": "Dolor subacromial (SAPS)"}}, "2b": {"botones": [{"pantalla": "orientativa"}, {"pantalla": "sindrome", "fila": "Hombro congelado"}]}}, "PRONOSTICO_DE": {"Dolor subacromial (SAPS)": "SAPS", "Inestabilidad GH": "Inestabilidad", "Acromioclavicular": "Acromioclavicular", "Lesión SLAP": "SLAP", "Rotura del manguito": "Rotura del manguito", "Hombro congelado": "Hombro congelado"}, "FICHAS": {"Hombro congelado": {"pista": "Movilidad pasiva limitada igual que la activa (nodo 2b)", "orientativa": true, "nota": true}}, "ORIENTATIVA_GRUPOS": {"aviso": "Agrupación propia: la tarjeta lista las 7 condiciones en una sola tabla.", "grupos": [{"titulo": "Pasiva limitada, como el congelado", "resto": true, "filas": ["Artrosis GH", "Neoplasia", "Luxación bloqueada", "Fractura"]}, {"enlace": {"pantalla": "sindrome", "fila": "Hombro congelado", "sub": "Ficha del síndrome"}}, {"titulo": "Se parecen al congelado, pero con pasiva no limitada", "plegado": true, "filas": ["Dolor del manguito", "Acromioclavicular", "Cervicogénico"]}], "dice": {"Dolor del manguito": "movilidad pasiva no muy limitada", "Acromioclavicular": "sin restricción pasiva", "Cervicogénico": "sin restricción pasiva GH", "Luxación bloqueada": "rigidez activa y pasiva similar al congelado"}}, "CORTE_NOTA": "Dosis y progresión"}, "cadera": {"REGION": "cadera", "NOMBRE": "Cadera", "CARAS": ["A", "B", "C"], "TITULOS": {"caraA": "CADERA E INGLE · cara A   bloque 0 (con el paciente fuera) y bloques 3–4", "caraB": "CADERA E INGLE · cara B   bloques 4, 5 y 6, ya dentro de una rama del árbol", "pieA2": "Guía clínica de cadera e ingle, ap. 1 y 4 — Ficha de primera visita, bloques 0, 3 y 4"}, "BANDERAS": {"titulo": "Banderas rojas de la región — sobre el cribado general de la ficha", "cabecera": ["Sospecha → derivación médica", "Pistas en entrevista y exploración", "Ayuda en consulta"], "filas": [["Cáncer (óseo, partes blandas o metástasis)", "Antecedente de cáncer: próstata en el varón; aparato reproductor o mama en la mujer. ≥50 años, sin mejoría en 1 mes, pérdida de peso inexplicada. Masas o ganglios que crecen o fluctúan. Avulsión ósea en un adulto mayor.", "≥50 años + sin mejoría en 1 mes + pérdida de peso + cáncer previo: S 100 % para malignidad. Lo que más informa: cáncer previo, sospecha clínica, VSG elevada y hematocrito bajo. Radiografía primero; RM para caracterizar masas."], ["Fractura de estrés de rama púbica, diáfisis femoral o pelvis", "Mismo perfil que la de cuello femoral. Rama púbica: corredores y deportes con mucho trabajo de aductores; dolor localizado referido a ingle y nalga. Diáfisis: dolor vago en muslo anterior que empeora en carga.", "Rama púbica: el dolor NO aumenta con abducción pasiva ni con aducción resistida (a diferencia del aductor). Diáfisis: fulcro (S 88–93 %, E 13–75 %). Radiografía negativa no descarta; RM o gammagrafía si persiste la sospecha."], ["Osteonecrosis de la cabeza femoral", "Corticoides o alcohol prolongados, traumatismo o fractura previos, lupus y otras conectivopatías, hiperlipidemia; puede ser idiopática. Dolor inguinal profundo que empeora con la carga, varios test articulares positivos.", "Un rango de movimiento normal ayuda a descartarla. Radiografía y RM. Si no es traumática, la cadera no dolorosa está alterada en el 60 %: RM también de la otra cadera."], ["Lesiones del desarrollo", "EFCF: 9–16 años, durante el estirón. Perthes: 4–8 años, más en varones (4–5:1). Displasia: debilidad y marcha alterada; puede no detectarse al nacer y acelera la degeneración de articulaciones vecinas. Apofisitis púbica: deportistas hasta los primeros veinte años.", "Radiografía simple en edad de desarrollo (EFCF, Perthes, displasia, avulsiones). Apofisitis: mejor RM que TC por la radiación. Un antecedente de EFCF, Perthes o displasia hace más probable el dolor de cadera en el joven."], ["Fractura por avulsión", "Adolescente con tracción brusca: EIAI (recto femoral), EIAS (sartorio), pubis (aductores), tuberosidad isquiática (isquiotibiales), trocánter menor (psoas ilíaco), trocánter mayor (rotadores).", "Radiografía simple. En un adulto mayor, descartar metástasis."], ["Inflamatoria o infecciosa", "AR y otras artropatías multiarticulares, espondilitis anquilosante, artritis séptica, osteomielitis, absceso del psoas. Fiebre, malestar general, tumefacción dolorosa.", "VSG como prueba de bajo coste antes que la RM."], ["Hernia inguinal o femoral", "Inguinal: 80 % varones; dolor, tumefacción y bulto con sensación de peso o arrastre. Femoral: 85 % mujeres; nódulo lateral e inferior al tubérculo púbico.", "Palpar DE PIE el canal inguinal, por encima del ligamento y lateral al escroto; si no se nota, pedir que tosa. Una hernia palpable excluye el dolor «relacionado con la región inguinal»."], ["Visceral, urogenital o ginecológico", "Apendicitis, enfermedad de Crohn, diverticulitis; litiasis renal, uretritis; prostatitis, epididimitis, torsión testicular; endometriosis, quiste ovárico, enfermedad inflamatoria pélvica. Cáncer ginecológico, de próstata, testículo, vía urinaria o digestivo; linfoma.", "Denominador común: dolor atípico, sin relación clara con la carga, nocturno o con síntomas no musculoesqueléticos (escozor al orinar). Pensar en amplio."], ["Vascular", "Aneurisma de aorta abdominal, enfermedad vascular periférica, oclusión aortoilíaca (Leriche), variz de la safena, adenopatía inguinal: inflamatoria si hay foco séptico en el miembro inferior, sospechosa si no lo hay.", "El capítulo las enumera sin pistas propias: aplicar la regla del dolor atípico."]], "nota": "Si no se puede descartar: vigilancia activa, derivando si no mejora como se espera. Primero pruebas de bajo coste (VSG, radiografía) y RM solo si son positivas. Se revisan en todas las visitas."}, "BISAGRA": {"pregunta": "¿Flexión-RI o FADDIR reproducen su dolor, chasquido o enganche?", "ramas": "NO → INTRAARTICULAR IMPROBABLE: extraarticular, neuropático o referido      |      SÍ → seguir, pero no confirma: falta Thomas y la historia", "apoyo": "Embudo: primero descartar, después confirmar. Casi todos los test de cadera son muy sensibles y poco específicos (FADDIR: S 99 %, E 5 %). Sin dolor inguinal, FAIS y labrum son improbables (S 96–100 %).", "nota": "La guía no nombra «bisagra»: es el paso 5 de su árbol, usado como tal. Aquí la bisagra descarta, no clasifica — lo contrario que la RE pasiva del hombro."}, "ARBOL": {"filas": [["1", "¿Sospecha de fractura de estrés del cuello femoral (perfil, dolor en carga o al final de la RI, percusión positiva)? → DERIVACIÓN URGENTE.   ·   No → 2"], ["2", "¿Otras banderas rojas o dolor atípico (sin relación con la carga, nocturno, no musculoesquelético, masa)? → derivación médica o vigilancia activa.   ·   No → 3"], ["3", "¿Dolor lumbar, en nalga o por debajo de la rodilla, o poco que encontrar en la exploración local? → cribado lumbar y SI; si es negativo → 4.   ·   No → 4"], ["4", "¿Evento desencadenante concreto y reciente (chut, sprint, cambio de dirección, estiramiento)? → LESIÓN AGUDA: palpar primero; luego resistencia y estiramiento.   ·   No → 5"], ["5", "¿Flexión-RI o FADDIR reproducen su dolor, chasquido o enganche?   Sí → 5b   ·   No → INTRAARTICULAR IMPROBABLE → 6"], ["5b", "¿Thomas positivo con historia compatible (signo de la «C», síntomas mecánicos)?   Sí → INTRAARTICULAR PROBABLE: identificar entidad; ≥50 años, artrosis. Imagen o derivación si cambia el manejo.\nNo concluyente: pueden coexistir → 6."], ["6", "¿Qué reproduce su dolor conocido? INGLE, palpación: aductor + squeeze → ADUCTOR · psoas supra o infrainguinal → PSOAS ILÍACO · canal sin hernia → INGUINAL · sínfisis → PÚBICO. LATERAL: trocánter + derotación externa resistida → SDTM.\nNEUROPÁTICO: Tinel bajo la EIAS → MERALGIA · ingle y muslo medial con ejercicio → OBTURADOR · arch and twist → ILIOINGUINAL, ILIOHIPOGÁSTRICO o GENITOFEMORAL. Nada encaja o dolor extenso → SENSIBILIZACIÓN CENTRAL y revisar banderas rojas."]]}, "SINDROMES": {"aviso": "Antes de explorar: severidad e irritabilidad. Alta → solo bisagra y 1–2 tests, sin final de rango ni repeticiones provocadoras; el resto, en la próxima visita. Lo habitual es que varias entidades coexistan.", "cabecera": ["Síndrome", "Explorar · 10′", "① Gesto testigo", "② Medida objetiva"], "filas": [["FAIS", "Sin dolor inguinal, improbable (S 96–100 %). Flexión-RI (S 96 %, E 25 %) y FADDIR (S 99 %, E 5 %): solo descartan. Thomas (S 89 %, E 92 %, LR+ 11,1, LR− 0,12): descarta y confirma. Positivo: dolor conocido, bloqueo, chasquido o enganche.", "FADDIR con sobrepresión suave → EVA", "RI pasiva a 90° de flexión en supino frente al otro lado, o profundidad de sentadilla con los pies marcados"], ["Labrum", "Dolor inguinal (S 96–100 %); lateral en el 59 %. Chasquido doloroso (S 100 %, E 85 %): sin él la rotura es improbable. Flexión-RI y FADDIR para descartar; que reproduzcan el chasquido o el enganche cuenta como positivo. Thomas si la sospecha persiste. Observar longitud de paso.", "FADDIR hasta el dolor o el chasquido conocido → EVA (anotar si aparece el chasquido)", "Longitud de paso: número de pasos en un recorrido marcado de 10 m a velocidad cómoda"], ["Ligamento redondo e inestabilidad", "Sin síntoma específico: descartar lo intraarticular con flexión-RI y FADDIR. Movilidad AUMENTADA en inestabilidad. Log roll: más RE en el lado afectado, o el borde lateral del pie toca la camilla → laxitud capsular anterior o retroversión. Al menos un episodio de fallo.", "Abducción de cadera en supino hasta el síntoma conocido (dolor, fallo o «clunk») → EVA", "Alcance en SEBT en apoyo sobre la pierna afectada, mismas direcciones, frente al lado sano"], ["Condropatía", "Cribado intraarticular (flexión-RI, FADDIR) y Thomas. Dolor en reposo y nocturno con síntomas mecánicos; rigidez; IMC >25.", "Bajada de escalón con la pierna afectada, altura fija → EVA", "Profundidad de sentadilla bipodal sin dolor (distancia glúteo–suelo), con los pies en posición marcada"], ["Artrosis", "Criterios clínicos del Colegio Americano de Reumatología en mayores de 50: dolor de cadera + dolor en RI + rigidez matutina de menos de una hora → S 86 %, E 75 %, LR+ 3,4, LR− 0,19. Apoyan: RI de 15–25° con flexión ≤115°; RI dolorosa.", "RI pasiva a 90° de flexión en supino hasta el final del rango → EVA", "Grados de RI a 90° de flexión y de flexión pasiva en supino, frente al otro lado"], ["Lesión aguda de ingle", "Palpar PRIMERO: si no duele, se descarta (exactitud >90 % en aductores y flexores). Después, resistencia y estiramiento del grupo sospechoso. Aductores (el largo en unos 2/3), recto femoral, ilíaco y psoas.", "El test de resistencia más provocador de la batería (squeeze a 0° o flexión resistida a 90°) → EVA", "Fuerza isométrica con HHD del grupo lesionado, misma posición, frente al lado sano (vuelta al deporte: déficit <10–20 %)"], ["SDTM", "Palpación del trocánter mayor primero (S 80 %), rápida y útil para descartar. Derotación externa resistida (S 88 %, E 97,3 %, LR+ 32,6, LR− 0,12): supino, cadera a 90° en RE; vuelve a neutro contra resistencia. Si es negativo, repetir en prono con rodilla a 90°.", "Derotación externa resistida en supino → EVA", "Segundos en apoyo monopodal sobre la pierna afectada hasta el dolor (máximo 30), sin apoyo de manos"], ["Neuropatías", "Meralgia (la más frecuente): Tinel 1 cm medial e inferior a la EIAS, neurodinámico del femorocutáneo, parestesias anterolaterales. Obturador: neurodinámico, sensibilidad del muslo medial y fuerza de aductores, a ser posible tras el deporte. Ilioinguinal, iliohipogástrico y genitofemoral: arch and twist de pie.", "La maniobra que reproduce el síntoma (neurodinámico, Tinel o arch and twist) → EVA", "Obturador: fuerza de aducción con HHD tras la actividad. Resto: tiempo de actividad desencadenante (sentado, bici, carrera) hasta los síntomas"], ["Sensibilización central", "Dolor multifocal, referido y extenso; dolor en las AVD; fatiga y mal sueño; dificultades de memoria; más comorbilidad; intolerancia al estrés, ansiedad o depresión. Sin criterios clínicos validados.", {"span": "Coexiste con la patología intraarticular y hace los síntomas vagos y cambiantes: NO excluye patología estructural. Usa el ① y el ② de la entidad que mejor encaje."}]], "nota": "Palpa primero y con precisión: las estructuras se solapan. Resistencia y estiramiento cuentan si reproducen su dolor en el mismo sitio. El dolor SI rara vez coexiste con otra fuente: si hay otro diagnóstico válido o hay centralización, un test SI positivo probablemente es un falso positivo."}, "PRONOSTICO": {"titulo": "para «a las X sesiones espero Y; si no lo veo → Z»", "cabecera": ["Entidad", "Horizonte e imagen", "Criterio de derivación o cuidado"], "filas": [["FAIS", "Radiografía AP de pelvis + axial. CAM: ángulo alfa >55°. PINCER: sobrecobertura, signo del cruce. Artro-RM para labrum y cartílago.", "CAM en asintomáticos: 54,8 % de deportistas y 23,1 % de población general. Sin dolor relacionado con el movimiento NO hay FAIS. CAM tiende a lesionar el cartílago; PINCER, el labrum."], ["Labrum", "Artro-RM (contraste necesario). Mayoría anterosuperiores. Diferenciar del surco sublabral, variante normal.", "Más de dos tercios de los asintomáticos tienen hallazgos sugestivos, más aún los deportistas. La sinovitis mantenida puede favorecer la condropatía."], ["Ligamento redondo e inestabilidad", "Artro-RM. Los test de confirmación se basan en estudios únicos.", "La inestabilidad puede conducir a degeneración condral."], ["Condropatía", "Difícil de ver: cartílago fino y profundo. La artro-TC lo muestra mejor. Delaminación asociada a FAIS.", "Posible estadio inicial de la artrosis precoz."], ["Artrosis", "Radiografía: pinzamiento del espacio articular u osteofitos.", "Considerarla siempre en mayores de 50, también en deportistas. La sensibilización central se ha estudiado sobre todo aquí y hace los síntomas vagos."], ["Aductor y resto de Doha", "Ecografía o RM (planos axiales oblicuos para la inserción): edema óseo en la sínfisis, signo de la hendidura secundaria.", "AINE y reposo reducen el dolor, pero suele volver al retomar el deporte. La debilidad de cadera aumenta el riesgo: vuelta al deporte con déficit de fuerza <10–20 %."], ["SDTM", "RM: tendinopatía y roturas del glúteo menor al medio, líquido en las bolsas. Atrofia grasa (grados I–III): factor pronóstico importante.", "Diferencial: cadera en resorte externa, labrum (dolor lateral en el 59 %), meralgia y neuropatía iliohipogástrica."], ["Neuropatías", "EMG y conducción nerviosa: baja S y E en esta región. Alivio con bloqueo diagnóstico.", "Sospecha por patrón clínico, exploración neurológica y neurodinámicos. Considerar siempre atrapamientos lumbares."]], "nota": "③ lo elige el paciente. Cuestionario aparte: HAGOS (o HOS, iHOT). Dosis y progresión no están en la guía: son tuyas.", "pie": "Guía clínica de cadera e ingle, ap. 5 y 6 · entidades de Doha y filas Imagen, Cuidado y Pronóstico"}, "URGENCIA": {"titulo": "DERIVACIÓN URGENTE · FRACTURA DE ESTRÉS DEL CUELLO FEMORAL", "lineas": ["Puede completarse y comprometer la vascularización de la cabeza femoral. Dolor inguinal vago e insidioso que empeora con la actividad; a menudo el único hallazgo es dolor al final del rango, sobre todo en RI. Dolor profundo nocturno o en carga.", "Perfil: corredor de fondo, militar o deportista de alta intensidad; poca forma al empezar, cambio de superficie o calzado; mujer con tríada de la deportista; corticoides prolongados.", "Percusión rotuliano-púbica (S 95 %, E 86 %, LR+ 6,11, LR− 0,07): supino, fonendoscopio sobre el tubérculo púbico homolateral y percusión de la rótula; positivo si el sonido llega disminuido en el lado doloroso. Talón: golpe con el borde cubital del puño; positivo si reproduce el dolor con la carga axial.", "Una radiografía negativa NO descarta, sobre todo en las primeras semanas. · Adenopatía inguinal sin foco séptico: considerar malignidad. · Sospecha de torsión testicular o de artritis séptica: urgencias hoy."]}, "ORIENTATIVA": {"titulo": "Ingle de larga evolución · entidades de Doha", "bloque": "4 y 5", "cabecera": ["Entidad", "Necesario para el diagnóstico", "Más probable si reproduce el dolor", "① Gesto testigo  ·  ② Medida objetiva"], "filas": [["Aductor", "Palpación dolorosa de aductores Y squeeze doloroso", "Estiramiento pasivo de aductores", "① Squeeze de 5 s, misma posición → EVA. ② Fuerza isométrica de aducción con HHD en supino, frente al otro lado y en ratio con la abducción"], ["Psoas ilíaco", "Palpación dolorosa supra O infrainguinal", "Flexión resistida con cadera y rodilla a 90°; flexión resistida o extensión pasiva en Thomas modificado", "① Flexión resistida en Thomas modificado → EVA. ② Fuerza isométrica de flexión con HHD en esa misma posición"], ["Inguinal", "Dolor en la región del canal + palpación dolorosa del canal + SIN hernia palpable (explorar de pie y con tos)", "Sit-up recto u oblicuo resistido; Valsalva, tos o estornudo; flexión resistida en Thomas modificado", "① Sit-up oblicuo resistido → EVA. ② Plancha lateral: segundos a cada lado, siempre con el mismo apoyo"], ["Púbico", "Palpación dolorosa de la sínfisis y el hueso adyacente", "Resistencia abdominal y squeeze. No hay test de resistencia específico", "① Squeeze de 5 s, misma posición → EVA. ② Fuerza isométrica de squeeze con HHD a una flexión de cadera fija"], ["Cadera", "Ver las fichas intraarticulares de arriba", "Flexión-RI, FADDIR, Thomas", "Los de la entidad intraarticular que encaje"]], "nota": "La extensión pasiva en Thomas modificado es a la vez el test de Thomas para patología intraarticular: interpretarlo junto con la palpación del psoas y la historia."}, "ENLACES": {"1": {"botones": [{"pantalla": "banderas", "sub": "Sospecha de fractura de estrés del cuello femoral"}]}, "2": {"botones": [{"pantalla": "banderas", "sub": "Otras banderas rojas o dolor atípico"}]}, "4": {"botones": [{"pantalla": "sindrome", "fila": "Lesión aguda de ingle", "sub": "Evento desencadenante concreto y reciente"}]}, "6": {"botones": [{"pantalla": "orientativa", "sub": "Aductor · psoas ilíaco · inguinal · púbico (entidades de Doha)"}, {"pantalla": "sindrome", "fila": "SDTM", "sub": "Trocánter + derotación externa resistida"}, {"pantalla": "sindrome", "fila": "Neuropatías", "sub": "Tinel, arch and twist u otro patrón neuropático"}, {"pantalla": "sindrome", "fila": "Sensibilización central", "sub": "Nada encaja o dolor extenso"}]}, "5b": {"botones": [{"pantalla": "sindrome", "fila": "FAIS"}, {"pantalla": "sindrome", "fila": "Labrum"}, {"pantalla": "sindrome", "fila": "Ligamento redondo e inestabilidad"}, {"pantalla": "sindrome", "fila": "Condropatía"}, {"pantalla": "sindrome", "fila": "Artrosis"}]}}, "PRONOSTICO_DE": {"Lesión aguda de ingle": "Aductor y resto de Doha", "Sensibilización central": null}, "FICHAS": {"FAIS": {"pista": "Intraarticular probable (nodo 5b): identificar la entidad", "nota": true}, "Labrum": {"pista": "Intraarticular probable (nodo 5b): identificar la entidad", "nota": true}, "Ligamento redondo e inestabilidad": {"pista": "Intraarticular probable (nodo 5b): identificar la entidad", "nota": true}, "Condropatía": {"pista": "Intraarticular probable (nodo 5b): identificar la entidad", "nota": true}, "Artrosis": {"pista": "Intraarticular probable (nodo 5b): identificar la entidad", "nota": true}, "Lesión aguda de ingle": {"pista": "Evento desencadenante concreto y reciente (nodo 4)", "orientativa": true, "nota": true}, "SDTM": {"pista": "Trocánter + derotación externa resistida (nodo 6)", "nota": true}, "Neuropatías": {"pista": "Patrón neuropático: Tinel, arch and twist u otro (nodo 6)", "nota": true}, "Sensibilización central": {"pista": "Nada encaja o dolor extenso (nodo 6)", "nota": true}}}, "rodilla": {"REGION": "rodilla", "NOMBRE": "Rodilla", "CARAS": ["A", "A2", "B", "C"], "TITULOS": {"caraA": "RODILLA · cara A   bloque 0 (con el paciente fuera) y bloques 3–4", "caraB": "RODILLA · cara B   rodilla aguda traumática y dolor anterior persistente", "pieA2": "Guía clínica de rodilla, ap. 4 — Ficha de primera visita, bloque 4"}, "BANDERAS": {"titulo": "Banderas rojas de la región — sobre el cribado general de la ficha", "cabecera": ["Sospecha → derivación médica", "Pistas en entrevista y exploración", "Ayuda en consulta"], "filas": [["Fractura de rótula o de meseta tibial", "Mecanismo conocido: golpe directo, rótula contra el salpicadero, caída sobre la rodilla, o indirecto (saltar y caer mal). Meseta: alta energía en varones jóvenes, baja energía en mujeres mayores u osteoporóticas. Hinchazón inmediata, incapacidad para cargar, movilidad limitada, chasquido en el momento.", "Regla de Ottawa. Palpación de rótula, cabeza del peroné y meseta; posible escalón palpable; dolor con extensión resistida; marcha antiálgica con rodilla rígida."], ["Epifisiólisis femoral proximal o Perthes", "Niño o adolescente con dolor de rodilla SIN mecanismo conocido. El patrón de dolor es constante y obliga a derivar.", "Cribado de cadera PRIMERO: rango activo y pasivo de la cadera ipsilateral. Solo si es normal, la rodilla es la localización primaria."], ["Luxación de rodilla y traumatismo multiligamentoso", "Alta energía, golpe en la cara anteromedial, lesión de salpicadero o hiperextensión. Hasta el 95 % de las lesiones del LCP vistas en urgencias son combinadas; en hemartrosis agudas por lesión ligamentosa, un 9 % tiene lesión de la EPL.", "Hemartrosis aguda tras alta energía: valorar función neurovascular y derivar antes de forzar la exploración."], ["Lesión del nervio peroneo común", "Pie caído, tropezar con el pie, parestesias y debilidad en la cara lateral de la pierna y el dorso del pie, tras esguince o luxación de la tibioperonea proximal, fractura de tibia o peroné, lesión ligamentosa o cirugía de rodilla.", "Marcha en steppage; fuerza de eversión y de flexión dorsal de tobillo y dedos; sensibilidad; Tinel sobre la cabeza del peroné."], ["Pseudotromboflebitis por quiste poplíteo", "Dolor o hinchazón en la pantorrilla y signo de Homans positivo en un quiste grande, disecado o roto. El quiste también puede causar síndrome compartimental y neuropatías por compresión.", "Clínicamente no se puede separar de una tromboflebitis real: derivar. La ecografía es la primera opción para diferenciar quiste de TVP."], ["Lesión osteocondral inestable", "Chasquidos, enganches o bloqueos muy dolorosos: el fragmento bloquea físicamente el movimiento. Derrame y pérdida de rango.", "Derrame + tope mecánico + rango limitado → imagen (radiografía de elección) y derivación."], ["TVP · Wells con puntuación (anexo)", "+1 cada uno: cáncer activo (tratamiento en 6 meses o paliativo) · parálisis, paresia o inmovilización con férula · encamamiento ≥3 días o cirugía mayor en 12 SEMANAS · dolor en el trayecto venoso profundo · hinchazón de toda la pierna · pantorrilla >3 cm más gruesa, medida 10 cm bajo la tuberosidad tibial · edema con fóvea solo en la pierna sintomática · venas colaterales no varicosas · TVP previa documentada. −2: hay un diagnóstico alternativo al menos tan probable como la TVP.", "2 o más → TVP probable; 1 o menos → improbable. El capítulo lista el ítem que resta junto a los demás y sobreestima. Orienta la derivación, no la sustituye."], ["Tumor", "El capítulo no da criterios clínicos propios: solo lo menciona como bandera roja que la radiografía ayuda a descartar al valorar una apofisitis tibial en el adolescente.", "Si se pide imagen en un adolescente con dolor en la tuberosidad tibial, la radiografía simple ayuda a descartar fractura aguda y tumor."]], "nota": "Las banderas rojas se revisan en todas las visitas, no solo en la primera."}, "BISAGRA": {"pregunta": "¿Hubo traumatismo agudo, y dónde se localiza el dolor?", "ramas": "TRAUMÁTICO → Ottawa primero, después por mecanismo: pivote · valgo · giro · salpicadero · varo · rótula      |      NO TRAUMÁTICO → por localización: anterior · medial · lateral · posterior", "apoyo": "La localización orienta, pero mira arriba y abajo: el dolor puede venir de la cadera o de la columna lumbar, y la función de la rodilla depende del rendimiento de cadera y tobillo. En menores sin mecanismo, cadera antes que rodilla.", "nota": "La guía de rodilla no nombra una bisagra como la RE pasiva del hombro: son los pasos 2 y 7 de su árbol — mecanismo primero, localización después — usados como tal."}, "ARBOL": {"filas": [["1", "¿Sospecha de TVP, bursa caliente y roja con fiebre, o alteración neurovascular distal? → URGENCIA: derivación médica hoy.   ·   No → 2"], ["2", "¿Traumatismo agudo?   Sí → 3   ·   No → 5"], ["3", "¿Algún criterio de Ottawa (≥55 años · cabeza del peroné · rótula aislada · no flexiona 90° · no carga cuatro pasos)? → DERIVAR PARA RADIOGRAFÍA antes de seguir explorando.   ·   No → 4\nY en toda rodilla traumática con dolor anterior, elevación de la pierna extendida: si no puede → aparato extensor, que Ottawa no detecta. Alternativa a Ottawa (anexo): Pittsburgh — contusión o caída MÁS (<12 o >50 años, o no da cuatro pasos ahora); S ≈99 % con E ≈60 %, pide menos radiografías."], ["4", "Rodilla aguda traumática, ¿qué mecanismo cuenta? Pivote o caída de un salto + chasquido + derrame inmediato → LCA · valgo con el pie fijo → LCM (mirar LCA y menisco medial) · giro con el pie apoyado + bloqueo o enganche + derrame en 6–24 h → MENISCO.\nGolpe en tibia anterior con rodilla flexionada (salpicadero) → LCP y EPL · golpe anteromedial o varo cerca de la extensión → LLE y EPL · la rótula «se salió», aprensión al trasladarla lateralmente → INESTABILIDAD ROTULIANA · golpe directo anterior, dolor con extensión resistida, escalón palpable → FRACTURA."], ["5", "¿Niño o adolescente con dolor de rodilla sin mecanismo conocido? → EXPLORAR PRIMERO LA CADERA (epifisiólisis, Perthes). Solo si el cribado es normal, seguir en la rodilla.   ·   No → 6"], ["6", "¿Reproduce el dolor de rodilla la exploración de la cadera o de la columna lumbar? → CADERA (artrosis) o COLUMNA LUMBAR (radiculopatía o pseudorradiculopatía): tratar el origen.   ·   No → 7"], ["7", "Dolor persistente o sin traumatismo, ¿dónde se localiza? ANTERIOR → tendinopatía rotuliana (polo inferior, sentadilla monopodal) · dolor FR (difuso, sentadilla) · Hoffa (recurvatum, test de Hoffa) · bursitis prerrotuliana (superficial, arrodillarse) · inestabilidad rotuliana (fallo, aprensión) · lesión osteocondral (bloqueo) · en menores, apofisitis por tracción.\nMEDIAL → menisco medial · artrosis (criterios ACR) · bursitis anserina · plica medial. LATERAL → cintilla iliotibial (2–3 cm sobre la interlínea) · tibioperonea proximal · menisco lateral · nervio peroneo común. POSTERIOR → quiste poplíteo (signo de Foucher) · LCP crónico · columna lumbar. Descartada siempre la TVP."]]}, "SINDROMES": {"aviso":
