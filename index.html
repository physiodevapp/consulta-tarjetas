// ════════════════════════════════════════════════════════════════
//  Datos: una sola URL para todas las regiones (tarea 3).
//    DATA.APP       nombre de la app (app.json); título de pestaña y cabecera del inicio
//    DATA.REGIONES  [{region, nombre, disponible}]  para el selector del inicio
//    DATA.DATOS     {<región>: datos de esa región}  solo las que ya están migradas
//  Los datos de cada región son la tarjeta (tarjeta_<región>.js) más los campos
//  propios de la SPA (spa_<región>.js), fundidos por datos.js:
//    REGION NOMBRE · TITULOS BANDERAS BISAGRA ARBOL SINDROMES
//    ORIENTATIVA? PRONOSTICO · ENLACES? PRONOSTICO_DE? FICHAS? ORIENTATIVA_GRUPOS? CORTE_NOTA?
//  Aquí no hay texto de ninguna región: los rótulos o salen de la tarjeta
//  o son de la SPA y valen igual para todas.
// ════════════════════════════════════════════════════════════════
// D: datos planos de la región que se está viendo; R: lo que se deriva de D.
// Se recalculan al entrar en una región (irARegion); el selector del inicio no los usa.
let D = null;
let R = null;

// ════════════════════════════════════════════════════════════════
//  Utilidades
// ════════════════════════════════════════════════════════════════
const sp = t => (t || '').replace(/[ \t]{2,}/g, ' ').trim();
const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
const min1 = s => s.charAt(0).toLowerCase() + s.slice(1);
const bloque = (n, txt) => 'Bloque ' + n + (txt ? ' · ' + txt : '');
// Los títulos de la tarjeta vienen como «Título — qué es» o «Título · qué es»:
// la primera parte titula la pantalla y la segunda la describe.
const partir = (t, sep) => { const i = (t || '').indexOf(sep); return i < 0 ? [sp(t), ''] : [sp(t.slice(0, i)), sp(t.slice(i + sep.length))]; };
const frase1 = t => partir(t, '. ')[0];

function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, val] of Object.entries(props || {})) {
    if (k === 'class') e.className = val;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), val);
    else if (val === true) e.setAttribute(k, '');
    else if (val !== false && val != null) e.setAttribute(k, val);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(c));
  }
  return e;
}

// ════════════════════════════════════════════════════════════════
//  Lectura de los datos: todo lo que se deriva de una región, una vez
// ════════════════════════════════════════════════════════════════
function cargarRegion(d) {
  const ARBOL = Object.fromEntries(d.ARBOL.filas.map(([n, t]) => [n, t]));
  const ENLACES = d.ENLACES || {};
  const FICHAS = d.FICHAS || {};
  const GRUPOS = d.ORIENTATIVA_GRUPOS || null;
  const sind = n => d.SINDROMES.filas.find(f => f[0] === n);
  const pron = n => d.PRONOSTICO.filas.find(f => f[0] === ((d.PRONOSTICO_DE || {})[n] || n));

  // Rótulos que salen de la propia tarjeta
  const [TIT_BANDERAS, SUB_BANDERAS] = partir(d.BANDERAS.titulo, ' — ');
  const [TIT_ORIENT, SUB_ORIENT] = partir(d.ORIENTATIVA ? d.ORIENTATIVA.titulo : '', ' · ');
  const TIT_AVISO = frase1(d.SINDROMES.aviso);

  // Nodo que reparte la pregunta en botones (ENLACES[n].patrones): su primera línea
  // son pares «condición → ETIQUETA» y el resto de líneas cierra el árbol como nota.
  const NODO_PATRONES = Object.keys(ENLACES).find(n => ENLACES[n].patrones) || null;
  function patrones(n) {
    const mapa = ENLACES[n].patrones, l = ARBOL[n].split('\n')[0], i = l.indexOf('? ');
    return (i < 0 ? l : l.slice(i + 2)).split(' · ').map(s => {
      const [cond, et] = s.split(' → ');
      return { cond: sp(cond), clave: mapa[sp(et).replace(/\.$/, '')] };
    }).filter(p => p.clave);
  }
  const PATRONES = NODO_PATRONES ? patrones(NODO_PATRONES) : [];
  const CLAVE_PATRON = Object.fromEntries(PATRONES.map(p => [p.clave, p.cond]));
  const CIERRE = NODO_PATRONES ? ARBOL[NODO_PATRONES].split('\n').slice(1).join('\n') : '';
  // La nota del pronóstico se parte en dos párrafos por CORTE_NOTA; el texto no se toca
  const NOTAS_PRON = (() => {
    const t = d.PRONOSTICO.nota, i = d.CORTE_NOTA ? t.indexOf(d.CORTE_NOTA) : -1;
    return i < 0 ? [t] : [t.slice(0, i).trim(), t.slice(i).trim()];
  })();

  return { ARBOL, ENLACES, FICHAS, GRUPOS, sind, pron, TIT_BANDERAS, SUB_BANDERAS, TIT_ORIENT, SUB_ORIENT, TIT_AVISO, NODO_PATRONES, PATRONES, CLAVE_PATRON, CIERRE, NOTAS_PRON };
}

// ════════════════════════════════════════════════════════════════
//  Navegación (pila propia + botón Atrás de Android)
// ════════════════════════════════════════════════════════════════
let pila = [{ p: 'selector' }];
let hist = false;
let regionActual = null;
// Recorrido del árbol: solo en memoria (se borra al recargar); no se guarda nada en el navegador
let marcas = {};   // nodo -> 'hecho' | 'dudoso' | 'na'
let vistas = [];   // fichas de síndrome abiertas desde el árbol, en orden
const ESTADOS = [['hecho', '✓ Hecho'], ['dudoso', '? Dudoso'], ['na', '– No aplica']];
const SIMBOLO = { hecho: '✓', dudoso: '?', na: '–' };
function ir(p, arg) {
  if (p === 'sindrome' && !vistas.includes(arg)) vistas.push(arg);
  pila.push({ p, arg });
  try { history.pushState({ n: pila.length }, ''); hist = true; } catch (e) {}
  render(true);
}
// Entrar en una región desde el selector del inicio. El recorrido solo se reinicia si
// se cambia de región (para otra región, las marcas de esta no significarían nada).
function irARegion(clave) {
  if (clave !== regionActual) { marcas = {}; vistas = []; }
  regionActual = clave;
  D = DATA.DATOS[clave];
  R = cargarRegion(D);
  ir('home');
}
function volver() {
  if (pila.length <= 1) return;
  if (hist) { try { history.back(); return; } catch (e) {} }
  pila.pop(); render(true);
}
// Si la ficha ya es la pantalla anterior, vuelve en vez de apilar otra igual
function irAFicha(clave) {
  const prev = pila[pila.length - 2];
  if (prev && prev.p === 'sindrome' && prev.arg === clave) volver(); else ir('sindrome', clave);
}
window.addEventListener('popstate', () => { if (pila.length > 1) { pila.pop(); render(true); } });

// ════════════════════════════════════════════════════════════════
//  Componentes
// ════════════════════════════════════════════════════════════════
const nav = (titulo, sub, fn) => h('button', { type: 'button', class: 'nav', onclick: fn },
  h('div', { class: 'tx' }, h('b', {}, titulo), sub ? h('span', {}, sub) : null), h('i', { 'aria-hidden': 'true' }, '›'));
const big = (titulo, sub, fn) => h('button', { type: 'button', class: 'big', onclick: fn },
  h('div', { class: 'tx' }, h('b', {}, titulo), sub ? h('span', {}, sub) : null), h('i', { 'aria-hidden': 'true' }, '›'));
// Documentos descargables (formularios previos, ficha de primera visita, guía rápida):
// propios de la SPA, no del CONTENIDO clínico. docLink es la descarga en sí, en la pantalla
// «documentos»: un <a> a un .docx en descargas/, con el mismo aspecto que nav/big (ahí sí
// son el contenido principal de la pantalla). Se entra desde el botón #documentos de la
// cabecera (tarea 10, HTML estático, visible en toda la SPA salvo en la propia pantalla),
// no desde una fila más del selector.
const docLink = (titulo, sub, href) => h('a', { class: 'doc', href, download: true },
  h('div', { class: 'tx' }, h('b', {}, titulo), sub ? h('span', {}, sub) : null), h('i', { 'aria-hidden': 'true' }, '↓'));
const nota = t => h('p', { class: 'nota pre' }, sp(t));
const pie = t => h('p', { class: 'nota' }, sp(t));
const seccion = (titulo, texto) => h('section', { class: 'card' }, h('h3', {}, titulo), h('p', { class: 'pre' }, sp(texto)));
const plegable = (titulo, contenido, abierto) => h('details', { open: !!abierto }, h('summary', {}, titulo), h('div', { class: 'in' }, contenido));
// Celdas de una fila con la etiqueta de su columna. Como en pSindrome(): si la última
// celda es { span: "texto" } (fila sin ① ni ②, p. ej. Gota en tobillo y pie), es una
// sola nota combinada con las dos últimas etiquetas juntas, no una celda más.
const columnas = (fila, cabecera) => {
  const ultima = fila[fila.length - 1];
  const span = ultima && typeof ultima === 'object' ? ultima.span : null;
  const celdas = (span ? fila.slice(1, -1) : fila.slice(1)).map((c, i) => h('p', {}, h('span', { class: 'lab' }, cabecera[i + 1]), sp(c)));
  return span ? [celdas, h('p', {}, h('span', { class: 'lab' }, cabecera.slice(2).join(' · ')), sp(span))] : celdas;
};
// URGENCIA (opcional): mismo criterio visual que en el papel (borde grueso, sin rojo), líneas literales
const urgencia = U => U && h('section', { class: 'card urgencia' }, h('p', { class: 'nombre' }, U.titulo), U.lineas.map(l => h('p', { class: 'pre' }, sp(l))));
// Botón a un destino fijo de ENLACES: { pantalla, fila?, sub? }
function botonDestino(dest) {
  if (dest.pantalla === 'banderas') return big(R.TIT_BANDERAS, dest.sub, () => ir('banderas'));
  if (dest.pantalla === 'orientativa') return D.ORIENTATIVA ? big(R.TIT_ORIENT, dest.sub, () => ir('orientativa')) : null;
  if (dest.pantalla === 'sindrome') return R.sind(dest.fila) ? big(dest.fila, dest.sub, () => irAFicha(dest.fila)) : null;
  return null;
}

// ════════════════════════════════════════════════════════════════
//  Pantallas
// ════════════════════════════════════════════════════════════════
// Selector de región (el inicio; una sola URL para las cinco). Las regiones sin datos
// todavía (tarea 4) se ven pero no se pueden abrir.
function pSelector() {
  const filas = DATA.REGIONES.map(r => r.disponible
    ? nav(r.nombre, 'Tarjeta de consulta', () => irARegion(r.region))
    : h('div', { class: 'nav pendiente', 'aria-disabled': 'true' },
        h('div', { class: 'tx' }, h('b', {}, r.nombre), h('span', {}, 'Pendiente'))));
  return { titulo: DATA.APP, home: true, nodes: [
    h('p', { class: 'sub' }, 'Elige una región.'),
    h('div', { class: 'grid-regiones' }, filas),
    h('p', { class: 'sub', style: 'margin-top:18px' },
      'Proyecto personal para practicar y entrenar el razonamiento clínico en fisioterapia. No sustituye el juicio profesional.'),
    pie('Basado en Lluch, López-Cubas, Jones, Jull, Hall y Lewis — Pattern Recognition of Clinical Syndromes Related to Neuromusculoskeletal Pain Disorders (ZERAPI, 2020).')
  ] };
}

// Documentos descargables: tarjetas de consulta, formularios previos de cada región, ficha
// de primera visita y guía rápida, en .docx. Viven en descargas/ (raíz, publicado por
// GitHub Pages; rutas relativas, decisión 9). Son papel de consulta propio de la SPA, no
// CONTENIDO clínico: las anotaciones que los mencionan (p. ej. «criterio fijo en la guía
// rápida») no traían enlace hasta ahora. Tres grupos con su propio título (h3.grupo, el
// mismo que ORIENTATIVA_GRUPOS): con 14 enlaces, una lista plana era difícil de escanear.
// Une una lista de textos con comas y una «y» antes del último: ['A','B'] -> 'A y B',
// ['A','B','C'] -> 'A, B y C'. Genérico: no asume cuántos elementos trae la lista.
const listaY = xs => xs.length < 2 ? xs.join('') : xs.slice(0, -1).join(', ') + ' y ' + xs[xs.length - 1];
function pDocumentos() {
  const regiones = DATA.REGIONES.filter(r => r.disponible);
  const tarjetas = regiones.map(r =>
    docLink('Tarjeta · ' + r.nombre, 'Cara ' + listaY(r.caras) + ', para imprimir', 'descargas/tarjeta_' + r.region + '.docx'));
  const formularios = regiones.map(r =>
    docLink('Formulario previo · ' + r.nombre, 'Para el paciente, antes de la visita', 'descargas/formulario_previo_' + r.region + '.docx'));
  return { titulo: 'Documentos', nodes: [
    h('p', { class: 'sub' }, 'Se descargan en .docx, para imprimir o editar antes de usarlos.'),
    h('h3', { class: 'grupo' }, 'Tarjetas de consulta'),
    tarjetas,
    h('h3', { class: 'grupo' }, 'Formularios previos a la primera visita'),
    formularios,
    h('h3', { class: 'grupo' }, 'Generales'),
    docLink('Ficha de primera visita', 'Cribado · orientación de tratamiento · basal de seguimiento', 'descargas/ficha_primera_visita.docx'),
    docLink('Guía rápida', 'Criterio de severidad e irritabilidad', 'descargas/guia_rapida.docx')
  ] };
}

function pHome() {
  const n = [
    urgencia(D.URGENCIA),
    h('p', { class: 'sub' }, 'Tarjeta de consulta · guía clínica de ' + D.REGION),
    nav(R.TIT_BANDERAS, bloque(3, D.BANDERAS.filas.length + ' sospechas'), () => ir('banderas')),
    nav('Bisagra y árbol', bloque(4, 'pasivo y ' + D.ARBOL.filas.length + ' pasos · fichas de síndrome'), () => ir('arbol'))
  ];
  return { titulo: D.NOMBRE, nodes: n };
}

function pBanderas() {
  const B = D.BANDERAS;
  return { titulo: R.TIT_BANDERAS, nodes: [
    h('p', { class: 'sub' }, bloque(3, R.SUB_BANDERAS ? R.SUB_BANDERAS + '.' : '')),
    B.filas.map(f => h('section', { class: 'card' },
      h('p', { class: 'nombre' }, f[0]),
      f.slice(1).map((c, i) => h('p', {}, h('span', { class: 'lab' }, B.cabecera[i + 1]), c)))),
    nota(B.nota), pie(D.TITULOS.pieA2)
  ] };
}

const preguntaNodo = t => { const l = t.split('\n')[0]; const k = l.indexOf('?'); return sp(k < 0 ? l : l.slice(0, k + 1)); };
function marcar(n, e) {
  if (marcas[n] === e) delete marcas[n]; else marcas[n] = e;
  // El panel «Recorrido» cambia de alto según las marcas (aparece «Sin marcar», el
  // botón «Limpiar»…); sin esto, el nodo recién marcado saltaría en pantalla al redibujar.
  const antes = document.getElementById('nodo-' + n);
  const y0 = antes ? antes.getBoundingClientRect().top : null;
  render();
  const despues = document.getElementById('nodo-' + n);
  if (y0 !== null && despues) window.scrollBy(0, despues.getBoundingClientRect().top - y0);
}
function irANodo(n) { const el = document.getElementById('nodo-' + n); if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
const controlMarca = n => h('div', { class: 'marca', role: 'group', 'aria-label': 'Marcar nodo ' + n },
  ESTADOS.map(([e, t]) => h('button', { type: 'button', 'data-v': e, 'aria-pressed': String(marcas[n] === e), onclick: () => marcar(n, e) }, t)));

function chipsRecorrido() {
  return D.ARBOL.filas.map(f => f[0]).map(n => h('button', { type: 'button', class: 'paso', 'data-e': marcas[n] || '',
    'aria-label': 'Nodo ' + n + (marcas[n] ? ': ' + marcas[n] : ': sin marcar'), onclick: () => irANodo(n) },
    n + ' ' + (marcas[n] ? SIMBOLO[marcas[n]] : '·')));
}
// Títulos de ficha con un detalle final entre paréntesis (p. ej. «Dolor subacromial (SAPS)»,
// «Fracturas del pie (5.º MT, calcáneo)»): en la cabecera, con el nombre de la región y los tres
// iconos siempre presentes, casi cualquier título de más de una palabra ya envuelve a varias
// líneas por sí solo (comprobado con Playwright). Partir el paréntesis final en una segunda línea,
// más pequeña y atenuada, no reescribe el texto (decisión 2: sigue siendo el mismo, literal) y
// reduce las líneas que hacen falta para leerlo. Solo el último paréntesis, y solo si de verdad
// cierra el título (nada de texto después): un paréntesis a mitad de frase se deja como está.
function partirTitulo(t) {
  const m = /^(.*)\s(\([^()]*\))$/.exec(t);
  return m ? { principal: m[1], detalle: m[2] } : null;
}
// Cuando las cápsulas del panel salen de la pantalla por arriba, la cabecera muestra el recorrido en lugar del título
function actualizarCab() {
  const cur = pila[pila.length - 1], pasos = document.getElementById('recPasos');
  let modo = false;
  if (cur.p === 'arbol' && pasos) modo = pasos.getBoundingClientRect().bottom <= $('#cab').getBoundingClientRect().bottom;
  $('#titulo').hidden = modo; $('#cabRec').hidden = !modo;
  $('#cab').classList.toggle('modo-recorrido', modo);
}
window.addEventListener('scroll', actualizarCab, { passive: true });

function panelRecorrido() {
  const filas = D.ARBOL.filas, nodos = filas.map(f => f[0]);
  const cuenta = e => nodos.filter(n => marcas[n] === e).length;
  const dud = nodos.filter(n => marcas[n] === 'dudoso'), sin = nodos.filter(n => !marcas[n]);
  const alguna = nodos.some(n => marcas[n]);
  const texto = n => preguntaNodo(filas.find(f => f[0] === n)[1]);
  return h('section', { class: 'card rec', id: 'recorrido' },
    h('h3', {}, 'Recorrido'),
    h('div', { class: 'pasos', id: 'recPasos' }, chipsRecorrido()),
    !alguna ? h('p', { class: 'lin' }, 'Marca cada nodo al repasarlo: hecho, dudoso o no aplica.') : [
      h('p', { class: 'lin' }, 'Hechos ' + cuenta('hecho') + ' · Dudosos ' + dud.length + ' · No aplica ' + cuenta('na') + ' · Sin marcar ' + sin.length),
      dud.length ? [h('p', { class: 'lin' }, h('b', {}, 'Revisar')), dud.map(n => h('p', { class: 'lin' }, n + ' · ' + texto(n)))] : null,
      sin.length ? h('p', { class: 'lin' }, h('b', {}, 'Sin marcar: '), sin.join(', ')) : null],
    vistas.length ? h('p', { class: 'lin', style: 'color:var(--muted)' }, 'Fichas abiertas: ' + vistas.join(', ')) : null,
    alguna || vistas.length ? h('button', { type: 'button', class: 'ghost', onclick: () => { marcas = {}; vistas = []; render(); } }, 'Limpiar recorrido') : null);
}

// Botones de un nodo: los destinos fijos y, si reparte patrones, uno por patrón
function botonesNodo(n) {
  const e = R.ENLACES[n];
  if (!e) return null;
  const bs = (e.botones || []).map(botonDestino).filter(Boolean);
  if (n === R.NODO_PATRONES) for (const p of R.PATRONES) bs.push(big(p.clave, cap1(p.cond), () => irAFicha(p.clave)));
  return bs.length ? bs : null;
}

function pArbol() {
  const B = D.BISAGRA;
  const nodos = D.ARBOL.filas.map(([n, t]) => {
    const bs = botonesNodo(n);
    // el nodo que reparte patrones enseña solo la pregunta: los patrones son los botones
    const texto = n === R.NODO_PATRONES ? sp(t.split('\n')[0].split('? ')[0]) + '?' : sp(t);
    return h('section', { class: 'card', id: 'nodo-' + n },
      h('div', { class: 'nodo' }, h('span', { class: 'n' }, n), h('p', { class: 'pre' }, texto)),
      bs ? h('div', { class: 'acciones' }, bs) : null,
      controlMarca(n));
  });
  return { titulo: 'Bisagra y árbol', nodes: [
    h('p', { class: 'sub' }, bloque(4, 'revisa el recorrido de arriba abajo.')),
    h('div', { class: 'band pre' }, sp(D.SINDROMES.aviso)),
    panelRecorrido(),
    h('section', { class: 'card key' },
      h('p', { class: 'nombre' }, B.pregunta),
      h('p', { class: 'pre' }, sp(B.ramas).replace(/\s*\|\s*/, '\n')),
      h('p', { class: 'nota' }, sp(B.apoyo)),
      B.nota ? h('p', { class: 'nota' }, sp(B.nota)) : null),
    nodos, R.CIERRE ? nota(R.CIERRE) : null, pie(D.TITULOS.pieA2)
  ] };
}

function pSindrome(clave) {
  const S = D.SINDROMES, P = D.PRONOSTICO;
  const f = R.sind(clave), pr = R.pron(clave), cfg = R.FICHAS[clave] || {};
  // la pista dice por qué se ha llegado aquí: la del propio síndrome o su condición del árbol
  const pista = cfg.pista || cap1(R.CLAVE_PATRON[clave] || '');
  // síndromes sin ① ni ②: la última celda es { span: "texto" }, una sola nota combinada
  const ultima = f[f.length - 1];
  const span = ultima && typeof ultima === 'object' ? ultima.span : null;
  const celdas = span ? f.slice(1, -1) : f.slice(1);
  return { titulo: f[0], nodes: [
    pista ? h('p', { class: 'sub' }, pista) : null,
    celdas.map((c, i) => seccion(S.cabecera[i + 1], c)),
    span ? seccion(S.cabecera.slice(2).join(' · '), span) : null,
    pr ? plegable(bloque(6, 'horizonte y criterio'), columnas(pr, P.cabecera)) : null,
    plegable(R.TIT_AVISO, h('p', { class: 'pre' }, sp(S.aviso))),
    cfg.orientativa && D.ORIENTATIVA ? big('Diferencial: ' + min1(R.TIT_ORIENT), cap1(R.SUB_ORIENT), () => ir('orientativa')) : null,
    cfg.nota && S.nota ? nota(S.nota) : null,
    R.NOTAS_PRON.map(nota), pie(P.pie)
  ] };
}

// Tabla orientativa: cada fila con sus columnas etiquetadas. La agrupación,
// si la hay, es propia de la SPA y viene de ORIENTATIVA_GRUPOS.
function pOrientativa() {
  const O = D.ORIENTATIVA, P = D.PRONOSTICO, GRUPOS = R.GRUPOS;
  const dice = f => { const dc = GRUPOS && GRUPOS.dice && GRUPOS.dice[f[0]]; return dc && String(f[1]).includes(dc) ? cap1(dc) : null; };
  const plegables = [];   // solo uno abierto a la vez
  const fila = f => {
    const d = h('details', {},
      h('summary', {}, h('div', { class: 'st' }, h('b', {}, f[0]), dice(f) ? h('span', {}, dice(f)) : null)),
      h('div', { class: 'in' }, columnas(f, O.cabecera)));
    plegables.push(d);
    return d;
  };
  const grupos = GRUPOS ? GRUPOS.grupos : [{ resto: true }];
  const nombradas = grupos.reduce((a, g) => a.concat(g.filas || []), []);
  const filasDe = g => O.filas.filter(f => (g.filas || []).includes(f[0]) || (g.resto && !nombradas.includes(f[0])));
  const cuerpo = [];
  for (const g of grupos) {
    if (g.enlace) { const b = botonDestino(g.enlace); if (b) cuerpo.push(b); continue; }
    const fs = filasDe(g);
    if (!fs.length) continue;
    if (g.plegado) {
      const d = h('details', {},
        h('summary', {}, h('div', { class: 'st' }, h('b', {}, g.titulo), h('span', {}, fs.map(f => f[0]).join(' · ')))),
        h('div', { class: 'in' }, fs.map(f => h('div', { class: 'cond' },
          h('p', { class: 'nombre' }, f[0]),
          dice(f) ? h('p', { class: 'dice' }, dice(f)) : null,
          columnas(f, O.cabecera)))));
      plegables.push(d);
      cuerpo.push(d);
    } else {
      if (g.titulo) cuerpo.push(h('h3', { class: 'grupo' }, g.titulo));
      fs.forEach(f => cuerpo.push(fila(f)));
    }
  }
  plegables.forEach(d => d.addEventListener('toggle', () => { if (d.open) plegables.forEach(o => { if (o !== d) o.open = false; }); }));
  const sub = R.SUB_ORIENT ? R.SUB_ORIENT + '.' : '';
  return { titulo: R.TIT_ORIENT, nodes: [
    sub ? h('p', { class: 'sub' }, O.bloque ? bloque(O.bloque, sub) : sub) : null,
    cuerpo,
    nota(O.nota),
    GRUPOS && GRUPOS.aviso ? nota(GRUPOS.aviso) : null,
    pie(P.pie)
  ] };
}

// ════════════════════════════════════════════════════════════════
//  Render
// ════════════════════════════════════════════════════════════════
const PANTALLAS = { selector: pSelector, documentos: pDocumentos, home: pHome, banderas: pBanderas, arbol: pArbol, sindrome: pSindrome, orientativa: pOrientativa };
const $ = s => document.querySelector(s);
$('#back').addEventListener('click', volver);
// Documentos (tarea 10): botón permanente en la cabecera, en vez del enlace al final del
// selector (que obligaba a hacer scroll pasando las seis regiones y la cita para llegar).
// Se oculta solo en la propia pantalla «documentos», igual que #back se oculta en «home».
$('#documentos').addEventListener('click', () => ir('documentos'));

// Tema claro/oscuro: por defecto sigue al sistema (decisión 5, media query en el CSS
// de arriba); este botón deja forzar claro u oscuro para cuando el sistema no coincide
// con lo que se necesita en el momento (p. ej. pantalla muy brillante con luz de consulta).
// Como el recorrido del árbol y el wake lock, es un interruptor manual que vive solo en
// memoria (decisión 1): al recargar vuelve a "automático". El CSS ya distingue
// :root[data-theme="light"|"dark"] de :root:not([data-theme="light"]) bajo la media
// query — aquí solo se pone o se quita ese atributo.
let tema = 'auto';   // 'auto' (según el sistema) | 'light' | 'dark'
const SIG_TEMA = { auto: 'light', light: 'dark', dark: 'auto' };
const TEMA_COLOR = { light: '#1F5F4E', dark: '#5CC0A3' };
const TEMA_LABEL = { auto: 'automático (según el sistema)', light: 'claro', dark: 'oscuro' };
// Iconos en línea (decisión 6), mismo estilo que el del wake lock: contorno para «auto»
// (medio círculo relleno, como el icono habitual de tema del sistema), sol y luna para
// los dos forzados.
const TEMA_ICONO = {
  auto: '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">' +
    '<circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.7"/>' +
    '<path fill="currentColor" d="M12,3.5 A8.5,8.5 0 0 1 12,20.5 Z"/></svg>',
  light: '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">' +
    '<circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="1.7"/>' +
    '<g stroke="currentColor" stroke-width="1.7" stroke-linecap="round">' +
    '<line x1="12" y1="2" x2="12" y2="4.5"/><line x1="12" y1="19.5" x2="12" y2="22"/>' +
    '<line x1="2" y1="12" x2="4.5" y2="12"/><line x1="19.5" y1="12" x2="22" y2="12"/>' +
    '<line x1="4.9" y1="4.9" x2="6.6" y2="6.6"/><line x1="17.4" y1="17.4" x2="19.1" y2="19.1"/>' +
    '<line x1="4.9" y1="19.1" x2="6.6" y2="17.4"/><line x1="17.4" y1="6.6" x2="19.1" y2="4.9"/></g></svg>',
  dark: '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">' +
    '<path fill="currentColor" d="M20,14.5 A9,9 0 1 1 9.5,4 A7.2,7.2 0 0 0 20,14.5 Z"/></svg>'
};
const prefiereOscuro = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');

function aplicarTema() {
  if (tema === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = tema;
  const oscuro = tema === 'auto' ? !!(prefiereOscuro && prefiereOscuro.matches) : tema === 'dark';
  $('#temaColor').setAttribute('content', oscuro ? TEMA_COLOR.dark : TEMA_COLOR.light);
  const boton = $('#tema');
  boton.innerHTML = TEMA_ICONO[tema];
  boton.setAttribute('aria-pressed', String(tema !== 'auto'));
  boton.setAttribute('aria-label', 'Tema: ' + TEMA_LABEL[tema]);
  // title: mismo texto que aria-label, como tooltip en hover de escritorio (no sustituye
  // al aria-label — en móvil no hay hover, decisión 5 — solo lo refuerza a la vista)
  boton.setAttribute('title', 'Tema: ' + TEMA_LABEL[tema]);
}
$('#tema').addEventListener('click', () => { tema = SIG_TEMA[tema]; aplicarTema(); });
// Si se sigue en "automático", que el botón (y el color de la barra) reaccionen si el
// sistema cambia de tema mientras la SPA está abierta
if (prefiereOscuro) prefiereOscuro.addEventListener('change', () => { if (tema === 'auto') aplicarTema(); });
aplicarTema();

// Wake Lock (tarea 6): mantener la pantalla encendida durante la consulta. Es un
// interruptor manual (no se activa solo al entrar en una región) y, como el
// recorrido del árbol, vive solo en memoria: se pierde al recargar (decisión 1).
let wakeLock = null;
let wakeLockQuerido = false;

// Icono en forma de ojo (más intuitivo que un punto para «mantener visible/despierto»):
// contorno cuando está apagado, relleno con el hueco de la pupila cuando está activo.
// SVG en línea (decisión 6: sin librerías externas) en vez de un glifo Unicode, para no
// depender de que la fuente del móvil lo tenga dibujado.
const OJO_APAGADO = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">' +
  '<path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" ' +
  'd="M2,12 C2,12 6,5.5 12,5.5 C18,5.5 22,12 22,12 C22,12 18,18.5 12,18.5 C6,18.5 2,12 2,12 Z"/>' +
  '<circle cx="12" cy="12" r="3.1" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>';
const OJO_ENCENDIDO = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">' +
  '<path fill-rule="evenodd" clip-rule="evenodd" fill="currentColor" d="M12,5.5 C6,5.5 2,12 2,12 C2,12 6,18.5 12,18.5 ' +
  'C18,18.5 22,12 22,12 C22,12 18,5.5 12,5.5 Z M12,15.1 A3.1,3.1 0 1 0 12,8.9 A3.1,3.1 0 1 0 12,15.1 Z"/></svg>';

function actualizarBotonPantalla() {
  const boton = $('#pantalla');
  if (!boton) return;
  const activo = !!wakeLock;
  boton.setAttribute('aria-pressed', String(activo));
  // El relleno del icono ya distingue el estado a la vista; aria-label lo dice también para
  // quien use lector de pantalla, sin depender de hover (no existe en móvil, decisión 5)
  const texto = 'Mantener la pantalla encendida: ' + (activo ? 'activado' : 'desactivado');
  boton.setAttribute('aria-label', texto);
  // title: mismo texto, como tooltip en hover de escritorio (pedido por el usuario, igual
  // que en #tema); no sustituye al aria-label, en móvil no hace nada
  boton.setAttribute('title', texto);
  boton.innerHTML = activo ? OJO_ENCENDIDO : OJO_APAGADO;
}

async function pedirWakeLock() {
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; actualizarBotonPantalla(); });
  } catch (e) {
    wakeLock = null;
  }
  actualizarBotonPantalla();
}

async function soltarWakeLock() {
  if (wakeLock) await wakeLock.release();
  wakeLock = null;
  actualizarBotonPantalla();
}

if ('wakeLock' in navigator) {
  const boton = $('#pantalla');
  boton.hidden = false;
  actualizarBotonPantalla();
  boton.addEventListener('click', () => {
    wakeLockQuerido = !wakeLockQuerido;
    if (wakeLockQuerido) pedirWakeLock(); else soltarWakeLock();
  });
  // El navegador suelta el wake lock solo al ocultar la pestaña; si se sigue queriendo
  // al volver a verla, hay que pedirlo de nuevo
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && wakeLockQuerido && !wakeLock) pedirWakeLock();
  });
}

function render(arriba) {
  const y = window.scrollY, cur = pila[pila.length - 1];
  const s = PANTALLAS[cur.p](cur.arg);
  document.title = cur.p === 'selector' ? DATA.APP
    : cur.p === 'documentos' ? DATA.APP + ' · ' + s.titulo
    : cur.p === 'home' ? DATA.APP + ' ' + D.NOMBRE
    : s.titulo + ' · ' + D.NOMBRE;
  const pt = partirTitulo(s.titulo);
  if (pt) $('#titulo').replaceChildren(h('b', {}, pt.principal), ' ', h('span', {}, pt.detalle));
  else $('#titulo').replaceChildren(s.titulo);
  $('#back').hidden = !!s.home;
  $('#cab').classList.toggle('home', !!s.home);
  // El nombre de la región se ve siempre en la cabecera (una sola paleta: ya no lo dice el color),
  // menos en el selector, en documentos (no es de ninguna región) y en el inicio de la región,
  // donde ya es el título de la pantalla
  $('#regionCab').hidden = cur.p === 'selector' || cur.p === 'documentos' || cur.p === 'home';
  $('#regionCab').textContent = D ? D.NOMBRE : '';
  $('#documentos').hidden = cur.p === 'documentos';
  $('#main').replaceChildren(...[s.nodes].flat(Infinity).filter(Boolean));
  if (cur.p === 'arbol') $('#cabRec').replaceChildren(...chipsRecorrido());
  window.scrollTo(0, arriba ? 0 : y);
  actualizarCab();
}
render(true);

// PWA: uso sin conexión (tarea 5). Ruta relativa: GitHub Pages puede servir el sitio
// desde una subruta. Si falla (o el navegador no lo soporta), la SPA sigue igual,
// solo que sin caché para la próxima vez sin conexión.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
