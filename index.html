 "Antes de explorar: severidad e irritabilidad. Alta → solo bisagra y 1–2 tests; nada de sentadilla monopodal, step-down repetido, saltos ni flexión con sobrepresión. DERRAME (anexo): stroke test, barriendo la cara medial hacia el fondo de saco — 0 sin onda · traza · 1+ abombamiento · 2+ el líquido vuelve solo · 3+ no se desplaza. 2+ o 3+ → trátalo como irritabilidad alta. El peloteo solo detecta derrames grandes: negativo NO descarta. En fase aguda el grado del stroke test vale como ②: cambia rápido y no obliga a provocar dolor. Cronología: <2 h → hemartrosis (LCA, fractura osteocondral, luxación de rótula) · 6–24 h → menisco o reacción sinovial.", "cabecera": ["Síndrome", "Explorar · 10′", "① Gesto testigo", "② Medida objetiva"], "filas": [["LCA", "Confirmar: mecanismo de pivote + derrame inmediato + Lachman positivo → S 0,58 · E 0,95 · LR+ 17,5. Descartar: sin mecanismo de pivote ni chasquido + Lachman o pivot shift negativos → S 0,93 · E 0,87 · LR− 0,08.", "Apoyo monopodal o bajada de un escalón → EVA. Si predomina la inestabilidad, anotar episodios de fallo por semana", "Déficit de extensión activa frente al lado sano, en supino con el talón sobre una toalla (grados)"], ["LCM", "Valgo forzado a 30° de flexión. Combinar el mecanismo de la entrevista con dolor y laxitud en el test → S 0,56 · E 0,91 · LR+ 6,4 · LR− 0,5.", "Valgo forzado a 30°, o el gesto de apoyo o giro que reproduce el dolor → EVA", "Arco de flexión activa indoloro, con goniómetro en supino con la cadera a 0°"], ["Menisco", "Traumática: traumatismo (caída o pivote) + dolor medial o difuso + dolor a la palpación de la interlínea medial → S 0,91 · E 0,90 · LR+ 8,9 · LR− 0,10. Degenerativa: inicio progresivo + dolor medial aislado + uno de tres — dolor al pivotar, flexión pasiva completa, o sin desalineación → S 0,58 · E 0,91 · LR+ 6,4.", "Flexión máxima con sobrepresión o cuclilla parcial → EVA", "Grados de flexión hasta la aparición del dolor, en supino con la cadera a 90°"], ["LCP", "Cajón posterior a 90° de flexión: carga tibial posterior comparando con la rodilla sana. Grados: I <5 mm · II 5–10 mm · III >10 mm. Signo del sag posterior: supino, rodillas a 90° y pies apoyados; hundimiento de la tibia proximal visto de lado.", "Arrodillarse o bajar un escalón → EVA", "Grados de flexión activa tolerados sin dolor, en sedestación al borde de la camilla"], ["LLE y EPL", "Hinchazón y equimosis laterales en fase aguda; palpación dolorosa del ligamento. Varo forzado a unos 30° de flexión: laxitud y pérdida del tope firme; repetir a 0° para valorar el LCA. Marcha con empuje en varo.", "Varo forzado a 30° o el gesto en carga que provoca el fallo → EVA", "Tiempo de apoyo monopodal tolerado sin dolor ni fallo, descalzo y sin apoyo de manos"], ["Fracturas", "Regla de Ottawa antes de nada. Rótula: dolor localizado, posible escalón, dolor con extensión resistida, marcha con rodilla rígida. Meseta: hinchada y enrojecida, dolor exquisito sobre el foco, rango limitado, cojera marcada; valorar SIEMPRE la función neurovascular.", "No procede en fase aguda: derivar. Tras el alta traumatológica, el gesto que reproduce el dolor → EVA", "Tras el alta: déficit de extensión activa frente al lado sano (grados), o tiempo de apoyo monopodal"], ["Tendinopatía rotuliana", "La mayoría se diagnostica solo con la exploración. Sentadilla monopodal, mejor sobre plano inclinado: suele reproducir los síntomas. Dolor a la palpación del polo inferior de la rótula.", "Sentadilla monopodal sobre plano inclinado (o el escalón que tolere) → EVA", "Repeticiones de sentadilla monopodal, mismo plano y cadencia, hasta el umbral de dolor; o grados de flexión antes del dolor"], ["Dolor femororrotuliano", "La sentadilla es el test clínico propuesto; progresar la carga según irritabilidad: monopodal, step-down o más repeticiones. Palpación alrededor de la FR, sobre todo de las facetas.", "Sentadilla bilateral o monopodal, o bajada de escalón, hasta donde tolere → EVA", "Step-down desde escalón de altura fija: repeticiones en 30 s sin aumentar el dolor, o grados de flexión sin dolor"], ["Inestabilidad rotuliana", "Si hay traumatismo, diferenciar de la inestabilidad tibiofemoral: los test de estrés tibiofemoral deben ser normales y la movilidad rotuliana estará aumentada en al menos una dirección. Movilidad excesiva: el borde medial de la rótula llega al borde lateral del surco troclear. Test de aprensión.", "El gesto que provoca la aprensión o el fallo → EVA; si no hay dolor, episodios de fallo por semana", "Fuerza de extensión frente al lado sano, en sedestación a 60° de flexión, siempre con la misma prueba"], ["Hoffa", "Observación: suelen estar de pie en hiperextensión (genu recurvatum). Test de Hoffa: rodilla pasiva entre 30 y 60°, presión firme sobre el cuerpo graso bajo la rótula, medial o lateral al tendón, y llevar pasivamente a extensión final. Positivo si reproduce el dolor familiar. Repetir al otro lado del tendón.", "Contracción isométrica del cuádriceps en extensión completa, o el test de Hoffa → EVA", "Grados de extensión pasiva tolerados sin dolor, en supino con el talón elevado sobre una toalla"], ["Bursitis pre e infrarrotuliana", "PRIMERO diferenciar séptica de aséptica: la fiebre >37,7 °C solo se ha descrito en la séptica → urgencia. Aséptica: dolor localizado, hinchazón EN LA PROPIA BURSA (no difusa), dolor con flexión activa y pasiva, arrodillarse intolerable. Integridad articular normal.", "Apoyar la rodilla en el suelo, o la flexión activa máxima → EVA", "Grados de flexión activa hasta la aparición del dolor, en sedestación al borde de la camilla"], ["Apofisitis del adolescente", "PRIMERO la cadera. Después, palpación: tuberosidad tibial dolorosa y visiblemente aumentada (Osgood-Schlatter), o polo inferior de la rótula doloroso sin dolor a lo largo del tendón (Sinding-Larsen). Sentadillas, escaleras, step-down y saltos dolorosos. Extensión resistida dolorosa y débil.", "Bajada de escalón o sentadilla monopodal → EVA", "Fuerza de extensión resistida en sedestación a 60° frente al lado sano, o repeticiones de step-down con altura fija"], ["Lesión osteocondral", "Depende de la estabilidad. Dolor a la palpación de la articulación en la zona afectada. Marcha antiálgica con menos flexión en la respuesta de carga. Si es inestable: derrame y signos mecánicos de bloqueo con rango disminuido.", "Cuclilla o el gesto de impacto que reproduce el dolor → EVA", "Grados de flexión activa en supino hasta el dolor o el tope mecánico"]], "nota": "Las tendinopatías son más superficiales que las lesiones ligamentosas, más fáciles de palpar y se reproducen con la activación muscular. Ningún test aislado cierra el diagnóstico: lo que funciona son los conjuntos."}, "PRONOSTICO": {"titulo": "para «a las X sesiones espero Y; si no lo veo → Z»", "cabecera": ["Síndrome", "Horizonte e imagen", "Criterio de derivación o cuidado"], "filas": [["LCA", "RM o artroscopia como patrón de referencia. El tratamiento no quirúrgico obtiene buenos resultados, pero casi el 75 % opta por la reconstrucción.", "Riesgo alto de nueva lesión los dos primeros años tras la reconstrucción, y mayor en quienes vuelven al deporte con déficits."], ["LCM", "RM como patrón de referencia.", "La lesión aislada se maneja sin cirugía, con vuelta a la actividad en 2–5 semanas."], ["Menisco", "RM o artroscopia. En roturas degenerativas, la meniscectomía parcial NO ha demostrado más beneficio que la fisioterapia.", "Tras lesión meniscal, el riesgo de artrosis es 7 veces mayor. Solo el 30 % periférico está vascularizado, y disminuye con la edad. Jóvenes: mejores candidatos a reparación."], ["LCP · LLE · EPL", "RM de elección. En urgencias, el 95 % de las lesiones del LCP son combinadas.", "Las lesiones de LCP grado III se asocian a lesión de la EPL. Siempre que se sospeche LLE, explorar la EPL, y al revés."], ["LLE y EPL", "—", "NO usar el varo forzado como prueba de descarte: S 25 %, sin E publicada. Un test negativo no descarta la lesión de LLE/EPL."], ["Fracturas", "Rótula: radiografía AP y lateral; TC en conminutas. Meseta: radiografía primero, TC para clasificar, RM si se sospecha lesión meniscal o ligamentosa.", "El dolor y el derrame limitan la exploración: no forzar. Ante déficit neurovascular, urgencia."], ["Tendinopatía rotuliana", "Ecografía o RM. La alteración del tendón en imagen NO se correlaciona de forma constante con el dolor ni con la pérdida de función.", "Si los síntomas aparecen antes y tardan más en irse, ser más prudente al progresar. VISA-P como cuestionario, aparte de los tres números."], ["Dolor FR", "Diagnóstico clínico: la imagen solo sirve para descartar otras condiciones.", "Patogenia multifactorial. Se han descrito hiperalgesia generalizada y peor modulación del dolor: el modelo mecánico no lo explica todo."], ["Inestabilidad rotuliana", "La entrevista y la exploración completas bastan para el diagnóstico. La imagen sirve para identificar factores predisponentes (ángulo Q aumentado, rótula alta, tróclea displásica) o para descartar fracturas y lesiones osteocondrales; el ligamento femororrotuliano medial se ve en RM.", "La displasia troclear dificulta la contención de la rótula; laxitud ligamentosa y desequilibrio de tejidos blandos alteran la línea de tracción. Con el ligamento femororrotuliano medial dañado, la cintilla iliotibial tiende a llevar la rótula hacia lateral en la flexión."], ["Hoffa", "RM: edema, sangrado y fibrosis en el cuerpo graso en fases iniciales; en casos avanzados, metaplasia osteocondral en radiografía o TC.", "—"], ["Bursitis pre e infrarrotuliana", "El diagnóstico clínico suele bastar. Ecografía o RM si hace falta diferenciar séptica de aséptica o descartar otras condiciones: líquido aumentado y engrosamiento de la bursa; la infiltración guiada por ecografía puede ser diagnóstica y terapéutica.", "—"], ["Artrosis", "Kellgren-Lawrence u OARSI. Hasta el 43 % de los mayores de 40 no tiene síntomas. Criterios clínicos + imagen → S 0,91 · E 0,86 · LR+ 6,5 · LR− 0,10.", "Los criterios del ACR identifican mejor la artrosis avanzada: con criterios negativos en un cuadro incipiente, no descartes. La debilidad del cuádriceps es el factor modificable más potente."], ["Apofisitis", "La exploración suele bastar; radiografía si hace falta, y ayuda a descartar fractura aguda y tumor.", "El Sinding-Larsen-Johansson es generalmente autolimitado. Entrenar en otras modalidades o en piscina reduce intensidad y duración."], ["Cintilla iliotibial", "Diagnóstico clínico: la entrevista y la exploración completas suelen bastar. Las pruebas complementarias sirven para confirmar o descartar otras condiciones.", "La explicación clásica (fricción de la cintilla sobre el epicóndilo lateral) ha sido cuestionada: los estudios anatómicos apuntan a compresión contra el cuerpo graso muy inervado que hay debajo."], ["Tibioperonea proximal", "Radiografía de rodilla en AP y lateral para valorar la patología articular. TC si la radiografía no aclara el diagnóstico.", "La articulación puede ser continua con la tibiofemoral: una presión elevada afecta a las dos. Entre sus causas, además de artrosis e inestabilidad, hay otras condiciones patológicas graves."], ["Nervio peroneo", "Conducción nerviosa y EMG confirman el diagnóstico y ayudan a establecer el pronóstico. Ecografía útil por lo superficial del nervio.", "Neurapraxia: pronóstico excelente. Axonotmesis: recuperación parcial o completa. Neurotmesis: mínima. A partir de 4 semanas de compresión aparecen inflamación y cicatriz que enlentecen más la conducción."], ["Quiste poplíteo", "RM de referencia; ecografía como primera opción, sobre todo para diferenciarlo de una TVP. Se encuentra en el 38 % de las RM de rodillas sintomáticas.", "El 94 % en adultos se asocia a un trastorno intraarticular: no es un diagnóstico de exclusión. Ante duda con tromboflebitis, derivar."]], "nota": "③ lo elige el paciente: es la PSFS (anexo), 3 actividades de 0 a 10, cambio mínimo relevante en torno a 2 puntos en una actividad. Cuestionarios aparte, al inicio y al alta (anexo): KOOS-12 general · KOOS-PF en dolor FR · IKDC subjetivo en ligamento, menisco o cartílago · VISA-P en tendinopatía rotuliana. Los valores de cambio mínimo varían mucho entre estudios: orientación, no umbral de alta. Dosis y progresión no están en la guía: son tuyas.", "pie": "Guía clínica de rodilla, ap. 5, 6 y anexo A4 · filas Imagen, Cuidado y Pronóstico"}, "URGENCIA": {"titulo": "URGENCIAS · TVP · ARTRITIS SÉPTICA · APARATO EXTENSOR · BURSA CON FIEBRE · NEUROVASCULAR", "lineas": ["TVP: no identificarla puede llevar a embolia pulmonar, que ocurre en más de un tercio de los casos. Dolor intenso e inexplicado, calambre en el hueco poplíteo, calor o hinchazón. Wells está en la tabla de abajo. Derivar a quien pueda excluirla.", "ARTRITIS SÉPTICA (anexo): rodilla caliente, roja y con derrame a tensión. Dolor intenso en todo el arco, incluso en recorridos mínimos. Fiebre, malestar general, incapacidad para cargar. Factores: infiltración o cirugía articular reciente, prótesis, inmunodepresión, diabetes, AR, infección cutánea, drogas parenterales. Puede coexistir con artrosis o gota y despistar. Ningún signo aislado es bastante sensible para descartarla → URGENCIA HOSPITALARIA HOY.", "ROTURA DEL APARATO EXTENSOR (anexo): la regla de Ottawa NO lo detecta. Carga excéntrica brusca sobre la rodilla flexionada o caída, con chasquido y caída inmediata. NO puede elevar la pierna extendida ni mantener la rodilla extendida contra gravedad. Escalón palpable por encima de la rótula (cuádriceps) o por debajo (rotuliano); hemartrosis; rótula alta o baja. La elevación de la pierna extendida es prueba aparte y obligatoria en toda rodilla traumática con dolor anterior. Reparación precoz (2 primeras semanas) → mejores resultados.", "Bursitis prerrotuliana séptica: la FIEBRE >37,7 °C solo se ha descrito en la séptica. Derivación el mismo día. · Compromiso neurovascular tras traumatismo: cambios de temperatura, adormecimiento, parestesias o debilidad tras fractura de meseta o luxación → pulsos distales, cribado neurológico e índice tobillo-brazo.", "REGLA DE OTTAWA, antes de explorar cualquier rodilla con traumatismo agudo → radiografía si hay ALGUNO de los cinco, por separado: ≥55 años · dolor a la palpación de la cabeza del peroné · dolor aislado a la palpación de la rótula · no flexiona hasta 90° · no carga cuatro pasos, ni justo tras la lesión ni ahora, aunque sea cojeando. S 98–100 %, E ≈50 %: sirve para descartar, no para confirmar. Excluida si la lesión tiene más de 7 días."]}, "ORIENTATIVA": {"titulo": "Dolor persistente · medial, lateral y posterior", "bloque": "4 y 5", "cabecera": ["Síndrome", "Explorar · 10′", "① Gesto testigo", "② Medida objetiva"], "filas": [["Artrosis", "Criterios clínicos del ACR: dolor de rodilla la mayoría de los días del mes previo MÁS al menos 3 de — edad >50, rigidez <30 min, crepitación, dolor óseo a la palpación, aumento de tamaño óseo, sin calor palpable → S 0,95 · E 0,69 · LR+ 3,06 · LR− 0,07. Rango disminuido, hinchazón persistente, debilidad de cuádriceps.", "Subir o bajar un escalón, o levantarse de la silla → EVA", "Sit-to-stand de 30 s con silla, brazos y apoyo fijos; o flexión en supino con goniómetro"], ["Bursitis anserina", "Dolor reproducido con la flexión de rodilla EN CARGA y con la palpación de la pata de ganso (cara medial superior de la tibia).", "Flexión de rodilla en carga (bajar un escalón) o palpación de la pata de ganso → EVA", "Repeticiones de subida y bajada de un escalón de altura fija hasta el umbral de dolor"], ["Plica sinovial medial", "Test de provocación de la plica rotuliana medial: S 0,90 · E 0,89 · LR+ 8,18 · LR− 0,11. Es la mejor forma de diagnosticarlo en consulta.", "El test de provocación de la plica, o la flexión repetida que reproduce el chasquido → EVA", "Grados de flexión activa hasta el dolor o el enganche, en sedestación al borde de la camilla"], ["Cintilla iliotibial", "Dolor localizado a la palpación a lo largo de la cintilla, sobre todo cerca del epicóndilo lateral y sobre el tubérculo de Gerdy. Step-down lateral: dificultad o Trendelenburg.", "Step-down lateral, o la carrera o pedaleo reproducidos en consulta → EVA", "Repeticiones de step-down lateral con altura fija hasta el umbral de dolor; o minutos de carrera hasta el dolor"], ["Tibioperonea proximal", "Dolor lateral que aumenta con la presión directa sobre la cabeza del peroné o con la movilidad accesoria. Movimiento de rodilla doloroso sobre todo con los isquiotibiales en tensión, y movimiento de tobillo doloroso. Cabeza del peroné prominente; hipermovilidad o luxación franca.", "Presión directa sobre la cabeza del peroné, o el gesto en carga que reproduce el dolor → EVA", "Grados de flexión activa en prono hasta el dolor, y flexión dorsal de tobillo frente al lado sano"], ["Nervio peroneo común", "Marcha en steppage. Sensibilidad alterada en la cara lateral inferior de la pierna y el dorso del pie. Debilidad de eversión y de flexión dorsal de tobillo y dedos. Tinel o dolor a la palpación cerca de la cabeza del peroné.", "Si hay dolor, la posición o prueba que lo reproduce (cruzar las piernas, cuclillas, neurodinámica) → EVA", "Fuerza de flexión dorsal frente al lado sano, misma posición; o repeticiones de elevación del antepié en bipedestación"], ["Quiste poplíteo", "La exploración suele mostrar signos de patología meniscal o condral. Si es palpable, signo de Foucher: firme en extensión completa y blando con la rodilla flexionada. Descartada siempre la TVP.", "Extensión final de rodilla o flexión máxima → EVA", "Grados de flexión activa en prono hasta el tope o el dolor"], ["Referido de cadera o lumbar", "Cribado de cadera: rango activo y pasivo de la cadera ipsilateral; el hallazgo clave es la REPRODUCCIÓN del dolor de rodilla. Cribado lumbar: reproducción con el rango activo o la movilidad accesoria pasiva, más exploración neurológica.", "El movimiento de cadera o de columna lumbar que reproduce el dolor de rodilla → EVA", "Rotación interna de cadera en supino con cadera y rodilla a 90°, grados frente al lado sano"]], "nota": "Pseudorradiculopatía: dolor profundo, difícil de localizar, que no sigue la distribución de un nervio ni de una raíz. La imagen de la rodilla puede mostrar cambios degenerativos y dar apoyo aparente a un diagnóstico de rodilla equivocado."}, "ENLACES": {"4": {"botones": [{"pantalla": "sindrome", "fila": "LCA", "sub": "Pivote o caída de un salto + chasquido + derrame inmediato"}, {"pantalla": "sindrome", "fila": "LCM", "sub": "Valgo con el pie fijo"}, {"pantalla": "sindrome", "fila": "Menisco", "sub": "Giro con el pie apoyado + bloqueo o enganche + derrame en 6–24 h"}, {"pantalla": "sindrome", "fila": "LCP", "sub": "Golpe en tibia anterior con rodilla flexionada (salpicadero)"}, {"pantalla": "sindrome", "fila": "LLE y EPL", "sub": "Golpe anteromedial o varo cerca de la extensión"}, {"pantalla": "sindrome", "fila": "Inestabilidad rotuliana", "sub": "La rótula «se salió», aprensión al trasladarla lateralmente"}, {"pantalla": "sindrome", "fila": "Fracturas", "sub": "Golpe directo anterior, dolor con extensión resistida, escalón palpable"}]}, "6": {"botones": [{"pantalla": "orientativa", "sub": "Cadera (artrosis) o columna lumbar (radiculopatía o pseudorradiculopatía)"}]}, "7": {"botones": [{"pantalla": "sindrome", "fila": "Tendinopatía rotuliana", "sub": "Anterior: polo inferior, sentadilla monopodal"}, {"pantalla": "sindrome", "fila": "Dolor femororrotuliano", "sub": "Anterior: difuso, sentadilla"}, {"pantalla": "sindrome", "fila": "Hoffa", "sub": "Anterior: recurvatum, test de Hoffa"}, {"pantalla": "sindrome", "fila": "Bursitis pre e infrarrotuliana", "sub": "Anterior: superficial, arrodillarse"}, {"pantalla": "sindrome", "fila": "Inestabilidad rotuliana", "sub": "Anterior: fallo, aprensión"}, {"pantalla": "sindrome", "fila": "Lesión osteocondral", "sub": "Anterior: bloqueo"}, {"pantalla": "sindrome", "fila": "Apofisitis del adolescente", "sub": "Anterior, en menores: apofisitis por tracción"}, {"pantalla": "sindrome", "fila": "Menisco", "sub": "Medial o lateral"}, {"pantalla": "sindrome", "fila": "LCP", "sub": "Posterior, crónico"}, {"pantalla": "orientativa", "sub": "Artrosis, bursitis anserina, plica medial, cintilla iliotibial, tibioperonea, nervio peroneo, quiste poplíteo"}]}}, "PRONOSTICO_DE": {"LCP": "LCP · LLE · EPL", "Dolor femororrotuliano": "Dolor FR", "Apofisitis del adolescente": "Apofisitis", "Lesión osteocondral": null}, "FICHAS": {"LCA": {"pista": "Pivote o caída de un salto + chasquido + derrame inmediato (nodo 4)", "nota": true}, "LCM": {"pista": "Valgo con el pie fijo (nodo 4)", "nota": true}, "Menisco": {"pista": "Giro con bloqueo o enganche, o dolor medial/lateral persistente (nodos 4 y 7)", "nota": true}, "LCP": {"pista": "Golpe en tibia anterior con rodilla flexionada, o dolor posterior crónico (nodos 4 y 7)", "nota": true}, "LLE y EPL": {"pista": "Golpe anteromedial o varo cerca de la extensión (nodo 4)", "nota": true}, "Fracturas": {"pista": "Golpe directo anterior, dolor con extensión resistida, escalón palpable (nodo 4)", "nota": true}, "Tendinopatía rotuliana": {"pista": "Dolor anterior: polo inferior, sentadilla monopodal (nodo 7)", "nota": true}, "Dolor femororrotuliano": {"pista": "Dolor anterior difuso, sentadilla (nodo 7)", "nota": true}, "Inestabilidad rotuliana": {"pista": "La rótula «se salió», o fallo y aprensión sin traumatismo (nodos 4 y 7)", "nota": true}, "Hoffa": {"pista": "Dolor anterior: recurvatum, test de Hoffa (nodo 7)", "nota": true}, "Bursitis pre e infrarrotuliana": {"pista": "Dolor anterior superficial, arrodillarse (nodo 7)", "nota": true}, "Apofisitis del adolescente": {"pista": "Dolor anterior en menores: apofisitis por tracción (nodo 7)", "nota": true}, "Lesión osteocondral": {"pista": "Dolor anterior con bloqueo mecánico (nodo 7)", "nota": true}}, "ORIENTATIVA_GRUPOS": {"aviso": "Agrupación propia: la tarjeta las reparte por localización en el nodo 7 (medial, lateral, posterior), no en una tabla aparte.", "grupos": [{"titulo": "Medial", "filas": ["Artrosis", "Bursitis anserina", "Plica sinovial medial"]}, {"titulo": "Lateral", "filas": ["Cintilla iliotibial", "Tibioperonea proximal", "Nervio peroneo común"]}, {"titulo": "Posterior", "filas": ["Quiste poplíteo", "Referido de cadera o lumbar"]}]}, "CORTE_NOTA": "Dosis y progresión"}, "tobillo_pie": {"REGION": "tobillo_pie", "NOMBRE": "Tobillo y pie", "CARAS": ["A", "A2", "B", "C"], "TITULOS": {"caraA": "TOBILLO Y PIE · cara A   bloque 0 (con el paciente fuera) y bloques 3–4", "caraB": "TOBILLO Y PIE · cara B   tobillo agudo y dolor posterior, medial, lateral y anterior", "pieA2": "Guía clínica de tobillo y pie, ap. 4 — Ficha de primera visita, bloque 4"}, "BANDERAS": {"titulo": "Banderas rojas de la región — sobre el cribado general de la ficha", "cabecera": ["Sospecha → derivación médica", "Pistas en entrevista y exploración", "Ayuda en consulta"], "filas": [["Lisfranc", "Caída hacia delante sobre el pie en punta (fallar un escalón), pie fijo con sacudida, aplastamiento. Dolor inmediato, no carga. Casi el 20 % pasa desapercibido.", "Equimosis plantar: patognomónica (tarda 24–48 h). 1.º y 2.º MT en direcciones opuestas → dolor. Cinco P."], ["Fractura de calcáneo", "Caída desde altura sobre el talón; a menudo con alcohol, no recuerda el mecanismo. No quiere apoyar.", "Talón doloroso, hinchado, con equimosis. La radiografía es poco sensible: TC."], ["Fracturas del 5.º MT", "Inversión con flexión plantar. Jones: dolor lateral previo de bajo grado.", "Dolor en la base del 5.º MT. Jones: riesgo de pseudoartrosis sin fijación."], ["Fractura de estrés de alto riesgo o múltiple", "Insidiosa tras un cambio de carga, sin efecto de calentamiento, dolor nocturno. Más de dos en huesos distintos → densidad ósea, RED-S, endocrino, nutricional.", "Punto N doloroso > lado sano: navicular hasta que se demuestre lo contrario. Calcáneo: compresión medial y lateral a la vez."], ["Rotura del tibial posterior o del FHL", "Tendinopatía que progresa o eversión forzada (TP). Impulso o aterrizaje forzado; artritis reumatoide (FHL).", "TP: arco aplanado, «demasiados dedos», no inicia la ETM. FHL: no flexiona la interfalángica del primer dedo."], ["Osteoma osteoide y otros tumores", "Segunda década. Dolor sordo peor de noche, sin relación con la actividad; alivio en <20 min con AINE. Sin alivio → otras causas (osteosarcoma: masa blanda).", "Dolor puntual y tumefacción. ≈25 % no se ve en radiografía."], ["Artritis inflamatoria", "Rigidez matutina de más de 60 min que mejora con la actividad (reumatoide, espondiloartropatía, psoriásica, reactiva).", "Tumefacción caliente, a menudo simétrica; dactilitis y uñas en la psoriásica."], ["Malignidad o infección", "Síntomas sistémicos, pérdida de peso, sudores nocturnos; dolor nocturno que despierta.", "Cribado general de la ficha. No reproducir el dolor conocido también obliga a pensarlo."], ["Claudicación vascular o neurógena", "Dolor o calambre a una distancia o duración de esfuerzo reproducible.", "Pulsos distales y exploración neurológica."], ["SDRC", "Signos autonómicos tras una lesión: rubor, hinchazón más allá de la fase aguda, hiperestesia, hiperalgesia.", "Temperatura, color, sudoración y sensibilidad frente al lado sano."], ["Neuropatía sistémica", "Dolor neuropático simétrico (diabetes), pie caído (mononeuritis múltiple), debilidad simétrica progresiva en 2–4 semanas con arreflexia (desmielinizante aguda → mismo día).", "Reflejo aquíleo, vibración, pinchazo, temperatura."], ["TVP tras inmovilización · Wells (anexo)", "+1 cada uno: cáncer activo · parálisis, paresia o inmovilización con férula · encamamiento ≥3 días o cirugía mayor en 12 semanas · dolor en el trayecto venoso profundo · hinchazón de toda la pierna · pantorrilla >3 cm más gruesa (10 cm bajo la tuberosidad tibial) · edema con fóvea solo en esa pierna · venas colaterales no varicosas · TVP previa. −2: diagnóstico alternativo al menos tan probable.", "El capítulo no la menciona. ≥2 → probable; ≤1 → improbable. Orienta la derivación, no la sustituye."]], "nota": "Las banderas rojas se revisan en todas las visitas, no solo en la primera."}, "BISAGRA": {"pregunta": "¿Hubo traumatismo agudo, y dónde se localiza el dolor?", "ramas": "TRAUMÁTICO → Ottawa primero, después por mecanismo: inversión · rotación externa con flexión dorsal · caída sobre el pie en punta · caída sobre el talón · gesto explosivo      |      NO TRAUMÁTICO → por localización: posterior · medial · lateral · anterior · talón plantar · mediopié · antepié", "apoyo": "La localización orienta hacia hueso, articulación, tendón, nervio o músculo, pero el dolor puede venir de más de una estructura. El hallazgo clave es reproducir el dolor conocido: si no se reproduce, repensar (columna lumbar, origen proximal, malignidad).", "nota": "La guía de tobillo y pie no nombra una bisagra: son los pasos 2, 7 y 8 de su árbol — traumatismo primero, localización después — usados como tal."}, "ARBOL": {"filas": [["1", "¿Cinco P tras lesión grave del mediopié, monoartritis aguda con fiebre y malestar, o debilidad simétrica progresiva con arreflexia? → URGENCIA: derivación médica hoy.   ·   No → 2"], ["2", "¿Traumatismo agudo?   Sí → 3   ·   No → 5"], ["3", "¿Algún criterio de Ottawa de tobillo o de pie, Thompson positivo, o mecanismo de Lisfranc o de caída sobre el talón? → DERIVAR para radiografía (Ottawa) o derivación preferente (Aquiles, Lisfranc, calcáneo) antes de seguir explorando.   ·   No → 4"], ["4", "Tobillo agudo traumático, ¿qué mecanismo cuenta? Inversión del retropié o flexión plantar con aducción → ESGUINCE LATERAL (LPAA y LPC; dolor en la base del 5.º MT → Ottawa) · rotación externa del pie con flexión dorsal forzada, contacto → SINDESMOSIS · inversión en plantígrado en terreno irregular → CALCANEOCUBOIDEA · flexión dorsal e inversión con contracción forzada, chasquido medial → LUXACIÓN DEL TIBIAL POSTERIOR."], ["5", "¿Niño o adolescente con dolor bien localizado o sin mecanismo claro? Inserción del Aquiles (8–12 años) → SEVER · base del 5.º MT (8–13) → ISELIN · navicular → APOFISITIS DEL TIBIAL POSTERIOR o KÖHLER (menores de 10, cojera) · cabeza del 2.º–4.º MT (14–18) → FREIBERG · esguince que no se resuelve, bloqueo → OSTEOCONDRITIS DISECANTE · dolor nocturno con alivio rápido por AINE → OSTEOMA OSTEOIDE.   ·   No → 6"], ["6", "¿La exploración local no reproduce el dolor conocido? → COLUMNA LUMBAR u origen proximal: slump con flexión plantar e inversión. Si persiste la duda, replantear (malignidad).   ·   No → 7"], ["7", "¿Dolor sin traumatismo en el tobillo? POSTERIOR → pinzamiento posterior (flexión plantar máxima) · Aquiles porción media (pinza, 2–6 cm) · insercional (un dedo, flexión dorsal) · vaina (crepitación, rango amplio) · plantar (medial y proximal) · sural (lateral, neuropático) · bursa superficial (roce del zapato).\nMEDIAL → tibial posterior (retromaleolar, ETM sin varo del retropié) · FHL (transición de flexión dorsal a plantar) · túnel del tarso (Tinel) · fractura de estrés. LATERAL → seno del tarso · peroneos · estrés del astrágalo · referido. ANTERIOR → pinzamiento anterior (KTW).   ·   No → 8"], ["8", "¿Dolor en el pie? TALÓN PLANTAR → dolor plantar crónico (tuberosidad medial) · almohadilla grasa (posterolateral) · atrapamiento nervioso (Tinel) · estrés del calcáneo. MEDIOPIÉ → calcaneocuboidea · navicular (punto N) · Lisfranc · cuboides y cuñas · coalición. ANTEPIÉ → 1.ª MTF · base del 2.º MT · cuello de MT · 5.º MT · Morton · gota.\nNo → DOLOR VAGO DEL TOBILLO o que no se resuelve tras un esguince → inestabilidad crónica · sindesmosis · sinovitis postraumática · coalición tarsiana · artrosis · osteocondritis disecante."]]}, "SINDROMES": {"aviso": "Antes de explorar: severidad e irritabilidad. Alta — esguince agudo con derrame, sospecha de fractura de estrés, tendón muy reactivo → solo bisagra y 1–2 tests; sin saltos, sin series de ETM hasta la fatiga, sin final de rango forzado. ETM = elevación de talón monopodal (objetivo: 25 o más con buena técnica) · KTW = rodilla a la pared (deseable: 8 cm o más) · LPAA peroneoastragalino anterior · LPC peroneocalcáneo · LTPAI tibioperoneo anteroinferior. Aquiles: la palpación no ayuda al diagnóstico.", "cabecera": ["Síndrome", "Explorar · 10′", "① Gesto testigo", "② Medida objetiva"], "filas": [["Esguince lateral agudo", "Si no carga: Ottawa antes de nada. Priorizar LPAA (palpar y estirar: flexión plantar con inversión y rotación interna) y LPC (palpar y estirar: inversión del retropié con el tobillo en flexión dorsal). Reproducir el dolor conocido indica lesión de ese ligamento.", "Estiramiento pasivo del LPAA o apoyo monopodal → EVA", "Tiempo de apoyo monopodal descalzo sin dolor; cuando tolere carga, KTW en cm frente al lado sano"], ["Sindesmosis", "Palpación del LTPAI (la más sensible) + squeeze test (la más específica). Si las dos reproducen el dolor conocido, sospechar lesión. Sin cifras en el capítulo.", "Squeeze test o flexión dorsal en carga → EVA", "KTW en cm frente al lado sano, cuando tolere la carga"], ["Rotura del Aquiles", "Thompson (Simmonds): S 96 % · E 93 %. Hueco palpable, que se pierde con el tiempo.", {"span": "No procede: derivar. Tras el alta, el gesto que reproduce → EVA y ETM a tempo fijo frente al lado sano."}], ["Lisfranc", "Neurovascular y cinco P. Equimosis plantar patognomónica (falta en esguinces aislados, tarda 24–48 h). Dolor en todo el ancho del mediopié. 1.º y 2.º MT en direcciones opuestas → dolor.", {"span": "No procede en fase aguda: derivar. Tras el alta, despegue o ETM → EVA; ETM a tempo fijo."}], ["Fracturas del pie (5.º MT, calcáneo)", "Ottawa. 5.º MT: dolor en la base en todos los tipos; en la espiral, a lo largo del hueso. Calcáneo: talón doloroso, hinchado, con equimosis.", {"span": "No procede en fase aguda: derivar."}], ["Luxación del tibial posterior", "Hinchazón y equimosis perimaleolar medial. Se subluxa hacia delante con la flexión dorsal y se recoloca con la plantar.", "Flexión dorsal y plantar activa que provoca el resalte → EVA", "Sin medida propia: derivar para confirmar"], ["Pinzamiento posterior", "Dolor conocido con la flexión plantar pasiva o el test de pinzamiento posterior (flexión plantar comprimiendo el calcáneo contra la tibia): confirma. Hinchazón a ambos lados del Aquiles; dolor por detrás del astrágalo.", "Test de pinzamiento posterior o media punta en carga → EVA", "ETM a tempo fijo hasta dolor o pérdida de técnica, frente al lado sano; o KTW en cm"], ["Aquiles porción media", "Batería progresiva: ETM bipodal → monopodal → saltos bipodales → monopodales, hasta reproducir; dolor localizado (1–2 dedos). EVA en cada escalón. Vigilar la descarga: aterrizar con el talón; saltar con el talón elevado aumenta el dolor.", "Primer escalón de la batería que reproduce → EVA", "Repeticiones de ETM monopodal a tempo fijo en el suelo, hasta dolor o fatiga, frente al lado sano"], ["Aquiles insercional", "Dolor con carga y flexión dorsal, menos en flexión plantar. Menos dolor al saltar con el talón elevado, más al aterrizar con el talón abajo y la rodilla flexionada. ETM monopodal sobre plano inclinado como provocación.", "ETM monopodal desde flexión dorsal en el borde de un step → EVA", "Repeticiones de ETM monopodal a tempo fijo en suelo plano, hasta dolor o fatiga"], ["Vaina del Aquiles", "Crepitación en la flexión plantar y dorsal; dolor más difuso. Duelen las ETM (rango amplio); el salto puede doler menos.", "Flexión plantar y dorsal activas repetidas en prono sobre la camilla → EVA", "Repeticiones de ETM monopodal en todo el rango, a tempo fijo, hasta el dolor"], ["Plantar delgado", "Dolor con la ETM desde flexión dorsal completa hasta flexión plantar completa sobre un step. Dolor medial del Aquiles caminando descalzo.", "ETM monopodal sobre un step desde flexión dorsal completa → EVA", "Repeticiones de ETM monopodal a tempo fijo en suelo plano, hasta el dolor"], ["Nervio sural", "Tinel a lo largo del sural. Palpación en prono con flexión dorsal pasiva: una diferencia entre lados, con el perfil clínico, hace sospechar.", "Prueba neurodinámica con sesgo del sural → EVA", "Grados de flexión dorsal (o de la articulación de la prueba) hasta los síntomas, misma posición"], ["Bursa calcánea superficial", "Dolor superficial e hinchazón en el talón posterior que aumentan con la presión.", "Presión sobre la bursa o contrafuerte del zapato → EVA", "Sin medida de capacidad: no depende de la carga. Basta ①"], ["Tibial posterior", "Dolor por detrás y por debajo del maléolo medial. Dolor conocido y debilidad relativa en la inversión resistida. ETM: el retropié no va a varo; en fases avanzadas no inicia. «Demasiados dedos».", "ETM monopodal (inicio del despegue) o inversión resistida → EVA", "Repeticiones de ETM monopodal a tempo fijo con el retropié a varo, frente al lado sano"], ["FHL", "Flexión dorsal y plantar activas del primer dedo con el tobillo en flexión plantar completa: reproduce. Crepitación e hinchazón en la vaina, posteromedial.", "Flexoextensión activa del primer dedo con el tobillo en flexión plantar completa → EVA", "Repeticiones de ETM monopodal a tempo fijo hasta el dolor, frente al lado sano"], ["Túnel del tarso", "Tinel a lo largo del túnel. Hinchazón en el túnel o en la subastragalina posterior, proximal al sustentaculum tali. Explorar el FHL, que puede ser la fuente.", "Tinel o la posición que reproduce → EVA", "Grados de flexión dorsal con eversión hasta los síntomas, misma posición"], ["Estrés del tobillo (maléolo medial, astrágalo, calcáneo)", "Dolor óseo a la palpación; puede haber derrame. Calcáneo: compresión medial y lateral a la vez. Astrágalo: hinchazón en el seno del tarso o posterior.", "Carga monopodal o marcha → EVA. Sin saltos ni series", "Minutos de marcha en cinta sin dolor, a velocidad e inclinación fijas"], ["Seno del tarso", "Dolor conocido a la palpación del seno del tarso, a menudo también con el estrés en inversión de la subastragalina o el KTW con pronación excesiva.", "Palpación del seno del tarso o KTW con pronación → EVA", "KTW en cm frente al lado sano"], ["Peroneos", "Dolor localizado sobre los tendones por detrás del maléolo lateral. Posible subluxación por encima y por delante del maléolo. Crepitación e hinchazón si hay peritendón.", "Eversión resistida o el gesto en carga que reproduce → EVA", "Repeticiones de ETM monopodal a tempo fijo, frente al lado sano"], ["Pinzamiento anterior", "El KTW reproduce el dolor y muestra limitación. Hinchazón y palpación dolorosa y engrosada: interlínea anterior, astragaloescafoidea, seno del tarso, LTPAI, LPAA.", "Zancada o KTW en carga → EVA", "KTW en cm frente al lado sano"], ["Referido lumbar", "Elevación de la pierna recta o slump con el tobillo en flexión plantar e inversión: pueden reproducir.", "La prueba neurodinámica o el movimiento lumbar que reproduce → EVA", "Grados de elevación de la pierna recta hasta los síntomas, tobillo en la misma posición"]]}, "PRONOSTICO": {"titulo": "para «a las X sesiones espero Y; si no lo veo → Z»", "cabecera": ["Síndrome", "Horizonte e imagen", "Criterio de derivación o cuidado"], "filas": [["Esguince lateral", "Ottawa decide la radiografía. Cajón anterior con mejor S y E a los 4–6 días; sin signo del surco, el LPAA no está roto del todo.", "Una proporción alta evoluciona a inestabilidad crónica. Si no se recupera: coalición, osteocondritis disecante, sinovitis, pinzamiento posterior secundario, peroneos."], ["Sindesmosis", "Si LTPAI y squeeze son positivos, hace falta imagen: la RM tiene una precisión de hasta el 95 %.", "—"], ["Aquiles roto · Lisfranc · fracturas", "Aquiles: imagen solo para decidir quirúrgico o conservador. Lisfranc: radiografía en carga con los dos pies en la misma placa, S y E bajas → TC o RM. Calcáneo: TC. 5.º MT: radiografía.", "Fractura de Jones: riesgo de pseudoartrosis sin fijación quirúrgica."], ["Pinzamiento posterior", "Radiografía en flexión plantar en carga y RM; ningún hallazgo se correlaciona con los síntomas. La infiltración con anestésico confirma.", "Responde bien a conservador, técnica y retorno graduado. Si no responde a la infiltración o la recuperación se complica → replantear el diagnóstico."], ["Aquiles (media, insercional, vaina, plantar)", "Diagnóstico clínico: la patología en imagen es frecuente sin síntomas; neovasos y calcificación no son diagnósticos.", "VISA-A mes a mes; entre medias, dolor y rigidez matutinos y EVA en saltos. La bursa retrocalcánea no se trata aislada de la insercional. Dolor nocturno → otro diagnóstico."], ["Tibial posterior", "Ecografía (tendón frente a peritendón); RM para complicaciones. La imagen no se correlaciona necesariamente con los síntomas.", "Puede progresar a rotura y pie plano adquirido: no hace ETM + «demasiados dedos» → derivar."], ["FHL", "Ecografía dinámica de elección; sus hallazgos son frecuentes sin síntomas.", "Crónico: tenosinovitis estenosante. No flexiona la interfalángica → rotura: derivar."], ["Nervios (sural, túnel del tarso, talón)", "Túnel: la conducción no siempre es positiva (diagnóstico clínico). Talón: infiltración diagnóstica ecoguiada; conducción si se plantea cirugía.", "Túnel del tarso: tratar la causa de la hinchazón (FHL, sinovitis subastragalina, esguince)."], ["Fracturas de estrés", "Radiografía poco sensible al principio; RM de elección; TC para caracterizar.", "3–4 meses hasta el deporte tras una no complicada; complicada si no se resuelve con reposo relativo. Varias → causas sistémicas (RED-S, endocrinas, densidad ósea)."], ["Seno del tarso · sinovitis · pinzamiento anterior", "La infiltración con anestésico local en la zona confirma si alivia el dolor conocido. Pinzamiento anterior: radiografía para osteofitos; TC si se sospecha navicular u osteocondral.", "La sinovitis postraumática suele resolverse con reposo relativo y rehabilitación. En el pinzamiento anterior, las partes blandas duelen más a menudo que los osteofitos."], ["Peroneos", "Diagnóstico sobre todo clínico; RM o ecografía si hace falta.", "Tras esguince grave o fractura, una rotura aguda puede pasar desapercibida porque la función se conserva: con sospecha alta, imagen."], ["Inestabilidad crónica", "CAIT menos de 24, o IdFAI más de 11: indican inestabilidad crónica (cuestionarios aparte de los tres números).", "Valorar deficiencias mecánicas y sensoriomotoras: guían el tratamiento."], ["Coalición · osteocondritis disecante", "Coalición: radiografía oblicua a 45°; la TC es poco sensible a las no óseas. Osteocondritis: hasta un tercio de las radiografías son normales al principio → RM.", "La coalición suele ser asintomática hasta una lesión (12,7 % en disección, relevancia incierta)."], ["Artrosis", "Diagnóstico clínico: más de 45 años, dolor con el uso, rigidez de menos de 30 min. La radiografía no se correlaciona de forma fiable.", "En jóvenes o con rasgos inflamatorios, progresión rápida o síntomas constitucionales → más pruebas; VSG y PCR deben ser normales."], ["Talón plantar", "Imagen innecesaria si la clínica encaja; ecografía para la fasciopatía. El espolón no se relaciona con el dolor.", "Atrapamiento nervioso coexistente en el 20–52 %: valorar el componente neural si no mejora."], ["Calcaneocuboidea · 1.ª MTF · Morton", "Calcaneocuboidea: diagnóstico clínico, la imagen ayuda poco. 1.ª MTF: radiografía si fractura o artrosis; sesamoideos bipartitos frecuentes. Morton: ecografía.", "1.ª MTF caliente e hinchada sin cambio de carga → gota o artritis inflamatoria."], ["Pediátricos", "Apofisitis: imagen rara vez necesaria. Köhler y Freiberg: radiografía característica (mirar el otro pie en Köhler).", "Las apofisitis suelen resolverse en 6–12 meses, a veces hasta 2 años. Osteoma osteoide sin alivio por AINE → otras causas."]], "nota": "③ lo elige el paciente: es la PSFS (anexo), 3 actividades de 0 a 10, cambio mínimo relevante en torno a 2 puntos. Cuestionarios aparte, al inicio y al alta: VISA-A en el Aquiles (capítulo); FAAM o LEFS como generales (anexo, orientativos). Dosis y progresión no están en la guía: son tuyas.", "pie": "Guía clínica de tobillo y pie, ap. 5, 6 y anexo A2 · filas Imagen, Cuidado y Pronóstico"}, "URGENCIA": {"titulo": "URGENCIAS · COMPARTIMENTAL Y NEUROVASCULAR · ARTRITIS INFECCIOSA · ROTURA DEL AQUILES · OTTAWA", "lineas": ["SÍNDROME COMPARTIMENTAL Y COMPROMISO NEUROVASCULAR tras lesión grave del mediopié (Lisfranc): el flujo puede caer tras luxarse el 2.º MT → cirugía urgente. Cinco P: palidez · dolor desproporcionado · parestesias · sin pulso · frialdad.", "ARTRITIS INFECCIOSA: monoartritis aguda con MALESTAR SISTÉMICO Y FIEBRE ALTA → URGENCIA HOY. En la gota, en cambio, está sistémicamente bien.", "ROTURA AGUDA DEL AQUILES: golpe o patada detrás de la pierna en un gesto explosivo, a veces chasquido; camina sorprendentemente bien, con cojera. Thompson: prono, pie fuera de la camilla; al comprimir la pantorrilla el tobillo no se mueve → S 96 % · E 93 % → derivación preferente.", "REGLAS DE OTTAWA, antes de explorar cualquier traumatismo agudo. TOBILLO → radiografía si dolor en la zona maleolar Y alguno: dolor óseo en los 6 cm distales del borde posterior de la tibia o punta del maléolo medial · ídem del peroné o punta del maléolo lateral · no carga cuatro pasos, ni justo tras la lesión ni en consulta. PIE → radiografía si dolor en el mediopié Y alguno: dolor óseo en la base del 5.º MT · en el navicular · no carga cuatro pasos. Muy sensible, moderadamente específica (sin cifras en el capítulo). Excluidas embarazadas y personas que no pueden seguir la prueba (p. ej., traumatismo craneal). ≈10 % de las inversiones acaban en fractura."]}, "ORIENTATIVA": {"titulo": "Dolor vago del tobillo, talón plantar, mediopié y antepié", "bloque": "4 y 5", "cabecera": ["Síndrome", "Explorar · 10′", "① Gesto testigo", "② Medida objetiva"], "filas": [["Inestabilidad crónica", "Hinchazón articular. Laxitud tibioastragalina (signo del surco en el cajón anterior → rotura completa del LPAA probable) y subastragalina (inversión excesiva del retropié frente al lado sano).", "El gesto que provoca aprensión o fallo → EVA; si no hay dolor, fallos por semana", "Tiempo de apoyo monopodal descalzo, ojos abiertos, sin manos, frente al lado sano"], ["Sinovitis postraumática", "Hinchazón y dolor a la palpación. Puede haber laxitud del LPAA y del LPC.", "El gesto en carga que reproduce (zancada, apoyo monopodal) → EVA", "KTW en cm frente al lado sano"], ["Coalición tarsiana", "Restricción de la movilidad subastragalina, a menudo también mediotarsiana.", "Inversión y eversión del retropié, o el gesto en carga que reproduce → EVA", "Grados de inversión y eversión del retropié frente al lado sano, misma posición"], ["Artrosis", "Dolor a la palpación de la interlínea; según la evolución, rango limitado, derrame, deformidad, debilidad; tumefacción ósea periarticular.", "Bajar un escalón o zancada → EVA", "KTW en cm, o grados de flexión dorsal de la 1.ª MTF si es la afectada"], ["Osteocondritis disecante del astrágalo", "Dolor a la palpación de la cara anterior de la cúpula astragalina con el pie en flexión plantar completa. Hinchazón, derrame, crepitación.", "El gesto de impacto o carga que reproduce → EVA", "KTW en cm frente al lado sano"], ["Dolor plantar crónico del talón", "Dolor conocido a la palpación de la inserción de la fascia en la tuberosidad medial del calcáneo.", "Primeros pasos tras estar sentado, o palpación de la tuberosidad → EVA", "Minutos de marcha en cinta sin aumento del dolor, velocidad fija; o ETM a tempo fijo"], ["Almohadilla grasa", "Dolor a la palpación de la región posterolateral del talón.", "Apoyo del talón en la marcha o palpación posterolateral → EVA", "Minutos de marcha en cinta sin dolor, velocidad fija"], ["Atrapamiento nervioso del talón", "Tinel justo proximal al origen de la fascia en la tuberosidad medial, o a lo largo del calcáneo medial.", "Tinel o la carga que reproduce → EVA", "Minutos de marcha en cinta hasta los síntomas, velocidad fija"], ["Calcaneocuboidea y cubometatarsiana", "Aguda: dolor en calcaneocuboidea dorsal, ligamento bifurcado, apófisis anterior del calcáneo o ligamentos cubometatarsianos. Gradual: dolor en las interlíneas del cuboides hacia las bases del 4.º–5.º MT. Caminar, cargar el antepié y el inicio de la ETM dan dolor agudo.", "Inicio de la ETM, o presión plantar sobre el cuboides → EVA", "Repeticiones de ETM monopodal a tempo fijo hasta el dolor, frente al lado sano"], ["Estrés del mediopié (navicular, cuboides, cuñas)", "Punto N doloroso frente al lado sano: navicular hasta que se demuestre lo contrario. Dolor puntual sobre cuboides o cuñas.", "Marcha o carga monopodal → EVA. Sin saltos", "Minutos de marcha en cinta sin dolor, velocidad e inclinación fijas"], ["1.ª MTF", "Dirigida por la historia. Equimosis tras esguince o fractura; hinchazón en la interlínea. Rango frente al lado sano (flexión dorsal normal ≈60°; danza y gimnasia hasta 90°). Dolor sobre los sesamoideos.", "Flexión dorsal de la 1.ª MTF en carga (media punta, despegue) → EVA", "Grados de flexión dorsal pasiva de la 1.ª MTF con goniómetro, primer radio estabilizado, frente al lado sano"], ["Base del 2.º MT", "Dolor a la palpación de la base del 2.º MT y de la articulación de Lisfranc. Mediotarsiana posiblemente rígida.", "Media punta, o palpación de la base del 2.º MT → EVA", "Repeticiones de ETM monopodal a tempo fijo hasta el dolor"], ["Cuello de MT (fractura de marcha)", "Dolor puntual sobre el cuello. La carga axial del MT provoca dolor en la lesión ósea, menos en la de partes blandas.", "Marcha o carga del antepié → EVA", "Minutos de marcha en cinta sin dolor, velocidad fija"], ["Morton o bursitis intermetatarsiana", "Dolor a la palpación directa del espacio (sobre todo 3.º–4.º); posible chasquido al palpar mientras se comprimen los metatarsianos.", "Palpación del espacio con compresión transversal → EVA", "Minutos de marcha en cinta hasta los síntomas, mismo calzado y velocidad"], ["Gota", "Articulación roja, hinchada, muy dolorosa al tacto y al movimiento; puede parecer una dactilitis. Sistémicamente bien; tofos en la gota de larga evolución.", {"span": "No procede en la crisis: derivar para confirmar. Con fiebre y malestar → artritis infecciosa: urgencia."}]], "nota": "Estrés o fractura de estrés de la base del 2.º MT: dolor nocturno, sin efecto de calentamiento. Sinovitis: sin dolor nocturno, con efecto de calentamiento. Morton frente a metatarsalgia (callosidad, colapso del arco), Freiberg (14–18 años, cabeza del MT) y estrés de MT (dolor más dorsal)."}, "ENLACES": {"1": {"botones": [{"pantalla": "banderas"}]}, "3": {"botones": [{"pantalla": "banderas", "sub": "Reglas de Ottawa completas"}, {"pantalla": "sindrome", "fila": "Rotura del Aquiles", "sub": "Thompson positivo"}, {"pantalla": "sindrome", "fila": "Lisfranc", "sub": "Mecanismo o equimosis plantar de Lisfranc"}, {"pantalla": "sindrome", "fila": "Fracturas del pie (5.º MT, calcáneo)", "sub": "Ottawa positivo, o caída sobre el talón"}]}, "4": {"botones": [{"pantalla": "sindrome", "fila": "Esguince lateral agudo", "sub": "Inversión del retropié o flexión plantar con aducción"}, {"pantalla": "sindrome", "fila": "Sindesmosis", "sub": "Rotación externa del pie con flexión dorsal forzada, contacto"}, {"pantalla": "orientativa", "sub": "Inversión en plantígrado en terreno irregular (calcaneocuboidea)"}, {"pantalla": "sindrome", "fila": "Luxación del tibial posterior", "sub": "Flexión dorsal e inversión con contracción forzada, chasquido medial"}]}, "5": {"botones": [{"pantalla": "orientativa", "sub": "Esguince que no se resuelve, con bloqueo (osteocondritis disecante)"}, {"pantalla": "banderas", "sub": "Dolor nocturno con alivio rápido por AINE (osteoma osteoide)"}]}, "6": {"botones": [{"pantalla": "sindrome", "fila": "Referido lumbar", "sub": "La exploración local no reproduce el dolor conocido"}]}, "7": {"botones": [{"pantalla": "sindrome", "fila": "Pinzamiento posterior", "sub": "Posterior: flexión plantar máxima"}, {"pantalla": "sindrome", "fila": "Aquiles porción media", "sub": "Posterior: porción media del Aquiles, 2–6 cm"}, {"pantalla": "sindrome", "fila": "Aquiles insercional", "sub": "Posterior: inserción, un dedo, flexión dorsal"}, {"pantalla": "sindrome", "fila": "Vaina del Aquiles", "sub": "Posterior: crepitación, rango amplio"}, {"pantalla": "sindrome", "fila": "Plantar delgado", "sub": "Posterior: medial y proximal"}, {"pantalla": "sindrome", "fila": "Nervio sural", "sub": "Posterior: lateral, neuropático"}, {"pantalla": "sindrome", "fila": "Bursa calcánea superficial", "sub": "Posterior: roce del zapato"}, {"pantalla": "sindrome", "fila": "Tibial posterior", "sub": "Medial: retromaleolar, sin varo del retropié"}, {"pantalla": "sindrome", "fila": "FHL", "sub": "Medial: transición de flexión dorsal a plantar"}, {"pantalla": "sindrome", "fila": "Túnel del tarso", "sub": "Medial: Tinel"}, {"pantalla": "sindrome", "fila": "Estrés del tobillo (maléolo medial, astrágalo, calcáneo)", "sub": "Medial o lateral: fractura de estrés"}, {"pantalla": "sindrome", "fila": "Seno del tarso", "sub": "Lateral"}, {"pantalla": "sindrome", "fila": "Peroneos", "sub": "Lateral"}, {"pantalla": "sindrome", "fila": "Pinzamiento anterior", "sub": "Anterior: KTW"}]}, "8": {"botones": [{"pantalla": "orientativa", "sub": "Talón plantar"}, {"pantalla": "sindrome", "fila": "Estrés del tobillo (maléolo medial, astrágalo, calcáneo)", "sub": "Talón plantar: estrés del calcáneo"}, {"pantalla": "orientativa", "sub": "Mediopié"}, {"pantalla": "sindrome", "fila": "Lisfranc", "sub": "Mediopié: mecanismo de Lisfranc"}, {"pantalla": "orientativa", "sub": "Antepié"}, {"pantalla": "sindrome", "fila": "Fracturas del pie (5.º MT, calcáneo)", "sub": "Antepié: base del 5.º MT"}, {"pantalla": "orientativa", "sub": "Dolor vago del tobillo, si no encaja ninguna localización"}, {"pantalla": "sindrome", "fila": "Sindesmosis", "sub": "Dolor vago que no se resuelve tras un esguince"}]}}, "PRONOSTICO_DE": {"Esguince lateral agudo": "Esguince lateral", "Rotura del Aquiles": "Aquiles roto · Lisfranc · fracturas", "Lisfranc": "Aquiles roto · Lisfranc · fracturas", "Fracturas del pie (5.º MT, calcáneo)": "Aquiles roto · Lisfranc · fracturas", "Luxación del tibial posterior": null, "Aquiles porción media": "Aquiles (media, insercional, vaina, plantar)", "Aquiles insercional": "Aquiles (media, insercional, vaina, plantar)", "Vaina del Aquiles": "Aquiles (media, insercional, vaina, plantar)", "Plantar delgado": "Aquiles (media, insercional, vaina, plantar)", "Nervio sural": "Nervios (sural, túnel del tarso, talón)", "Bursa calcánea superficial": null, "Túnel del tarso": "Nervios (sural, túnel del tarso, talón)", "Estrés del tobillo (maléolo medial, astrágalo, calcáneo)": "Fracturas de estrés", "Seno del tarso": "Seno del tarso · sinovitis · pinzamiento anterior", "Pinzamiento anterior": "Seno del tarso · sinovitis · pinzamiento anterior", "Referido lumbar": null}, "FICHAS": {"Esguince lateral agudo": {"pista": "Inversión del retropié o flexión plantar con aducción (nodo 4)"}, "Sindesmosis": {"pista": "Rotación externa del pie con flexión dorsal forzada, contacto (nodo 4)"}, "Rotura del Aquiles": {"pista": "Thompson positivo (nodo 3)"}, "Lisfranc": {"pista": "Mecanismo o equimosis plantar de Lisfranc (nodos 3 y 8)"}, "Fracturas del pie (5.º MT, calcáneo)": {"pista": "Ottawa positivo o caída sobre el talón (nodos 3 y 8)"}, "Luxación del tibial posterior": {"pista": "Flexión dorsal e inversión con contracción forzada, chasquido medial (nodo 4)"}, "Pinzamiento posterior": {"pista": "Dolor posterior con la flexión plantar (nodo 7)"}, "Aquiles porción media": {"pista": "Dolor posterior en la porción media del Aquiles (nodo 7)"}, "Aquiles insercional": {"pista": "Dolor posterior en la inserción del Aquiles (nodo 7)"}, "Vaina del Aquiles": {"pista": "Dolor posterior con crepitación en la vaina del Aquiles (nodo 7)"}, "Plantar delgado": {"pista": "Dolor posterior en el plantar delgado (nodo 7)"}, "Nervio sural": {"pista": "Dolor posterior
