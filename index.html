e la camilla"], ["LLE y EPL", "Hinchazón y equimosis laterales en fase aguda; palpación dolorosa del ligamento. Varo forzado a unos 30° de flexión: laxitud y pérdida del tope firme; repetir a 0° para valorar el LCA. Marcha con empuje en varo.", "Varo forzado a 30° o el gesto en carga que provoca el fallo → EVA", "Tiempo de apoyo monopodal tolerado sin dolor ni fallo, descalzo y sin apoyo de manos"], ["Fracturas", "Regla de Ottawa antes de nada. Rótula: dolor localizado, posible escalón, dolor con extensión resistida, marcha con rodilla rígida. Meseta: hinchada y enrojecida, dolor exquisito sobre el foco, rango limitado, cojera marcada; valorar SIEMPRE la función neurovascular.", "No procede en fase aguda: derivar. Tras el alta traumatológica, el gesto que reproduce el dolor → EVA", "Tras el alta: déficit de extensión activa frente al lado sano (grados), o tiempo de apoyo monopodal"], ["Tendinopatía rotuliana", "La mayoría se diagnostica solo con la exploración. Sentadilla monopodal, mejor sobre plano inclinado: suele reproducir los síntomas. Dolor a la palpación del polo inferior de la rótula.", "Sentadilla monopodal sobre plano inclinado (o el escalón que tolere) → EVA", "Repeticiones de sentadilla monopodal, mismo plano y cadencia, hasta el umbral de dolor; o grados de flexión antes del dolor"], ["Dolor femororrotuliano", "La sentadilla es el test clínico propuesto; progresar la carga según irritabilidad: monopodal, step-down o más repeticiones. Palpación alrededor de la FR, sobre todo de las facetas.", "Sentadilla bilateral o monopodal, o bajada de escalón, hasta donde tolere → EVA", "Step-down desde escalón de altura fija: repeticiones en 30 s sin aumentar el dolor, o grados de flexión sin dolor"], ["Inestabilidad rotuliana", "Si hay traumatismo, diferenciar de la inestabilidad tibiofemoral: los test de estrés tibiofemoral deben ser normales y la movilidad rotuliana estará aumentada en al menos una dirección. Movilidad excesiva: el borde medial de la rótula llega al borde lateral del surco troclear. Test de aprensión.", "El gesto que provoca la aprensión o el fallo → EVA; si no hay dolor, episodios de fallo por semana", "Fuerza de extensión frente al lado sano, en sedestación a 60° de flexión, siempre con la misma prueba"], ["Hoffa", "Observación: suelen estar de pie en hiperextensión (genu recurvatum). Test de Hoffa: rodilla pasiva entre 30 y 60°, presión firme sobre el cuerpo graso bajo la rótula, medial o lateral al tendón, y llevar pasivamente a extensión final. Positivo si reproduce el dolor familiar. Repetir al otro lado del tendón.", "Contracción isométrica del cuádriceps en extensión completa, o el test de Hoffa → EVA", "Grados de extensión pasiva tolerados sin dolor, en supino con el talón elevado sobre una toalla"], ["Bursitis pre e infrarrotuliana", "PRIMERO diferenciar séptica de aséptica: la fiebre >37,7 °C solo se ha descrito en la séptica → urgencia. Aséptica: dolor localizado, hinchazón EN LA PROPIA BURSA (no difusa), dolor con flexión activa y pasiva, arrodillarse intolerable. Integridad articular normal.", "Apoyar la rodilla en el suelo, o la flexión activa máxima → EVA", "Grados de flexión activa hasta la aparición del dolor, en sedestación al borde de la camilla"], ["Apofisitis del adolescente", "PRIMERO la cadera. Después, palpación: tuberosidad tibial dolorosa y visiblemente aumentada (Osgood-Schlatter), o polo inferior de la rótula doloroso sin dolor a lo largo del tendón (Sinding-Larsen). Sentadillas, escaleras, step-down y saltos dolorosos. Extensión resistida dolorosa y débil.", "Bajada de escalón o sentadilla monopodal → EVA", "Fuerza de extensión resistida en sedestación a 60° frente al lado sano, o repeticiones de step-down con altura fija"], ["Lesión osteocondral", "Depende de la estabilidad. Dolor a la palpación de la articulación en la zona afectada. Marcha antiálgica con menos flexión en la respuesta de carga. Si es inestable: derrame y signos mecánicos de bloqueo con rango disminuido.", "Cuclilla o el gesto de impacto que reproduce el dolor → EVA", "Grados de flexión activa en supino hasta el dolor o el tope mecánico"]], "nota": "Las tendinopatías son más superficiales que las lesiones ligamentosas, más fáciles de palpar y se reproducen con la activación muscular. Ningún test aislado cierra el diagnóstico: lo que funciona son los conjuntos."}, "PRONOSTICO": {"titulo": "para «a las X sesiones espero Y; si no lo veo → Z»", "cabecera": ["Síndrome", "Horizonte e imagen", "Criterio de derivación o cuidado"], "filas": [["LCA", "RM o artroscopia como patrón de referencia. El tratamiento no quirúrgico obtiene buenos resultados, pero casi el 75 % opta por la reconstrucción.", "Riesgo alto de nueva lesión los dos primeros años tras la reconstrucción, y mayor en quienes vuelven al deporte con déficits."], ["LCM", "RM como patrón de referencia.", "La lesión aislada se maneja sin cirugía, con vuelta a la actividad en 2–5 semanas."], ["Menisco", "RM o artroscopia. En roturas degenerativas, la meniscectomía parcial NO ha demostrado más beneficio que la fisioterapia.", "Tras lesión meniscal, el riesgo de artrosis es 7 veces mayor. Solo el 30 % periférico está vascularizado, y disminuye con la edad. Jóvenes: mejores candidatos a reparación."], ["LCP · LLE · EPL", "RM de elección. En urgencias, el 95 % de las lesiones del LCP son combinadas.", "Las lesiones de LCP grado III se asocian a lesión de la EPL. Siempre que se sospeche LLE, explorar la EPL, y al revés."], ["LLE y EPL", "—", "NO usar el varo forzado como prueba de descarte: S 25 %, sin E publicada. Un test negativo no descarta la lesión de LLE/EPL."], ["Fracturas", "Rótula: radiografía AP y lateral; TC en conminutas. Meseta: radiografía primero, TC para clasificar, RM si se sospecha lesión meniscal o ligamentosa.", "El dolor y el derrame limitan la exploración: no forzar. Ante déficit neurovascular, urgencia."], ["Tendinopatía rotuliana", "Ecografía o RM. La alteración del tendón en imagen NO se correlaciona de forma constante con el dolor ni con la pérdida de función.", "Si los síntomas aparecen antes y tardan más en irse, ser más prudente al progresar. VISA-P como cuestionario, aparte de los tres números."], ["Dolor FR", "Diagnóstico clínico: la imagen solo sirve para descartar otras condiciones.", "Patogenia multifactorial. Se han descrito hiperalgesia generalizada y peor modulación del dolor: el modelo mecánico no lo explica todo."], ["Inestabilidad rotuliana", "La entrevista y la exploración completas bastan para el diagnóstico. La imagen sirve para identificar factores predisponentes (ángulo Q aumentado, rótula alta, tróclea displásica) o para descartar fracturas y lesiones osteocondrales; el ligamento femororrotuliano medial se ve en RM.", "La displasia troclear dificulta la contención de la rótula; laxitud ligamentosa y desequilibrio de tejidos blandos alteran la línea de tracción. Con el ligamento femororrotuliano medial dañado, la cintilla iliotibial tiende a llevar la rótula hacia lateral en la flexión."], ["Hoffa", "RM: edema, sangrado y fibrosis en el cuerpo graso en fases iniciales; en casos avanzados, metaplasia osteocondral en radiografía o TC.", "—"], ["Bursitis pre e infrarrotuliana", "El diagnóstico clínico suele bastar. Ecografía o RM si hace falta diferenciar séptica de aséptica o descartar otras condiciones: líquido aumentado y engrosamiento de la bursa; la infiltración guiada por ecografía puede ser diagnóstica y terapéutica.", "—"], ["Artrosis", "Kellgren-Lawrence u OARSI. Hasta el 43 % de los mayores de 40 no tiene síntomas. Criterios clínicos + imagen → S 0,91 · E 0,86 · LR+ 6,5 · LR− 0,10.", "Los criterios del ACR identifican mejor la artrosis avanzada: con criterios negativos en un cuadro incipiente, no descartes. La debilidad del cuádriceps es el factor modificable más potente."], ["Apofisitis", "La exploración suele bastar; radiografía si hace falta, y ayuda a descartar fractura aguda y tumor.", "El Sinding-Larsen-Johansson es generalmente autolimitado. Entrenar en otras modalidades o en piscina reduce intensidad y duración."], ["Cintilla iliotibial", "Diagnóstico clínico: la entrevista y la exploración completas suelen bastar. Las pruebas complementarias sirven para confirmar o descartar otras condiciones.", "La explicación clásica (fricción de la cintilla sobre el epicóndilo lateral) ha sido cuestionada: los estudios anatómicos apuntan a compresión contra el cuerpo graso muy inervado que hay debajo."], ["Tibioperonea proximal", "Radiografía de rodilla en AP y lateral para valorar la patología articular. TC si la radiografía no aclara el diagnóstico.", "La articulación puede ser continua con la tibiofemoral: una presión elevada afecta a las dos. Entre sus causas, además de artrosis e inestabilidad, hay otras condiciones patológicas graves."], ["Nervio peroneo", "Conducción nerviosa y EMG confirman el diagnóstico y ayudan a establecer el pronóstico. Ecografía útil por lo superficial del nervio.", "Neurapraxia: pronóstico excelente. Axonotmesis: recuperación parcial o completa. Neurotmesis: mínima. A partir de 4 semanas de compresión aparecen inflamación y cicatriz que enlentecen más la conducción."], ["Quiste poplíteo", "RM de referencia; ecografía como primera opción, sobre todo para diferenciarlo de una TVP. Se encuentra en el 38 % de las RM de rodillas sintomáticas.", "El 94 % en adultos se asocia a un trastorno intraarticular: no es un diagnóstico de exclusión. Ante duda con tromboflebitis, derivar."]], "nota": "③ lo elige el paciente: es la PSFS (anexo), 3 actividades de 0 a 10, cambio mínimo relevante en torno a 2 puntos en una actividad. Cuestionarios aparte, al inicio y al alta (anexo): KOOS-12 general · KOOS-PF en dolor FR · IKDC subjetivo en ligamento, menisco o cartílago · VISA-P en tendinopatía rotuliana. Los valores de cambio mínimo varían mucho entre estudios: orientación, no umbral de alta. Dosis y progresión no están en la guía: son tuyas.", "pie": "Guía clínica de rodilla, ap. 5, 6 y anexo A4 · filas Imagen, Cuidado y Pronóstico"}, "URGENCIA": {"titulo": "URGENCIAS · TVP · ARTRITIS SÉPTICA · APARATO EXTENSOR · BURSA CON FIEBRE · NEUROVASCULAR", "lineas": ["TVP: no identificarla puede llevar a embolia pulmonar, que ocurre en más de un tercio de los casos. Dolor intenso e inexplicado, calambre en el hueco poplíteo, calor o hinchazón. Wells está en la tabla de abajo. Derivar a quien pueda excluirla.", "ARTRITIS SÉPTICA (anexo): rodilla caliente, roja y con derrame a tensión. Dolor intenso en todo el arco, incluso en recorridos mínimos. Fiebre, malestar general, incapacidad para cargar. Factores: infiltración o cirugía articular reciente, prótesis, inmunodepresión, diabetes, AR, infección cutánea, drogas parenterales. Puede coexistir con artrosis o gota y despistar. Ningún signo aislado es bastante sensible para descartarla → URGENCIA HOSPITALARIA HOY.", "ROTURA DEL APARATO EXTENSOR (anexo): la regla de Ottawa NO lo detecta. Carga excéntrica brusca sobre la rodilla flexionada o caída, con chasquido y caída inmediata. NO puede elevar la pierna extendida ni mantener la rodilla extendida contra gravedad. Escalón palpable por encima de la rótula (cuádriceps) o por debajo (rotuliano); hemartrosis; rótula alta o baja. La elevación de la pierna extendida es prueba aparte y obligatoria en toda rodilla traumática con dolor anterior. Reparación precoz (2 primeras semanas) → mejores resultados.", "Bursitis prerrotuliana séptica: la FIEBRE >37,7 °C solo se ha descrito en la séptica. Derivación el mismo día. · Compromiso neurovascular tras traumatismo: cambios de temperatura, adormecimiento, parestesias o debilidad tras fractura de meseta o luxación → pulsos distales, cribado neurológico e índice tobillo-brazo.", "REGLA DE OTTAWA, antes de explorar cualquier rodilla con traumatismo agudo → radiografía si hay ALGUNO de los cinco, por separado: ≥55 años · dolor a la palpación de la cabeza del peroné · dolor aislado a la palpación de la rótula · no flexiona hasta 90° · no carga cuatro pasos, ni justo tras la lesión ni ahora, aunque sea cojeando. S 98–100 %, E ≈50 %: sirve para descartar, no para confirmar. Excluida si la lesión tiene más de 7 días."]}, "ORIENTATIVA": {"titulo": "Dolor persistente · medial, lateral y posterior", "bloque": "4 y 5", "cabecera": ["Síndrome", "Explorar · 10′", "① Gesto testigo", "② Medida objetiva"], "filas": [["Artrosis", "Criterios clínicos del ACR: dolor de rodilla la mayoría de los días del mes previo MÁS al menos 3 de — edad >50, rigidez <30 min, crepitación, dolor óseo a la palpación, aumento de tamaño óseo, sin calor palpable → S 0,95 · E 0,69 · LR+ 3,06 · LR− 0,07. Rango disminuido, hinchazón persistente, debilidad de cuádriceps.", "Subir o bajar un escalón, o levantarse de la silla → EVA", "Sit-to-stand de 30 s con silla, brazos y apoyo fijos; o flexión en supino con goniómetro"], ["Bursitis anserina", "Dolor reproducido con la flexión de rodilla EN CARGA y con la palpación de la pata de ganso (cara medial superior de la tibia).", "Flexión de rodilla en carga (bajar un escalón) o palpación de la pata de ganso → EVA", "Repeticiones de subida y bajada de un escalón de altura fija hasta el umbral de dolor"], ["Plica sinovial medial", "Test de provocación de la plica rotuliana medial: S 0,90 · E 0,89 · LR+ 8,18 · LR− 0,11. Es la mejor forma de diagnosticarlo en consulta.", "El test de provocación de la plica, o la flexión repetida que reproduce el chasquido → EVA", "Grados de flexión activa hasta el dolor o el enganche, en sedestación al borde de la camilla"], ["Cintilla iliotibial", "Dolor localizado a la palpación a lo largo de la cintilla, sobre todo cerca del epicóndilo lateral y sobre el tubérculo de Gerdy. Step-down lateral: dificultad o Trendelenburg.", "Step-down lateral, o la carrera o pedaleo reproducidos en consulta → EVA", "Repeticiones de step-down lateral con altura fija hasta el umbral de dolor; o minutos de carrera hasta el dolor"], ["Tibioperonea proximal", "Dolor lateral que aumenta con la presión directa sobre la cabeza del peroné o con la movilidad accesoria. Movimiento de rodilla doloroso sobre todo con los isquiotibiales en tensión, y movimiento de tobillo doloroso. Cabeza del peroné prominente; hipermovilidad o luxación franca.", "Presión directa sobre la cabeza del peroné, o el gesto en carga que reproduce el dolor → EVA", "Grados de flexión activa en prono hasta el dolor, y flexión dorsal de tobillo frente al lado sano"], ["Nervio peroneo común", "Marcha en steppage. Sensibilidad alterada en la cara lateral inferior de la pierna y el dorso del pie. Debilidad de eversión y de flexión dorsal de tobillo y dedos. Tinel o dolor a la palpación cerca de la cabeza del peroné.", "Si hay dolor, la posición o prueba que lo reproduce (cruzar las piernas, cuclillas, neurodinámica) → EVA", "Fuerza de flexión dorsal frente al lado sano, misma posición; o repeticiones de elevación del antepié en bipedestación"], ["Quiste poplíteo", "La exploración suele mostrar signos de patología meniscal o condral. Si es palpable, signo de Foucher: firme en extensión completa y blando con la rodilla flexionada. Descartada siempre la TVP.", "Extensión final de rodilla o flexión máxima → EVA", "Grados de flexión activa en prono hasta el tope o el dolor"], ["Referido de cadera o lumbar", "Cribado de cadera: rango activo y pasivo de la cadera ipsilateral; el hallazgo clave es la REPRODUCCIÓN del dolor de rodilla. Cribado lumbar: reproducción con el rango activo o la movilidad accesoria pasiva, más exploración neurológica.", "El movimiento de cadera o de columna lumbar que reproduce el dolor de rodilla → EVA", "Rotación interna de cadera en supino con cadera y rodilla a 90°, grados frente al lado sano"]], "nota": "Pseudorradiculopatía: dolor profundo, difícil de localizar, que no sigue la distribución de un nervio ni de una raíz. La imagen de la rodilla puede mostrar cambios degenerativos y dar apoyo aparente a un diagnóstico de rodilla equivocado."}, "ENLACES": {" esión"}}};

// ════════════════════════════════════════════════════════════════
//  Datos: una sola URL para todas las regiones (tarea 3).
//    DATA.APP       nombre de la app (app.json); título de pestaña y cabecera del inicio
//    DATA.REGIONES  [{region, nombre, disponible}]  para el selector del inicio
//    DATA.DATOS     {<región>: datos de esa región}  solo las que ya están migradas
//  Los datos de cada región son la tarjeta (tarjeta_<región>.js) más los campos
//  propios de la SPA (spa_<región>.js), fundidos por datos.js:
//    REGION NOMBRE · TITULOS BANDERAS BISAGRA ARBOL SINDROMES
//    ORIENTATIVA? PRONOSTICO · ENLACES? PRONOSTICO_DE? FICHAS? ORIENTATIVA_GRUPOS? CORTE_NOTA?
//  Aquí no hay texto de ninguna región: los rótulos o salen de la tarjeta
//  o son de la SPA y valen igual para todas.
// ════════════════════════════════════════════════════════════════
// D: datos planos de la región que se está viendo; R: lo que se deriva de D.
// Se recalculan al entrar en una región (irARegion); el selector del inicio no los usa.
let D = null;
let R = null;

// ════════════════════════════════════════════════════════════════
//  Utilidades
// ════════════════════════════════════════════════════════════════
const sp = t => (t || '').replace(/[ \t]{2,}/g, ' ').trim();
const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
const min1 = s => s.charAt(0).toLowerCase() + s.slice(1);
const bloque = (n, txt) => 'Bloque ' + n + (txt ? ' · ' + txt : '');
// Los títulos de la tarjeta vienen como «Título — qué es» o «Título · qué es»:
// la primera parte titula la pantalla y la segunda la describe.
const partir = (t, sep) => { const i = (t || '').indexOf(sep); return i < 0 ? [sp(t), ''] : [sp(t.slice(0, i)), sp(t.slice(i + sep.length))]; };
const frase1 = t => partir(t, '. ')[0];

function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, val] of Object.entries(props || {})) {
    if (k === 'class') e.className = val;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), val);
    else if (val === true) e.setAttribute(k, '');
    else if (val !== false && val != null) e.setAttribute(k, val);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(c));
  }
  return e;
}

// ════════════════════════════════════════════════════════════════
//  Lectura de los datos: todo lo que se deriva de una región, una vez
// ════════════════════════════════════════════════════════════════
function cargarRegion(d) {
  const ARBOL = Object.fromEntries(d.ARBOL.filas.map(([n, t]) => [n, t]));
  const ENLACES = d.ENLACES || {};
  const FICHAS = d.FICHAS || {};
  const GRUPOS = d.ORIENTATIVA_GRUPOS || null;
  const sind = n => d.SINDROMES.filas.find(f => f[0] === n);
  const pron = n => d.PRONOSTICO.filas.find(f => f[0] === ((d.PRONOSTICO_DE || {})[n] || n));

  // Rótulos que salen de la propia tarjeta
  const [TIT_BANDERAS, SUB_BANDERAS] = partir(d.BANDERAS.titulo, ' — ');
  const [TIT_ORIENT, SUB_ORIENT] = partir(d.ORIENTATIVA ? d.ORIENTATIVA.titulo : '', ' · ');
  const TIT_AVISO = frase1(d.SINDROMES.aviso);

  // Nodo que reparte la pregunta en botones (ENLACES[n].patrones): su primera línea
  // son pares «condición → ETIQUETA» y el resto de líneas cierra el árbol como nota.
  const NODO_PATRONES = Object.keys(ENLACES).find(n => ENLACES[n].patrones) || null;
  function patrones(n) {
    const mapa = ENLACES[n].patrones, l = ARBOL[n].split('\n')[0], i = l.indexOf('? ');
    return (i < 0 ? l : l.slice(i + 2)).split(' · ').map(s => {
      const [cond, et] = s.split(' → ');
      return { cond: sp(cond), clave: mapa[sp(et).replace(/\.$/, '')] };
    }).filter(p => p.clave);
  }
  const PATRONES = NODO_PATRONES ? patrones(NODO_PATRONES) : [];
  const CLAVE_PATRON = Object.fromEntries(PATRONES.map(p => [p.clave, p.cond]));
  const CIERRE = NODO_PATRONES ? ARBOL[NODO_PATRONES].split('\n').slice(1).join('\n') : '';
  // La nota del pronóstico se parte en dos párrafos por CORTE_NOTA; el texto no se toca
  const NOTAS_PRON = (() => {
    const t = d.PRONOSTICO.nota, i = d.CORTE_NOTA ? t.indexOf(d.CORTE_NOTA) : -1;
    return i < 0 ? [t] : [t.slice(0, i).trim(), t.slice(i).trim()];
  })();

  return { ARBOL, ENLACES, FICHAS, GRUPOS, sind, pron, TIT_BANDERAS, SUB_BANDERAS, TIT_ORIENT, SUB_ORIENT, TIT_AVISO, NODO_PATRONES, PATRONES, CLAVE_PATRON, CIERRE, NOTAS_PRON };
}

// ════════════════════════════════════════════════════════════════
//  Navegación (pila propia + botón Atrás de Android)
// ════════════════════════════════════════════════════════════════
let pila = [{ p: 'selector' }];
let hist = false;
let regionActual = null;
// Recorrido del árbol: solo en memoria (se borra al recargar); no se guarda nada en el navegador
let marcas = {};   // nodo -> 'hecho' | 'dudoso' | 'na'
let vistas = [];   // fichas de síndrome abiertas desde el árbol, en orden
const ESTADOS = [['hecho', '✓ Hecho'], ['dudoso', '? Dudoso'], ['na', '– No aplica']];
const SIMBOLO = { hecho: '✓', dudoso: '?', na: '–' };
function ir(p, arg) {
  if (p === 'sindrome' && !vistas.includes(arg)) vistas.push(arg);
  pila.push({ p, arg });
  try { history.pushState({ n: pila.length }, ''); hist = true; } catch (e) {}
  render(true);
}
// Entrar en una región desde el selector del inicio. El recorrido solo se reinicia si
// se cambia de región (para otra región, las marcas de esta no significarían nada).
function irARegion(clave) {
  if (clave !== regionActual) { marcas = {}; vistas = []; }
  regionActual = clave;
  D = DATA.DATOS[clave];
  R = cargarRegion(D);
  ir('home');
}
function volver() {
  if (pila.length <= 1) return;
  if (hist) { try { history.back(); return; } catch (e) {} }
  pila.pop(); render(true);
}
// Si la ficha ya es la pantalla anterior, vuelve en vez de apilar otra igual
function irAFicha(clave) {
  const prev = pila[pila.length - 2];
  if (prev && prev.p === 'sindrome' && prev.arg === clave) volver(); else ir('sindrome', clave);
}
window.addEventListener('popstate', () => { if (pila.length > 1) { pila.pop(); render(true); } });

// ════════════════════════════════════════════════════════════════
//  Componentes
// ════════════════════════════════════════════════════════════════
const nav = (titulo, sub, fn) => h('button', { type: 'button', class: 'nav', onclick: fn },
  h('div', { class: 'tx' }, h('b', {}, titulo), sub ? h('span', {}, sub) : null), h('i', { 'aria-hidden': 'true' }, '›'));
const big = (titulo, sub, fn) => h('button', { type: 'button', class: 'big', onclick: fn },
  h('div', { class: 'tx' }, h('b', {}, titulo), sub ? h('span', {}, sub) : null), h('i', { 'aria-hidden': 'true' }, '›'));
const nota = t => h('p', { class: 'nota pre' }, sp(t));
const pie = t => h('p', { class: 'nota' }, sp(t));
const seccion = (titulo, texto) => h('section', { class: 'card' }, h('h3', {}, titulo), h('p', { class: 'pre' }, sp(texto)));
const plegable = (titulo, contenido, abierto) => h('details', { open: !!abierto }, h('summary', {}, titulo), h('div', { class: 'in' }, contenido));
// Celdas de una fila con la etiqueta de su columna
const columnas = (fila, cabecera) => fila.slice(1).map((c, i) => h('p', {}, h('span', { class: 'lab' }, cabecera[i + 1]), sp(c)));
// URGENCIA (opcional): mismo criterio visual que en el papel (borde grueso, sin rojo), líneas literales
const urgencia = U => U && h('section', { class: 'card urgencia' }, h('p', { class: 'nombre' }, U.titulo), U.lineas.map(l => h('p', { class: 'pre' }, sp(l))));
// Botón a un destino fijo de ENLACES: { pantalla, fila?, sub? }
function botonDestino(dest) {
  if (dest.pantalla === 'banderas') return big(R.TIT_BANDERAS, dest.sub, () => ir('banderas'));
  if (dest.pantalla === 'orientativa') return D.ORIENTATIVA ? big(R.TIT_ORIENT, dest.sub, () => ir('orientativa')) : null;
  if (dest.pantalla === 'sindrome') return R.sind(dest.fila) ? big(dest.fila, dest.sub, () => irAFicha(dest.fila)) : null;
  return null;
}

// ════════════════════════════════════════════════════════════════
//  Pantallas
// ════════════════════════════════════════════════════════════════
// Selector de región (el inicio; una sola URL para las cinco). Las regiones sin datos
// todavía (tarea 4) se ven pero no se pueden abrir.
function pSelector() {
  const filas = DATA.REGIONES.map(r => r.disponible
    ? nav(r.nombre, 'Tarjeta de consulta', () => irARegion(r.region))
    : h('div', { class: 'nav pendiente', 'aria-disabled': 'true' },
        h('div', { class: 'tx' }, h('b', {}, r.nombre), h('span', {}, 'Pendiente'))));
  return { titulo: DATA.APP, home: true, nodes: [
    h('p', { class: 'sub' }, 'Elige una región.'),
    filas
  ] };
}

function pHome() {
  const n = [
    urgencia(D.URGENCIA),
    h('p', { class: 'sub' }, 'Tarjeta de consulta · guía clínica de ' + D.REGION),
    nav(R.TIT_BANDERAS, bloque(3, D.BANDERAS.filas.length + ' sospechas'), () => ir('banderas')),
    nav('Bisagra y árbol', bloque(4, 'pasivo y ' + D.ARBOL.filas.length + ' pasos · fichas de síndrome'), () => ir('arbol'))
  ];
  return { titulo: D.NOMBRE, nodes: n };
}

function pBanderas() {
  const B = D.BANDERAS;
  return { titulo: R.TIT_BANDERAS, nodes: [
    h('p', { class: 'sub' }, bloque(3, R.SUB_BANDERAS ? R.SUB_BANDERAS + '.' : '')),
    B.filas.map(f => h('section', { class: 'card' },
      h('p', { class: 'nombre' }, f[0]),
      f.slice(1).map((c, i) => h('p', {}, h('span', { class: 'lab' }, B.cabecera[i + 1]), c)))),
    nota(B.nota), pie(D.TITULOS.pieA2)
  ] };
}

const preguntaNodo = t => { const l = t.split('\n')[0]; const k = l.indexOf('?'); return sp(k < 0 ? l : l.slice(0, k + 1)); };
function marcar(n, e) { if (marcas[n] === e) delete marcas[n]; else marcas[n] = e; render(); }
function irANodo(n) { const el = document.getElementById('nodo-' + n); if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
const controlMarca = n => h('div', { class: 'marca', role: 'group', 'aria-label': 'Marcar nodo ' + n },
  ESTADOS.map(([e, t]) => h('button', { type: 'button', 'data-v': e, 'aria-pressed': String(marcas[n] === e), onclick: () => marcar(n, e) }, t)));

function chipsRecorrido() {
  return D.ARBOL.filas.map(f => f[0]).map(n => h('button', { type: 'button', class: 'paso', 'data-e': marcas[n] || '',
    'aria-label': 'Nodo ' + n + (marcas[n] ? ': ' + marcas[n] : ': sin marcar'), onclick: () => irANodo(n) },
    n + ' ' + (marcas[n] ? SIMBOLO[marcas[n]] : '·')));
}
// Cuando las cápsulas del panel salen de la pantalla por arriba, la cabecera muestra el recorrido en lugar del título
function actualizarCab() {
  const cur = pila[pila.length - 1], pasos = document.getElementById('recPasos');
  let modo = false;
  if (cur.p === 'arbol' && pasos) modo = pasos.getBoundingClientRect().bottom <= $('#cab').getBoundingClientRect().bottom;
  $('#titulo').hidden = modo; $('#cabRec').hidden = !modo;
}
window.addEventListener('scroll', actualizarCab, { passive: true });

function panelRecorrido() {
  const filas = D.ARBOL.filas, nodos = filas.map(f => f[0]);
  const cuenta = e => nodos.filter(n => marcas[n] === e).length;
  const dud = nodos.filter(n => marcas[n] === 'dudoso'), sin = nodos.filter(n => !marcas[n]);
  const alguna = nodos.some(n => marcas[n]);
  const texto = n => preguntaNodo(filas.find(f => f[0] === n)[1]);
  return h('section', { class: 'card rec', id: 'recorrido' },
    h('h3', {}, 'Recorrido'),
    h('div', { class: 'pasos', id: 'recPasos' }, chipsRecorrido()),
    !alguna ? h('p', { class: 'lin' }, 'Marca cada nodo al repasarlo: hecho, dudoso o no aplica.') : [
      h('p', { class: 'lin' }, 'Hechos ' + cuenta('hecho') + ' · Dudosos ' + dud.length + ' · No aplica ' + cuenta('na') + ' · Sin marcar ' + sin.length),
      dud.length ? [h('p', { class: 'lin' }, h('b', {}, 'Revisar')), dud.map(n => h('p', { class: 'lin' }, n + ' · ' + texto(n)))] : null,
      sin.length ? h('p', { class: 'lin' }, h('b', {}, 'Sin marcar: '), sin.join(', ')) : null],
    vistas.length ? h('p', { class: 'lin', style: 'color:var(--muted)' }, 'Fichas abiertas: ' + vistas.join(', ')) : null,
    alguna || vistas.length ? h('button', { type: 'button', class: 'ghost', onclick: () => { marcas = {}; vistas = []; render(); } }, 'Limpiar recorrido') : null);
}

// Botones de un nodo: los destinos fijos y, si reparte patrones, uno por patrón
function botonesNodo(n) {
  const e = R.ENLACES[n];
  if (!e) return null;
  const bs = (e.botones || []).map(botonDestino).filter(Boolean);
  if (n === R.NODO_PATRONES) for (const p of R.PATRONES) bs.push(big(p.clave, cap1(p.cond), () => irAFicha(p.clave)));
  return bs.length ? bs : null;
}

function pArbol() {
  const B = D.BISAGRA;
  const nodos = D.ARBOL.filas.map(([n, t]) => {
    const bs = botonesNodo(n);
    // el nodo que reparte patrones enseña solo la pregunta: los patrones son los botones
    const texto = n === R.NODO_PATRONES ? sp(t.split('\n')[0].split('? ')[0]) + '?' : sp(t);
    return h('section', { class: 'card', id: 'nodo-' + n },
      h('div', { class: 'nodo' }, h('span', { class: 'n' }, n), h('p', { class: 'pre' }, texto)),
      bs ? h('div', { class: 'acciones' }, bs) : null,
      controlMarca(n));
  });
  return { titulo: 'Bisagra y árbol', nodes: [
    h('p', { class: 'sub' }, bloque(4, 'revisa el recorrido de arriba abajo.')),
    h('div', { class: 'band pre' }, sp(D.SINDROMES.aviso)),
    panelRecorrido(),
    h('section', { class: 'card key' },
      h('p', { class: 'nombre' }, B.pregunta),
      h('p', { class: 'pre' }, sp(B.ramas).replace(/\s*\|\s*/, '\n')),
      h('p', { class: 'nota' }, sp(B.apoyo))),
    nodos, R.CIERRE ? nota(R.CIERRE) : null, pie(D.TITULOS.pieA2)
  ] };
}

function pSindrome(clave) {
  const S = D.SINDROMES, P = D.PRONOSTICO;
  const f = R.sind(clave), pr = R.pron(clave), cfg = R.FICHAS[clave] || {};
  // la pista dice por qué se ha llegado aquí: la del propio síndrome o su condición del árbol
  const pista = cfg.pista || cap1(R.CLAVE_PATRON[clave] || '');
  // síndromes sin ① ni ②: la última celda es { span: "texto" }, una sola nota combinada
  const ultima = f[f.length - 1];
  const span = ultima && typeof ultima === 'object' ? ultima.span : null;
  const celdas = span ? f.slice(1, -1) : f.slice(1);
  return { titulo: f[0], nodes: [
    pista ? h('p', { class: 'sub' }, pista) : null,
    celdas.map((c, i) => seccion(S.cabecera[i + 1], c)),
    span ? seccion(S.cabecera.slice(2).join(' · '), span) : null,
    pr ? plegable(bloque(6, 'horizonte y criterio'), columnas(pr, P.cabecera)) : null,
    plegable(R.TIT_AVISO, h('p', { class: 'pre' }, sp(S.aviso))),
    cfg.orientativa && D.ORIENTATIVA ? big('Diferencial: ' + min1(R.TIT_ORIENT), cap1(R.SUB_ORIENT), () => ir('orientativa')) : null,
    cfg.nota && S.nota ? nota(S.nota) : null,
    R.NOTAS_PRON.map(nota), pie(P.pie)
  ] };
}

// Tabla orientativa: cada fila con sus columnas etiquetadas. La agrupación,
// si la hay, es propia de la SPA y viene de ORIENTATIVA_GRUPOS.
function pOrientativa() {
  const O = D.ORIENTATIVA, P = D.PRONOSTICO, GRUPOS = R.GRUPOS;
  const dice = f => { const dc = GRUPOS && GRUPOS.dice && GRUPOS.dice[f[0]]; return dc && String(f[1]).includes(dc) ? cap1(dc) : null; };
  const plegables = [];   // solo uno abierto a la vez
  const fila = f => {
    const d = h('details', {},
      h('summary', {}, h('div', { class: 'st' }, h('b', {}, f[0]), dice(f) ? h('span', {}, dice(f)) : null)),
      h('div', { class: 'in' }, columnas(f, O.cabecera)));
    plegables.push(d);
    return d;
  };
  const grupos = GRUPOS ? GRUPOS.grupos : [{ resto: true }];
  const nombradas = grupos.reduce((a, g) => a.concat(g.filas || []), []);
  const filasDe = g => O.filas.filter(f => (g.filas || []).includes(f[0]) || (g.resto && !nombradas.includes(f[0])));
  const cuerpo = [];
  for (const g of grupos) {
    if (g.enlace) { const b = botonDestino(g.enlace); if (b) cuerpo.push(b); continue; }
    const fs = filasDe(g);
    if (!fs.length) continue;
    if (g.plegado) {
      const d = h('details', {},
        h('summary', {}, h('div', { class: 'st' }, h('b', {}, g.titulo), h('span', {}, fs.map(f => f[0]).join(' · ')))),
        h('div', { class: 'in' }, fs.map(f => h('div', { class: 'cond' },
          h('p', { class: 'nombre' }, f[0]),
          dice(f) ? h('p', { class: 'dice' }, dice(f)) : null,
          columnas(f, O.cabecera)))));
      plegables.push(d);
      cuerpo.push(d);
    } else {
      if (g.titulo) cuerpo.push(h('h3', { class: 'grupo' }, g.titulo));
      fs.forEach(f => cuerpo.push(fila(f)));
    }
  }
  plegables.forEach(d => d.addEventListener('toggle', () => { if (d.open) plegables.forEach(o => { if (o !== d) o.open = false; }); }));
  const sub = R.SUB_ORIENT ? R.SUB_ORIENT + '.' : '';
  return { titulo: R.TIT_ORIENT, nodes: [
    sub ? h('p', { class: 'sub' }, O.bloque ? bloque(O.bloque, sub) : sub) : null,
    cuerpo,
    nota(O.nota),
    GRUPOS && GRUPOS.aviso ? nota(GRUPOS.aviso) : null,
    pie(P.pie)
  ] };
}

// ════════════════════════════════════════════════════════════════
//  Render
// ════════════════════════════════════════════════════════════════
const PANTALLAS = { selector: pSelector, home: pHome, banderas: pBanderas, arbol: pArbol, sindrome: pSindrome, orientativa: pOrientativa };
const $ = s => document.querySelector(s);
$('#back').addEventListener('click', volver);

// Wake Lock (tarea 6): mantener la pantalla encendida durante la consulta. Es un
// interruptor manual (no se activa solo al entrar en una región) y, como el
// recorrido del árbol, vive solo en memoria: se pierde al recargar (decisión 1).
let wakeLock = null;
let wakeLockQuerido = false;

function actualizarBotonPantalla() {
  const boton = $('#pantalla');
  if (!boton) return;
  const activo = !!wakeLock;
  boton.setAttribute('aria-pressed', String(activo));
  boton.textContent = activo ? '◉' : '◯';
}

async function pedirWakeLock() {
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; actualizarBotonPantalla(); });
  } catch (e) {
    wakeLock = null;
  }
  actualizarBotonPantalla();
}

async function soltarWakeLock() {
  if (wakeLock) await wakeLock.release();
  wakeLock = null;
  actualizarBotonPantalla();
}

if ('wakeLock' in navigator) {
  const boton = $('#pantalla');
  boton.hidden = false;
  boton.addEventListener('click', () => {
    wakeLockQuerido = !wakeLockQuerido;
    if (wakeLockQuerido) pedirWakeLock(); else soltarWakeLock();
  });
  // El navegador suelta el wake lock solo al ocultar la pestaña; si se sigue queriendo
  // al volver a verla, hay que pedirlo de nuevo
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && wakeLockQuerido && !wakeLock) pedirWakeLock();
  });
}

function render(arriba) {
  const y = window.scrollY, cur = pila[pila.length - 1];
  const s = PANTALLAS[cur.p](cur.arg);
  document.title = cur.p === 'selector' ? DATA.APP : cur.p === 'home' ? DATA.APP + ' ' + D.NOMBRE : s.titulo + ' · ' + D.NOMBRE;
  $('#titulo').textContent = s.titulo;
  $('#back').hidden = !!s.home;
  $('#cab').classList.toggle('home', !!s.home);
  // El nombre de la región se ve siempre en la cabecera (una sola paleta: ya no lo dice el color),
  // menos en el selector y en el inicio de la región, donde ya es el título de la pantalla
  $('#regionCab').hidden = cur.p === 'selector' || cur.p === 'home';
  $('#regionCab').textContent = D ? D.NOMBRE : '';
  $('#main').replaceChildren(...[s.nodes].flat(Infinity).filter(Boolean));
  if (cur.p === 'arbol') $('#cabRec').replaceChildren(...chipsRecorrido());
  window.scrollTo(0, arriba ? 0 : y);
  actualizarCab();
}
render(true);

// PWA: uso sin conexión (tarea 5). Ruta relativa: GitHub Pages puede servir el sitio
// desde una subruta. Si falla (o el navegador no lo soporta), la SPA sigue igual,
// solo que sin caché para la próxima vez sin conexión.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
